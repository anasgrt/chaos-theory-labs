title: Lab 07 — Signal delivery and the shutdown budget
task:
  question: Why can the same application shut down cleanly in one container and be killed in another?
  brief:
    theory_source: 'docs/chaos-theory.md: §§5.13.1–5.13.2.'
    theory_sections:
    - 5.13.1
    - 5.13.2
    theory:
    - Docker stop sends the configured stop signal to the container's main process, PID 1. After the stop
      timeout it forcibly kills a container that has not exited. Here the signal is explicitly SIGTERM;
      the worker handles it, spends two seconds cleaning up, writes a marker and exits zero.
    - A shell wrapper can sit between Docker and the application. This fixture deliberately ignores TERM
      in the wrapper and starts Python as a child. The child's own handler is installed, but Docker's
      signal does not reach it. Seeing a handler in application code is therefore insufficient; inspect
      the process relationship.
    - The shell exec builtin replaces the shell with the application without creating a child. It gives
      the worker PID 1 in the second configuration. Exec fixes this delivery path; it does not add a handler
      or make slow cleanup faster. A general-purpose init can reap orphaned children, but cannot repair
      an application that ignores its own termination signal.
    - SIGTERM (15) can be handled; SIGKILL (9) cannot be caught for cleanup. A one-second stop budget
      cannot accommodate this worker's two-second cleanup, even with correct delivery. Compare TERM receipt
      with completion. Exit 137 corresponds to 128 + 9, consistent with SIGKILL, but does not identify
      its cause; check Docker's OOMKilled flag and the injected operation.
    - Container restart policies concern what happens after exit. They neither forward signals nor extend
      the shutdown budget. This experiment disables automatic restart and retains stopped containers so
      logs and exit evidence remain readable.
    main_lesson: >-
      Clean container shutdown requires both signal delivery and enough time to finish cleanup. With
      exec, the application replaces the wrapper as PID 1 and receives the stop signal directly; it
      still cannot finish two seconds of cleanup within a one-second budget. Check TERM receipt,
      completion markers and termination evidence separately, then repair the missing signal path or
      insufficient budget that the evidence identifies.
    in_this_lab:
    - Compare a non-forwarding wrapper with a five-second budget, exec with the same budget, then exec
      with one second. Only one comparison variable changes at a time.
    - start_worker copies the supplied worker into the named container, starts it, and waits for its ready
      log. The docker create command shows how PID 1 differs; docker stop shows the signal budget.
    readings:
    - signal: ready pid / ppid
      meaning: The startup log identifies whether the worker is PID 1 or a child. Wait for this log before
        stopping it.
    - signal: received / cleanup-complete
      meaning: Receipt proves delivery to Python. The completion line and file prove this fixture finished
        cleanup; absence alone needs the exit and timeout evidence.
    - signal: ExitCode / OOMKilled
      meaning: Separate a successful handler exit from a forced stop. False OOMKilled plus the controlled
        stop distinguishes this kill from the memory experiment.
    - signal: stop --timeout
      meaning: The grace budget in seconds, not an application request timeout. The Docker command itself
        can succeed even when the container was killed.
  predict: Predict the worker PID, TERM receipt, cleanup completion and exit status in all three cases.
  answer_with:
  - Why did the worker receive TERM under exec but not under the wrapper?
  - Which evidence separates signal delivery from having enough time to finish cleanup?
  - What caused each exit 137, and why is that not an OOM diagnosis?
  evidence:
    columns:
    - Case
    - Worker PID
    - TERM / cleanup
    - Exit / OOMKilled
    rows:
    - Wrapper / 5 s
    - Exec / 5 s
    - Exec / 1 s
  transfer: Would increasing the wrapper's stop budget to 30 seconds repair its missing signal forwarding?
solution:
- 'The wrapper case should report a worker PID other than 1, no received=15 line and no cleanup marker: the
  wrapper ignores TERM and does not forward it. The exec/five-second case should report PID 1, received=15,
  a completion line/file and exit zero. Cite the actual logs and Docker state for each case.'
- Both exec cases should receive TERM. Five seconds accommodates the two-second cleanup; one second should
  allow the receipt/start log but prevent the completion marker. Correct signal delivery and sufficient cleanup
  time are separate requirements.
- For the wrapper and short-budget cases, exit 137 with OOMKilled=false and the controlled docker stop operation
  is consistent with a forced shutdown after the grace budget. Exit 137 alone is not an OOM diagnosis. The
  final container-list command should be empty after evidence collection and removal.
transfer_solution: No. More time cannot make this wrapper forward a signal it ignores. Repair the process relationship or implement correct forwarding first.
verify_note: The exec/five-second case completed cleanup, the two forced cases have explicit evidence, and all three test containers are removed after evidence collection.
prerequisites: Provision the shared VM once with ./lab.sh provision. Run ./lab.sh 07 setup on the host. No other lab is required.
files:
- worker.py
- exercise.sh
commands:
- name: Start the wrapper case and confirm the worker is ready
  where: VM terminal 1
  run: !unsafe |
    source ~/labs/lab07/exercise.sh
    docker create --name ce-lab07-wrapper --stop-signal SIGTERM python:3.12-slim sh -c 'trap "" TERM; python -u /worker.py & wait'
    start_worker ce-lab07-wrapper
  record: 'Wrapper / 5 s row: the ready line, the worker PID and the parent PID.'
  expect: The wrapper is PID 1 and the Python worker is its child, so the worker PID is not 1.
- name: Stop the wrapper with five seconds and collect the result
  where: VM terminal 1, same shell
  run: !unsafe |
    time docker stop --timeout 5 ce-lab07-wrapper
    docker logs ce-lab07-wrapper
    docker inspect -f '{{json .State}}' ce-lab07-wrapper
    docker cp ce-lab07-wrapper:/cleanup-complete ~/labs/lab07/wrapper-complete.txt
  record: 'Wrapper / 5 s row: the stop time, whether received=15 and cleanup-complete appear, ExitCode
    and OOMKilled.'
  expect: The child should receive no TERM, create no marker and be forcibly stopped after the grace budget.
    A missing marker-copy source is expected in this case.
- name: Start the exec case with the same application
  where: VM terminal 1, same shell
  run: !unsafe |
    docker create --name ce-lab07-exec --stop-signal SIGTERM python:3.12-slim sh -c 'exec python -u /worker.py'
    start_worker ce-lab07-exec
  record: 'Exec / 5 s row: the ready line and the worker PID.'
  expect: Exec makes the worker PID 1 so Docker can deliver its stop signal directly.
- name: Stop exec with five seconds and collect the result
  where: VM terminal 1, same shell
  run: !unsafe |
    time docker stop --timeout 5 ce-lab07-exec
    docker logs ce-lab07-exec
    docker inspect -f '{{json .State}}' ce-lab07-exec
    docker cp ce-lab07-exec:/cleanup-complete ~/labs/lab07/exec-complete.txt
    cat ~/labs/lab07/exec-complete.txt
  record: 'Exec / 5 s row: the stop time, the TERM and cleanup logs, the marker, ExitCode and OOMKilled.'
  expect: The worker should receive TERM, finish its two-second cleanup, write completed and exit zero.
- name: Start another exec case for the shorter budget
  where: VM terminal 1, same shell
  run: !unsafe |
    docker create --name ce-lab07-short --stop-signal SIGTERM python:3.12-slim sh -c 'exec python -u /worker.py'
    start_worker ce-lab07-short
  record: 'Exec / 1 s row: the ready line and the worker PID.'
  expect: The worker is PID 1 again; the next stop changes only the time budget.
- name: Stop exec with one second and collect the result
  where: VM terminal 1, same shell
  run: !unsafe |
    time docker stop --timeout 1 ce-lab07-short
    docker logs ce-lab07-short
    docker inspect -f '{{json .State}}' ce-lab07-short
    docker cp ce-lab07-short:/cleanup-complete ~/labs/lab07/short-complete.txt
  record: 'Exec / 1 s row: the stop time, TERM receipt, whether cleanup completed, ExitCode and OOMKilled.'
  expect: TERM should reach the worker, but the one-second budget is shorter than its cleanup. A missing
    marker-copy source is expected.
- name: Remove the three stopped containers after recording evidence
  where: VM terminal 1, same shell
  run: !unsafe |
    docker rm ce-lab07-wrapper ce-lab07-exec ce-lab07-short
    docker ps -a --filter 'name=^/ce-lab07-' --format '{{.Names}}'
  record: Whether any ce-lab07 container remains, once all three rows are complete.
  expect: No ce-lab07 containers remain; the successfully copied exec-complete.txt file remains in the
    VM workspace.
setup:
- name: Prepare the shutdown evidence directory
  command: !unsafe |
    mkdir -p ~/labs/lab07
    docker image inspect python:3.12-slim >/dev/null
    rm -f ~/labs/lab07/wrapper-complete.txt ~/labs/lab07/exec-complete.txt ~/labs/lab07/short-complete.txt
verify:
- name: Check the signal fixture
  command: !unsafe |
    test -s ~/labs/lab07/worker.py
    test -z "$(docker ps -aq --filter 'name=^/ce-lab07-')"
reset:
- name: Remove only shutdown test containers
  command: !unsafe |
    docker ps -aq --filter 'name=^/ce-lab07-' | xargs -r docker rm -f
