apiVersion: v1
kind: Pod
metadata:
  name: tenant-a
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: worker
    image: python:3.12-slim
    imagePullPolicy: IfNotPresent
    command:
    - sleep
    - infinity
    resources:
      requests:
        cpu: 100m
        memory: 16Mi
      limits:
        cpu: 200m
        memory: 64Mi
