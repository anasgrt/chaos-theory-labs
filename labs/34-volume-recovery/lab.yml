title: Lab 34 — Volume binding, placement and retained data
kubernetes: true
task:
  question: Why can a claim wait, a replacement Pod keep data, and a retained volume still refuse a new
    claim?
  brief:
    theory_source: 'docs/chaos-theory.md: §§10.13.1, 10.13.2 (maintained supplement; primary references
      linked there).'
    theory_sections:
    - 10.13.1
    - 10.13.2
    theory:
    - A PersistentVolume (PV) describes storage; a PersistentVolumeClaim (PVC) requests it. Binding associates
      one claim identity with one volume. Capacity, access mode and storage class must match. This lab
      supplies one static local PV; its no-provisioner StorageClass never creates extra storage automatically.
    - WaitForFirstConsumer delays binding until the scheduler can consider a consuming Pod. A Pending
      claim without a consumer can therefore be normal. The local directory exists only on lab34-worker,
      and the PV declares that node affinity. A consumer requiring lab34-worker2 cannot satisfy both placement
      and storage topology, even when CPU, memory and storage capacity are sufficient.
    - Use nodeSelector rather than nodeName for this comparison. nodeName bypasses the scheduler, which
      is the component coordinating delayed binding. Compare claim events, PodScheduled and PV node affinity
      before treating Pending as a disk failure.
    - The Pod, PVC, PV and backing directory have different lifetimes. Replacing a Pod while retaining
      its PVC remounts the same data, with a new Pod UID. ReadWriteOnce means read-write access from one
      node; it is not a promise that only one Pod on that node can access the volume.
    - 'PVC protection defers deletion while a Pod uses the claim. A deletion timestamp and the kubernetes.io/pvc-protection
      finalizer describe this wait; the PVC can still show Bound. After the consumer disappears, claim
      deletion can finish. Do not remove the finalizer to force progress: remove the intended consumer
      and observe the controller finish its work.'
    - 'With reclaimPolicy Retain, deleting the claim leaves the PV Released and preserves backing data.
      Released is not Available: the old claim reference prevents automatic reuse by another claimant.
      Here an administrator re-registers the same retained directory as a new PV for the same learner,
      then creates a new claim. Reusing unknown retained data for another tenant would expose that data.'
    - Local persistence is not replication. If lab34-worker is unavailable, its bytes are not automatically
      accessible on another node. The declared 256 MiB PV capacity is a matching value, not a filesystem
      quota on this directory. The experiment writes one small marker and never fills the filesystem;
      deleting the private kind cluster removes this lab storage.
    main_lesson: Storage recovery depends on separate lifetimes and placement constraints. WaitForFirstConsumer
      can leave a claim Pending normally; local volume affinity can prevent scheduling; replacing a Pod
      preserves data through its claim. PVC protection delays deletion while in use, and Retain preserves
      bytes without making a Released PV reusable automatically. Diagnose binding, consumer placement
      and backing data separately, and plan replication or backup beyond local persistence.
    in_this_lab:
    - Use one 256 MiB declared local PV on lab34-worker, one 128 MiB claim and a sleeping consumer. The
      two consumer manifests differ only in nodeSelector. No external storage driver or download is needed.
    - storage_state saves native YAML for the PV, claim and consumer under each phase name, then prints
      their state. An absent optional claim or Pod is expected in some phases; API failures still stop
      the helper.
    readings:
    - signal: PVC Pending / WaitForFirstConsumer
      meaning: A claim may wait for its consumer; inspect the binding mode before diagnosing capacity.
    - signal: PodScheduled / nodeAffinity
      meaning: The consumer and local volume must share an eligible node; low live resource use cannot
        fix a topology conflict.
    - signal: deletionTimestamp / finalizers
      meaning: A delete request has started but protection can retain the object while a Pod still references
        it.
    - signal: PV Released / claimRef / marker
      meaning: Released retains the old binding identity; preserved bytes and availability to a new claim
        are separate facts.
  predict: Predict which objects and bytes survive deleting the Pod, then requesting claim deletion while
    the Pod is still running.
  answer_with:
  - Why was the first Pending claim normal, and why did the wrong-node consumer remain unscheduled?
  - Which identities changed when the Pod was replaced, and what happened to the file?
  - What delayed claim deletion, and which action allowed it to finish?
  - Why did Retain preserve the marker without making the PV Available, and what did recovery change?
  evidence:
    columns:
    - Phase
    - Observed state
    - Evidence / explanation
    rows:
    - Volume baseline
    - Claim without consumer
    - Wrong-node consumer
    - Bound consumer
    - Pod replaced
    - Claim deletion requested
    - Volume released
    - Storage restored
  transfer: Would increasing replicas make this local volume available after its only storage node is
    lost?
solution:
- The StorageClass delays binding until a consumer exists. The wrong consumer then requires worker2, while
  the only local PV requires worker. Record Pending/Unschedulable events and both constraints; the mismatch
  does not show disk exhaustion or missing CPU.
- Deleting and recreating store changes its Pod UID. Keeping the PVC retains the binding and its data,
  so the replacement on the same storage node should read learned-persistence. This is Pod replacement,
  not replicated recovery on an independent node.
- The claim receives a deletion timestamp but retains its protection finalizer while store uses it. Removing
  store lets protection clear and the claim disappear. The experiment does not manually strip a finalizer
  or delete an in-use volume.
- Retain keeps the directory and marker, while the PV remains Released with the old claim identity. Deleting
  that retained PV object and recreating its definition re-registers the same directory; the new PVC can
  then bind. New API identities do not imply new bytes. The final consumer must read the original marker.
transfer_solution: No. More Pods cannot copy or relocate the local directory. Recovery needs the storage
  node to return, or a separate replication/backup design and an appropriate volume binding; Retain alone
  supplies neither.
verify_note: The new claim is Bound, store is Ready on lab34-worker, and /data/lesson.txt still contains
  learned-persistence.
prerequisites: Provision the shared VM once with ./lab.sh provision. Run ./lab.sh 34 setup on the host.
  No other lab is required.
files:
- exercise.sh
- storage-class.yaml
- volume.yaml
- claim.yaml
- consumer.yaml
- wrong-node.yaml
commands:
- name: Inspect the available volume and its binding mode
  where: VM terminal 1, same shell
  run: !unsafe |
    source ~/labs/lab34/helpers.sh
    k get storageclass ce-lab34-local -o yaml
    storage_state baseline
    k describe pv ce-lab34-data
  record: 'Volume baseline row: PV capacity, class, node affinity, reclaim policy and phase.'
  expect: The static volume should be Available and tied to lab34-worker; the class delays binding.
- name: Create a claim without a consumer
  where: VM terminal 1, same shell
  run: !unsafe |
    k apply -f ~/labs/lab34/claim.yaml
    k wait pvc/data --for=jsonpath='{.status.phase}'=Pending --timeout=30s --request-timeout=0
    storage_state no-consumer
    k describe pvc data
  record: 'Claim without consumer row: phase, events and whether a volume has been bound.'
  expect: Pending should describe waiting for a consumer, not a failed application or full disk.
- name: Require a node that cannot use the local volume
  where: VM terminal 1, same shell
  run: !unsafe |
    k apply -f ~/labs/lab34/wrong-node.yaml
    k wait pod/store --for=jsonpath='{.status.conditions[?(@.type=="PodScheduled")].reason}'=Unschedulable --timeout=60s --request-timeout=0
    storage_state wrong-node
    k describe pod store
  record: 'Wrong-node consumer row: node selector, scheduled condition, scheduling events and claim state.'
  expect: No node can satisfy both the consumer selector and the only PV topology.
- name: Repair placement and write one marker
  where: VM terminal 1, same shell
  run: !unsafe |
    k delete pod store --wait=true --timeout=30s
    k apply -f ~/labs/lab34/consumer.yaml
    k wait pod/store --for=condition=Ready --timeout=90s --request-timeout=0
    k exec store -- sh -c 'echo learned-persistence > /data/lesson.txt'
    k exec store -- cat /data/lesson.txt
    storage_state bound
  record: 'Bound consumer row: Pod UID and node, claim and PV binding, and marker contents.'
  expect: The correct consumer should bind the claim and mount the directory on worker.
- name: Replace only the consumer
  where: VM terminal 1, same shell
  run: !unsafe |
    k delete pod store --wait=true --timeout=30s
    k apply -f ~/labs/lab34/consumer.yaml
    k wait pod/store --for=condition=Ready --timeout=90s --request-timeout=0
    k exec store -- cat /data/lesson.txt
    storage_state replaced
  record: 'Pod replaced row: old/new Pod UID, unchanged claim binding and marker contents.'
  expect: A new Pod should read the same data through the unchanged claim.
- name: Request claim deletion while it is in use
  where: VM terminal 1, same shell
  run: !unsafe |
    k delete pvc data --wait=false
    k wait pvc/data --for=jsonpath='{.metadata.deletionTimestamp}' --timeout=30s --request-timeout=0
    k get pvc data -o yaml
    k exec store -- cat /data/lesson.txt
    storage_state deleting
  record: 'Claim deletion requested row: deletion timestamp, protection finalizer, phase and consumer
    access.'
  expect: The in-use claim should remain protected even though deletion was requested.
- name: Remove the consumer and inspect retained storage
  where: VM terminal 1, same shell
  run: !unsafe |
    k delete pod store --wait=true --timeout=30s
    k wait pvc/data --for=delete --timeout=60s --request-timeout=0
    k wait pv/ce-lab34-data --for=jsonpath='{.status.phase}'=Released --timeout=60s --request-timeout=0
    storage_state released
    k get pv ce-lab34-data -o yaml
    docker exec lab34-worker cat /var/local/ce-lab34-data/lesson.txt
  record: 'Volume released row: absent claim, PV phase and old claimRef, and bytes read directly on the
    storage node.'
  expect: The claim should disappear, but the Released PV and marker should remain because of Retain.
- name: Re-register the retained directory and verify recovery
  where: VM terminal 1, same shell
  run: !unsafe |
    k delete pv ce-lab34-data --wait=true --timeout=30s
    k apply -f ~/labs/lab34/volume.yaml -f ~/labs/lab34/claim.yaml -f ~/labs/lab34/consumer.yaml
    k wait pod/store --for=condition=Ready --timeout=90s --request-timeout=0
    k exec store -- cat /data/lesson.txt
    storage_state restored
  record: 'Storage restored row: new PV/PVC identities, binding, Pod node and original marker.'
  expect: Re-registering this retained local directory should allow a fresh claim to bind without erasing
    its data.
setup:
- name: Prepare one local volume on this lab storage node
  command: !unsafe |
    cat > ~/labs/lab34/helpers.sh <<'SH'
    k() { kubectl --kubeconfig="$HOME/labs/lab34/kubeconfig" --context=kind-lab34 --namespace=ce-lab34 --request-timeout=10s "$@"; }
    source "$HOME/labs/lab34/exercise.sh"
    SH
    source ~/labs/lab34/helpers.sh
    k create namespace ce-lab34 --dry-run=client -o yaml | k apply -f -
    docker exec lab34-worker mkdir -p /var/local/ce-lab34-data
    k apply -f ~/labs/lab34/storage-class.yaml -f ~/labs/lab34/volume.yaml
    k wait pv/ce-lab34-data --for=jsonpath='{.status.phase}'=Available --timeout=60s --request-timeout=0
verify:
- name: Check the unused volume and storage topology
  command: !unsafe |
    source ~/labs/lab34/helpers.sh
    k get node lab34-worker
    k get pv ce-lab34-data -o json | jq -e '.status.phase == "Available" and .spec.persistentVolumeReclaimPolicy == "Retain"' >/dev/null
    docker exec lab34-worker test -d /var/local/ce-lab34-data
reset: []
