apiVersion: v1
kind: Pod
metadata:
  name: store
spec:
  terminationGracePeriodSeconds: 1
  nodeSelector:
    kubernetes.io/hostname: lab34-worker2
  containers:
  - name: store
    image: python:3.12-slim
    imagePullPolicy: IfNotPresent
    command:
    - sleep
    - infinity
    resources:
      requests:
        cpu: 20m
        memory: 16Mi
      limits:
        memory: 64Mi
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: data
