title: Lab 06 — Separate containers can share a full filesystem
task:
  question: Why can one container prevent another from writing to a shared filesystem?
  brief:
    theory_source: 'docs/chaos-theory.md: §5.4 and Experiment Card 5.1. The tmpfs fixture adapts the shared-storage
      example.'
    theory:
    - Containers can see different root filesystems yet share the same storage capacity. A bind mount
      exposes a host directory inside a container; mounting that same directory into two containers does
      not make two copies of its free space.
    - This experiment uses a 32 MiB tmpfs, a small memory-backed filesystem, as the shared capacity pool.
      It demonstrates the shared-capacity mechanism from the book without filling the VM’s root disk.
      It does not measure disk throughput or reproduce Docker image-layer storage.
    - A write needs both permission and available capacity. dd writes a known number of bytes; when the
      filesystem cannot hold more, it can write only part of the data and then return ENOSPC (“No space
      left on device”). A fresh container still sees the same full mount.
    - Use the identical one-MiB probe before filling, while full, and after deleting the filling file.
      A failure only in the full phase, supported by df, connects the symptom to shared capacity. CPU
      and PID cgroup limits would not create more capacity on this mount.
    main_lesson: >-
      Separate containers can consume the same filesystem's free space. When that shared mount
      fills, even a fresh container cannot write; replacing the consumer does not replenish
      capacity. The same write succeeding before and after freeing space, but failing with ENOSPC
      while full, identifies the cause. Repair the shared storage constraint rather than treating
      container isolation as storage isolation.
    in_this_lab:
    - Two disposable containers mount the same 32 MiB tmpfs. Only this small lab mount is filled.
    readings:
    - signal: dd bs=1M count=1
      meaning: Attempts to write one MiB. Record the write's error directly. In the filling command,
        df runs after dd, so the container can exit zero even though dd failed.
    - signal: df -h /data
      meaning: Shows capacity of the shared mount. Avail approaching zero supports the ENOSPC explanation.
    - signal: --rm
      meaning: Removes the container after exit. It does not delete data written into the host bind mount.
    - signal: mountpoint
      meaning: A false result after recovery confirms the temporary filesystem was unmounted.
  predict: Will a fresh container be able to write after another fills their shared mount?
  answer_with:
  - What did the same one-MiB write return when the mount was empty, full and freed?
  - Which error and capacity readings prove the failure was shared-space exhaustion?
  - Why did a fresh container still fail, and which action restored its ability to write?
  evidence:
    columns:
    - Phase
    - Probe result
    - Available space / error
    rows:
    - Empty
    - Full
    - Space freed
  transfer: Why does deleting the container that filled the mount not recover the space?
solution:
- The one-MiB probe should succeed before filling, fail while the shared mount is full, and succeed
  after the files consuming space are removed. Cite the actual exit statuses and df values for all phases.
- The filling write should reach No space left on device and df should show no available space on
  the 32 MiB tmpfs. The later probe should report the same capacity error. A permission error or a
  different mount does not establish this explanation.
- Each docker run creates a fresh container but bind-mounts the same tmpfs. Removing the writer container
  leaves its file on that shared filesystem. Deleting the filling file restores capacity; the successful
  recovery probe demonstrates that shared-space exhaustion caused the failure.
verify_note: No ce-lab06 test container remains and the shared tmpfs is unmounted.
commands:
- name: Mount and identify the bounded shared filesystem
  where: VM terminal 1
  run: !unsafe |
    mkdir -p ~/labs/lab06/shared
    if mountpoint -q "$HOME/labs/lab06/shared"; then
      echo 'STOP: a previous mount remains. Complete recovery or reset before restarting.'
    else
      sudo mount -t tmpfs -o size=32m tmpfs "$HOME/labs/lab06/shared"
    fi
    findmnt --mountpoint "$HOME/labs/lab06/shared" -o TARGET,FSTYPE,SIZE,AVAIL
  expect: This exact lab path is a tmpfs with 32 MiB total capacity. Stop if the mount failed or a
    previous experiment remains.
  record: 'Preconditions: the mountpoint, the filesystem type and the total capacity.'
- name: Baseline - write one MiB before filling
  where: VM terminal 1
  run: !unsafe |
    docker run --rm --name ce-lab06-writer -v "$HOME/labs/lab06/shared:/data" ubuntu:24.04 sh -c 'dd if=/dev/zero of=/data/probe bs=1M count=1'
    echo "baseline probe exit=$?"
    df -h ~/labs/lab06/shared
    sudo rm -f ~/labs/lab06/shared/probe
  expect: The one-MiB write succeeds before space is consumed.
  record: 'Empty row: the probe''s exit status and the available space after the write.'
- name: Fill the 32 MiB tmpfs from one container
  where: VM terminal 1
  run: !unsafe |
    if [ "$(findmnt --mountpoint "$HOME/labs/lab06/shared" --noheadings --output FSTYPE)" = tmpfs ]; then
      docker run --rm --name ce-lab06-writer -v "$HOME/labs/lab06/shared:/data" ubuntu:24.04 sh -c 'dd if=/dev/zero of=/data/full bs=1M count=40; echo "filling dd exit=$?"; df -h /data'
    else
      echo 'STOP: the dedicated tmpfs is not mounted. Do not run the full-filesystem probe.'
    fi
  expect: The 40 MiB attempt exceeds the 32 MiB mount, dd reports No space left on device and df shows
    no available space. The printed dd status is the write's status; df may leave the container status zero.
  record: 'Filling write: its exact error, its exit status and the df capacity.'
- name: Repeat the probe from a fresh container while full
  where: VM terminal 1
  run: !unsafe |
    docker run --rm --name ce-lab06-writer -v "$HOME/labs/lab06/shared:/data" ubuntu:24.04 sh -c 'dd if=/dev/zero of=/data/probe bs=1M count=1'
    echo "full probe exit=$?"
    df -h ~/labs/lab06/shared
  expect: This new container's one-MiB write also fails with No space left on device and a nonzero status.
  record: 'Full row: the probe''s exit status, its exact error and the available capacity.'
- name: Free capacity and repeat the identical write
  where: VM terminal 1
  run: !unsafe |
    sudo rm -f ~/labs/lab06/shared/full ~/labs/lab06/shared/probe
    docker run --rm --name ce-lab06-writer -v "$HOME/labs/lab06/shared:/data" ubuntu:24.04 sh -c 'dd if=/dev/zero of=/data/probe bs=1M count=1'
    echo "recovered probe exit=$?"
    df -h ~/labs/lab06/shared
  expect: The same probe succeeds after capacity is freed.
  record: 'Space freed row: the probe''s exit status and the available space.'
- name: Remove the probe and unmount the temporary filesystem
  where: VM terminal 1
  run: !unsafe |
    sudo rm -f ~/labs/lab06/shared/probe
    sudo umount ~/labs/lab06/shared
    mountpoint ~/labs/lab06/shared; echo "status=$? (nonzero means unmounted)"
    docker ps -a --filter 'name=^/ce-lab06-'
  expect: The directory is no longer a mountpoint and no ce-lab06 container remains.
  record: 'Cleanup: the mountpoint result and the container listing.'
setup:
- name: Create the Lab 06 shared-path mountpoint
  command: !unsafe |
    mkdir -p "$HOME/labs/lab06/shared"
verify:
- name: Verify the clean container-limit baseline
  command: !unsafe |
    test -z "$(docker ps -aq --filter 'name=^/ce-lab06-')"
    ! mountpoint -q "$HOME/labs/lab06/shared"
reset:
- name: Remove only Lab 06 containers and tmpfs
  command: !unsafe |
    docker ps -aq --filter 'name=^/ce-lab06-' | xargs -r docker rm -f
    if mountpoint -q "$HOME/labs/lab06/shared"; then sudo umount "$HOME/labs/lab06/shared"; fi
    rm -f "$HOME/labs/lab06/shared/full" "$HOME/labs/lab06/shared/probe"
prerequisites: Provision the shared VM once with ./lab.sh provision. Run ./lab.sh 06 setup on the host. No other lab is required.
transfer_solution: Its file is stored in the host bind mount, outside the disposable container layer.
  Remove that file or the temporary filesystem to release the capacity.
