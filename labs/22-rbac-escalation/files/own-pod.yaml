apiVersion: v1
kind: Pod
metadata:
  name: builder-pod
  labels: {app: builder-pod}
spec:
  serviceAccountName: builder
  containers:
  - name: probe
    image: python:3.12-slim
    command: [sleep, "86400"]
    volumeMounts:
    - {name: scripts, mountPath: /scripts, readOnly: true}
  volumes:
  - name: scripts
    configMap: {name: rbac-scripts}
