apiVersion: v1
kind: PersistentVolume
metadata:
  name: ce-lab24-data
spec:
  capacity:
    storage: 256Mi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ce-lab24-local
  local:
    path: /var/local/ce-lab24-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - lab24-worker
