apiVersion: apps/v1
kind: Deployment
metadata:
  name: drain-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drain-web
  template:
    metadata:
      labels:
        app: drain-web
        case: short-grace
    spec:
      terminationGracePeriodSeconds: 1
      volumes:
      - name: scripts
        configMap:
          name: drain-scripts
      containers:
      - name: web
        image: python:3.12-slim
        command:
        - python
        - -u
        - /scripts/drain-server.py
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        resources:
          requests:
            cpu: 20m
            memory: 16Mi
          limits:
            memory: 128Mi
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - '5'
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 1
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: REQUEST_SECONDS
          value: '2'
        - name: SHUTDOWN
          value: abrupt
