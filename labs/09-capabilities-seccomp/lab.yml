title: Lab 09 — A syscall denial need not crash the process
task:
  question: What changes when the same process installs a filter that denies getpid?
  brief:
    theory_source: 'docs/chaos-theory.md: §§6.2 and 6.5.2 (syscalls and libseccomp).'
    theory:
    - 'seccomp is a kernel filter on a process’s syscall attempts. A filter can allow a call, return a
      chosen error, or use other actions. This example allows calls by default and adds one rule: getpid
      returns EACCES. It installs the policy inside its own process using libseccomp.'
    - The program calls syscall(SYS_getpid) directly before and after loading the filter. That makes the
      kernel-boundary test explicit rather than relying on a library’s implementation of getpid. Before
      filtering a successful call returns a positive PID; an error through syscall returns -1 and sets
      errno.
    - Returning an error is not the same as killing the process. write and process-exit operations remain
      allowed, so the program can print the denied result and finish. Its exit status reports whether
      the demonstration’s check passed; it is not the getpid return value.
    - A loaded filter applies to the test process and is inherited by descendants. Freeing the userspace
      libseccomp context does not remove the kernel policy. The process cannot simply undo the filter;
      ending it ends this experiment. A fresh process launched by the original shell does not inherit
      a filter installed only in the child.
    in_this_lab:
    - Setup compiles filter.c. Running ./filter changes only that test process’s syscall policy. No container
      is required.
    readings:
    - signal: getpid result
      meaning: A positive number is a successful PID result. -1 indicates a syscall error; read errno
        with it.
    - signal: errno=13
      meaning: 'EACCES: the rule’s chosen permission-denied error. Only interpret errno after an error
        return.'
    - signal: exit
      meaning: 0 means the expected denial was observed; 1–3 mean filter setup failed; 4 means the observation
        did not match the rule.
    - signal: Seccomp
      meaning: In /proc/self/status, 0 means disabled and 2 means filter mode. This reports the reading
        process’s state, not proof of which syscall was denied.
  predict: Predict getpid’s result before and after the filter, and whether the program can still print
    the error.
  answer_with: Explain the positive PID before filtering, the error afterward and why exit 0 means the
    demonstration detected the intended denial.
  evidence:
    columns:
    - Phase
    - Syscall result
    - errno / process exit
    rows:
    - Before filter
    - After filter
    - Fresh process
  transfer: Would seccomp_release restore getpid inside the filtered process?
solution: Before the filter, getpid returns the process ID. Afterward, the filter makes it return -1 with
  errno 13 (EACCES). Printing still works because the filter allows other syscalls. The program’s exit
  0 reports a successful check of the denial, not a successful getpid call. Exit 1–3 means filter setup
  failed; exit 4 means the expected denial was not observed.
verify_note: The demonstration has exited; the filter was scoped to that process. Reset removes the compiled
  fixture.
commands:
- name: Run the prepared seccomp demonstration
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab09
    ./filter; echo "exit=$?"
  expect: Before filtering, getpid prints a positive PID. After filtering, getpid result=-1 errno=13 and
    exit=0. Exit 1–3 means filter setup failed; 4 means the expected denial did not occur.
- name: Check an unrelated process after the test exits
  where: VM terminal 1
  run: !unsafe |
    grep Seccomp /proc/self/status
  expect: This fresh process has its own Seccomp state. An existing inherited filter can be present; the
    test did not install a host-wide policy.
setup:
- name: Create the Lab 09 workspace
  command: !unsafe |
    mkdir -p "$HOME/labs/lab09"
- name: Build the seccomp demonstration
  command: !unsafe |
    mkdir -p ~/labs/lab09 && cd ~/labs/lab09
    cat > filter.c <<'C'
    #include <seccomp.h>
    #include <unistd.h>
    #include <sys/syscall.h>
    #include <errno.h>
    #include <stdio.h>
    int main(void) {
        printf("before filter: getpid=%ld\n", syscall(SYS_getpid));
        scmp_filter_ctx ctx = seccomp_init(SCMP_ACT_ALLOW);
        if (!ctx) return 1;
        if (seccomp_rule_add(ctx, SCMP_ACT_ERRNO(EACCES), SCMP_SYS(getpid), 0) < 0)
            return 2;
        if (seccomp_load(ctx) < 0) return 3;
        seccomp_release(ctx);
        errno = 0;
        long r = syscall(SYS_getpid);
        printf("getpid result=%ld errno=%d\n", r, errno);
        return (r == -1 && errno == EACCES) ? 0 : 4;
    }
    C
    cc -Wall -Wextra filter.c -lseccomp -o filter
verify:
- name: Verify seccomp build prerequisites
  command: !unsafe |
    test -f /usr/include/seccomp.h
    test -s "$HOME/labs/lab09/filter"
    test -x "$HOME/labs/lab09/filter"
reset:
- name: Remove only the Lab 09 compiled filter
  command: !unsafe |
    rm -f "$HOME/labs/lab09/filter"
prerequisites: Provision the shared VM once with ./lab.sh provision. Run ./lab.sh 09 setup, then ./lab.sh ssh. No other lab is required.
transfer_solution: No. It frees the library context in userspace. The kernel filter remains installed;
  the demonstration’s later getpid call tests exactly this.
