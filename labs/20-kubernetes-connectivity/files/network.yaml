apiVersion: v1
kind: Pod
metadata:
  name: client
  labels:
    app: client
spec:
  terminationGracePeriodSeconds: 2
  containers:
  - name: web
    image: python:3.12-slim
    command:
    - python
    - -c
    - import time; time.sleep(86400)
    resources:
      requests:
        cpu: 20m
        memory: 16Mi
      limits:
        memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 8080
