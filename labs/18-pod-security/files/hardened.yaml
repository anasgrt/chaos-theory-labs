apiVersion: v1
kind: Pod
metadata:
  name: hardened
  labels:
    app: privilege-demo
spec:
  terminationGracePeriodSeconds: 2
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: python:3.12-slim
    command:
    - python
    - -u
    - -c
    - import time; time.sleep(3600)
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 20m
        memory: 16Mi
      limits:
        memory: 128Mi
