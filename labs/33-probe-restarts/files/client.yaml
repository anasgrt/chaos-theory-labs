apiVersion: v1
kind: Pod
metadata:
  name: client
spec:
  containers:
  - name: client
    image: python:3.12-slim
    imagePullPolicy: IfNotPresent
    command:
    - sleep
    - infinity
    volumeMounts:
    - name: scripts
      mountPath: /scripts
      readOnly: true
  volumes:
  - name: scripts
    configMap:
      name: probe-scripts
