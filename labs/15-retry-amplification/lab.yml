title: Lab 15 — Count how layered retries multiply work
units: [ce-lab15.service]
task:
  question: How much extra backend work do layered retries create when the same dependency keeps failing?
  brief:
    theory_source: 'docs/chaos-theory.md: §1.2.3 (emergent retry amplification), §12.1.4 (ingress retry
      accumulation). This fixture isolates attempt multiplication using HTTP 503.'
    theory:
    - 'An original user request is not the same as an attempt. One retry means up to two attempts. When
      a client retries a proxy call and the proxy retries each upstream call, the per-layer attempt limits
      multiply: at most client attempts × proxy attempts backend arrivals per original request.'
    - Here HTTP 503 means Service Unavailable. NGINX can make two upstream attempts for that response,
      and the client makes either one or two proxy attempts. Both upstreams deliberately return 503 throughout
      the fault phase. A successful attempt stops retries early, so the maximum is reached only when the
      earlier attempts continue failing.
    - Measure amplification as backend arrivals / original requests, and useful work as successful original
      requests / original requests. More attempts do not imply more successes. Keep the original request
      count and failure condition identical when changing the client retry count.
    - Layered retry amplification is the first step in the book’s emergent retry-storm example. This small,
      sequential experiment isolates multiplication; it does not simulate overloaded worker queues or
      prove self-sustaining failure. In a real system, retries of slow requests may add work while earlier
      attempts are still running; bounded attempts, a total deadline and backoff address different parts
      of that problem.
    main_lesson: >-
      Retries at multiple layers multiply backend attempts, not successful user requests. Under
      persistent failure, two client attempts with two proxy attempts can create four backend
      arrivals for one original request without any success. Count original requests, attempts and
      useful results separately; bound retry work and total waiting time rather than assuming more
      attempts improve resilience. This comparison demonstrates amplification, not a complete retry
      storm.
    in_this_lab:
    - 'Each case sends 20 sequential requests in three phases: healthy, both upstreams returning HTTP
      503, and recovered. NGINX allows two upstream attempts. Repeat with zero and one client retry. The
      runner owns its proxy inside ce-lab15.service, has a 60-second runtime limit, and removes the fault
      and processes on exit. Reset stops that unit and its children.'
    - retry_case takes the client retry count (0 or 1), runs baseline, failure and recovery under a 60-second
      limit, and saves the full output. A nonzero runner status means the experiment did not complete
      cleanly.
    readings:
    - signal: original / client attempts
      meaning: Each case has 20 original requests. Count all proxy attempts, including retries, separately.
    - signal: backend arrivals
      meaning: Sum the two upstream request logs within the phase. Probe and health requests are excluded.
    - signal: amplification
      meaning: backend arrivals / 20. Compare it with the theoretical upper bound; fewer arrivals can
        indicate early success or a failure before reaching a backend.
    - signal: successes
      meaning: Counts original requests ending in HTTP 200, not the number of attempts. Compare outcomes
        alongside cost.
  predict: For 20 requests, calculate the maximum backend arrivals with zero versus one client retry,
    given two proxy attempts. Predict success counts during a persistent 503 fault.
  answer_with:
  - What were the client attempts, backend arrivals and successes in each of the six phases?
  - What is the maximum backend arrivals for zero and for one client retry?
  - Why did the extra attempts add no successful requests, and what did cleanup show?
  evidence:
    columns:
    - Case / phase
    - Client attempts
    - Backend arrivals / amplification
    - Successes / 20
    rows:
    - 'No client retry: baseline'
    - 'No client retry: 503 fault'
    - 'No client retry: recovered'
    - 'One client retry: baseline'
    - 'One client retry: 503 fault'
    - 'One client retry: recovered'
  transfer: If both layers permit three retries, what is the maximum amplification?
solution:
- Use the six printed phase summaries as your measurements. Each phase submits 20 originals; amplification
  is backend_arrivals / 20 and success fraction is successes / 20. Check both runner exits are zero before
  comparing cases.
- With zero client retries, 20 originals x 1 client attempt x 2 proxy attempts allows 40 backend arrivals (2x).
  One client retry allows 20 x 2 x 2 = 80 (4x). Persistent 503 should reach those bounds in this fixture; explain
  any lower observed count from the logs rather than replacing it with the prediction.
- Both fault cases can finish with zero successes because every backend attempt returns 503. Healthy and recovered
  phases should need 20 client attempts and 20 backend arrivals for 20 successes because the first success
  ends retrying. No fail marker or listeners on 8090, 9001 and 9002 confirms the runner removed its fault and
  processes. This establishes work multiplication, not a self-sustaining overload.
verify_note: Each runner removes the fail marker and stops its own upstreams and proxy. Both recovered
  phases should return 20/20 successes.
commands:
- name: Run the three phases with zero client retries
  where: VM terminal 1
  run: !unsafe |
    source ~/labs/lab15/exercise.sh
    retry_case 0
    echo "runner exit=$? (0 means the experiment completed)"
  record: 'No client retry rows, baseline to recovered: the three phase summaries and the runner exit.
    Stop if it is nonzero.'
  expect: The runner measures healthy, persistent-503 and recovered phases in order, with 20 originals
    each. It removes the fault on exit.
- name: Change only the client retry count from zero to one
  where: VM terminal 1, same shell
  run: !unsafe |
    retry_case 1
    echo "runner exit=$? (0 means the experiment completed)"
  record: 'One client retry rows, baseline to recovered: the three phase summaries and the runner exit.'
  expect: A client retry can double backend work while both upstreams keep failing. Successful phases
    end retrying after the first success.
- name: Compare the six summaries and confirm cleanup
  where: VM terminal 1, same shell
  run: !unsafe |
    cd ~/labs/lab15
    cat no-client-retry.txt one-client-retry.txt
    test ! -e fail && echo 'fault marker removed'
    ss -ltn '( sport = :8090 or sport = :9001 or sport = :9002 )'
  record: Backend arrivals divided by 20 for both fault phases, the success fractions, and the cleanup
    results.
  expect: The saved summaries retain both cases. The fault marker is absent and no listeners remain on
    the three lab ports.
setup:
- name: Check the isolated retry fixture
  command: !unsafe |
    mkdir -p "$HOME/labs/lab15/nginx"
    nginx -t -p "$HOME/labs/lab15/nginx/" -c "$HOME/labs/lab15/nginx.conf"
verify:
- name: Verify free ports and clean fault state
  command: !unsafe |
    test ! -e "$HOME/labs/lab15/fail"
    test -s "$HOME/labs/lab15/run-case.sh"
    test -z "$(ss -H -ltn '( sport = :8090 or sport = :9001 or sport = :9002 )')"
reset: []
prerequisites: Provision the shared VM once with ./lab.sh provision. Run ./lab.sh 15 setup on the host. No other lab is required.
transfer_solution: Three retries means four attempts at each layer, so at most 4 × 4 = 16 backend arrivals
  per original request, provided every attempt reaches the backend and keeps failing.
files:
- upstream.py
- client.py
- run-case.sh
- nginx.conf
- exercise.sh
