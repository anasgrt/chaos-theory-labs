title: Lab 02 — Prove why a process was killed
units: [ce-lab02.service]
task:
  question: Why is exit status 137 insufficient to diagnose an OOM kill?
  brief:
    theory_source: 'docs/chaos-theory.md: §2.3 (exit codes, signals and OOM), §5.5.2 (memory limits).'
    theory:
    - 'A signal is a notification sent to a process. SIGTERM (15) can be handled for cleanup; SIGKILL
      (9) cannot be caught. Bash commonly reports signal termination as 128 + signal number, so a SIGKILL
      gives 137. A program may also explicitly exit with 137: status alone is not a diagnosis.'
    - 'The kernel can invoke the out-of-memory (OOM) killer when it cannot satisfy memory demand. A cgroup
      has its own memory boundary: its processes can hit MemoryMax even while the rest of the VM has available
      memory. The allocator here repeatedly creates and touches bytes, so it demands real memory rather
      than merely reserving virtual addresses.'
    - MemoryMax=128M and MemorySwapMax=0 constrain this experiment. RuntimeMaxSec=20s is a separate time
      bound. An OOM kill, that timer, and a deliberate SIGKILL can all stop the process; identify which
      happened by matching the unit, PID and time in the logs.
    - The systemd-run command reports the transient unit’s outcome; its shell status need not equal the
      child’s Bash status. Collect the unit result and kernel evidence. systemd-oomd is a userspace memory-pressure
      killer, so an oomd action is a different cause from a kernel OOM kill.
    main_lesson: >-
      An exit code describes an outcome, not its cause. Exit 137 is consistent with SIGKILL, but
      cannot distinguish a deliberate kill from memory exhaustion or another cause; a cgroup can run
      out of memory while the VM still has available memory. Diagnose termination by matching the PID, time,
      unit result and kernel or userspace-killer logs before deciding what to repair.
    in_this_lab:
    - The allocator runs only in ce-lab02, with 128 MiB memory, no swap and a 20-second runtime bound.
    readings:
    - signal: deliberate KILL exit
      meaning: Read $? immediately after the process. An intervening command would replace it.
    - signal: journalctl -u ce-lab02
      meaning: 'Look for the recorded termination signal and result: oom-kill and timeout describe different
        causes.'
    - signal: journalctl -k
      meaning: Match a memory-cgroup OOM / Killed process line to this allocator and experiment time.
    - signal: journalctl -u systemd-oomd
      meaning: A matching userspace-kill entry changes the diagnosis; unrelated historical entries do
        not.
  predict: Will a deliberate SIGKILL and a memory-limit kill have different exit statuses? Which evidence
    can distinguish them?
  answer_with:
  - What exit status did the deliberate SIGKILL produce, and why is its cause certain?
  - What terminated the memory-limited allocator, and which log lines prove it?
  - Why can neither 137 nor the systemd-run status diagnose an OOM kill alone?
  evidence:
    columns:
    - Case
    - Termination
    - Matching cause evidence
    rows:
    - Known SIGKILL
    - Memory-limited allocator
  transfer: Does free memory elsewhere in the VM rule out a cgroup OOM kill?
solution:
- Bash should report 137 for the deliberate SIGKILL. The command explicitly sends signal 9 to its own
  PID, so its cause is known without inferring it from the status.
- The allocator should exceed its 128 MiB cgroup limit before the 20-second runtime bound. A unit
  result of oom-kill together with a matching kernel memory-cgroup kill identifies a kernel OOM kill.
  Match the allocator PID and the saved time window. If the evidence shows timeout or a matching
  systemd-oomd action instead, report that cause; missing evidence leaves the diagnosis unproven.
- 137 is consistent with SIGKILL but does not explain who sent it or why; a program can also exit 137
  explicitly. systemd-run reports the unit outcome and need not return the child's Bash exit status.
  The unit and matching cause evidence supply the diagnosis.
verify_note: The allocator is stopped and its termination evidence has been recorded.
commands:
- name: Check the memory controller and unit state
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab02
    cat /sys/fs/cgroup/cgroup.controllers
    systemctl is-active ce-lab02.service; echo "unit status=$? (nonzero means not active)"
  expect: The memory controller is available and no previous ce-lab02 allocator is active. Stop if either
    prerequisite is missing.
  record: 'Preconditions: the memory controller listing and the ce-lab02 unit state. Stop if either is
    wrong.'
- name: Record a deliberate SIGKILL
  where: VM terminal 1
  run: !unsafe |
    python3 -c 'import os,signal; os.kill(os.getpid(),signal.SIGKILL)'
    echo "deliberate KILL exit=$?"
  expect: Bash normally reports 137. Here you know the cause because the program deliberately sent SIGKILL.
  record: 'Known SIGKILL row: the printed exit status, and that the program signalled itself.'
- name: Run the allocator within its memory and time limits
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab02
    date --iso-8601=seconds > started-at.txt
    sudo systemd-run --unit=ce-lab02 --wait --collect \
      -p MemoryMax=128M -p MemorySwapMax=0 -p RuntimeMaxSec=20s \
      /usr/bin/python3 "$HOME/labs/lab02/allocate.py"
    echo "systemd-run exit=$? (unit outcome, not the child's Bash status)"
    date --iso-8601=seconds > ended-at.txt
  expect: The unit should fail before its 20-second runtime bound. Its nonzero command status alone does
    not identify the cause; the next step collects the evidence.
  record: 'Allocator run: the printed systemd-run status and the start and end timestamps.'
- name: Match the termination to the unit and kernel logs
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab02
    since=$(cat started-at.txt)
    cat started-at.txt ended-at.txt
    sudo journalctl -u ce-lab02 --since "$since" --no-pager | tee unit.log
    sudo journalctl -k --since "$since" --grep="oom|Killed process" --case-sensitive=no --no-pager | tee kernel.log
    sudo journalctl -u systemd-oomd --since "$since" --no-pager | tee oomd.log
  expect: A kernel OOM diagnosis requires the unit's oom-kill result and matching allocator PID in the
    kernel log. A matching oomd action or runtime timeout gives a different diagnosis.
  record: 'Memory-limited allocator row: the PID, the termination result and the exact matching log lines.'
- name: Stop the allocator if it remains active
  where: VM terminal 1
  run: !unsafe |
    sudo systemctl stop ce-lab02.service 2>/dev/null || true
    systemctl is-active ce-lab02.service; echo "unit status=$? (nonzero means not active)"
  expect: ce-lab02 is inactive or already collected; no allocator remains active.
  record: Final ce-lab02 unit state after stopping any leftover allocator.
setup:
- name: Create the Lab 02 workspace
  command: !unsafe |
    mkdir -p "$HOME/labs/lab02"
verify:
- name: Verify memory-control readiness
  command: !unsafe |
    grep -qw memory /sys/fs/cgroup/cgroup.controllers
    ! systemctl is-active --quiet ce-lab02.service
reset: []
prerequisites: Provision the shared VM once with ./lab.sh provision. Run ./lab.sh 02 setup on the host. No other lab is required.
transfer_solution: No. The allocator is constrained by its cgroup boundary. VM-wide availability and the
  cgroup’s remaining allowance are different quantities.
files:
- allocate.py
