title: Lab 26 — Secret encryption and key-loss recovery
kubernetes: true
task:
  question: How can the API return the same Secret while storage changes, and why can a live API lose
    access to it?
  brief:
    theory_source: 'docs/chaos-theory.md: §§12.11.1, 12.11.2 (maintained supplement; primary references
      linked there).'
    theory_sections:
    - 12.11.1
    - 12.11.2
    theory:
    - Base64 is an encoding, not encryption. An authorized Secret API read returns the data regardless
      of whether the API server encrypts its storage representation. To test at-rest protection, inspect
      the etcd record as well as the decoded API value; the two observations answer different questions.
    - 'For a configured resource, the first encryption provider writes new records. Here aescbc uses a
      randomly generated local key named lab-key1. The later identity provider allows existing plaintext
      records to remain readable. Enabling that configuration does not retroactively rewrite older records:
      the legacy Secret stays plaintext until a later API update stores it again.'
    - This fixture changes one harmless annotation to force a legacy record update without changing its
      password. Compare its saved bytes before and after that update. The encryption prefix identifies
      a provider and key name; the marker no longer appears in the stored value. This demonstrates a changed
      storage representation, not a complete cryptographic or backup audit.
    - The second configuration deliberately contains a different key and omits lab-key1. Installing it
      restarts this private cluster API server, so an old in-memory Secret response cannot hide the missing
      decryption key. Process liveness and the running manifest can recover while reading a record encrypted
      under the omitted key fails. Record the actual read error and exit status; do not infer data loss
      from an API failure alone.
    - Restoring the original key configuration makes the existing ciphertext readable again without deleting
      or recreating the Secret. The final state remains encrypted. Removing encryption configuration while
      ciphertext remains would not be a valid recovery. Proper rotation retains old decryption keys until
      required records and retained backups have been migrated or can still be restored safely.
    - The encryption rule covers all Secrets in this private cluster, not only ce-lab26. The exercise
      reads only two toy records and generates fresh keys per setup. install_provider replaces the static
      Pod manifest through Docker, so recovery does not depend on a working Kubernetes API. It stages
      the file outside the watched manifests directory, then moves it into place.
    - Encryption at rest does not revoke authorized API access or protect data from an administrator who
      possesses both the stored records and the local key file. This local aescbc fixture makes the mechanism
      visible; it is not a production key-management design. Review managed KMS integration, authorization,
      protected backups and restoration together. Cluster reset removes this disposable cluster and its
      lab keys.
    main_lesson: 'Verify Secret protection at the storage boundary: base64 is reversible, and authorized
      API reads still reveal decrypted values. Enabling encryption protects new writes; existing records
      need a rewrite. A live API can fail to read ciphertext when its key is missing, while restoring
      that key recovers the unchanged record. Protect key availability and backups alongside confidentiality,
      and retain old keys until migration is complete.'
    in_this_lab:
    - Use two toy Secrets with password ce-lab26-demo. legacy exists before encryption; fresh is created
      afterward. Never substitute real credentials. Both providers and static Pod variants are prepared
      automatically in this private cluster.
    - provider_summary prints key names, never key material. stored_secret reads one exact etcd record,
      saves its raw bytes under the phase name and reports its prefix and whether the toy password is
      visible. A missing record or failed read is an error, not evidence of plaintext or encryption.
    - install_provider key1 or key2 changes only this lab API server manifest. wait_provider checks liveness
      and the running mirror Pod configuration for up to 90 attempts, with two-second pauses; API request
      time adds to this wait. Secret readability is checked separately.
    readings:
    - signal: API value / exit status
      meaning: A readable API value proves access and decryption, not that the etcd record is plaintext.
    - signal: storage_prefix / demo_password_visible
      meaning: Compare raw record representations before and after a write; an absent record cannot establish
        encryption.
    - signal: provider key names / mirror Pod
      meaning: The configured key must match the stored record; wait for the restarted API server before
        testing the missing-key fault.
    - signal: livez / readyz / Secret read
      meaning: Process health, readiness checks and the ability to decrypt a particular record are distinct
        observations.
  predict: Predict whether enabling encryption changes the legacy record immediately, and whether a live
    API can read ciphertext after losing its key.
  answer_with:
  - Why did the API show the same value for plaintext and encrypted storage?
  - Why did legacy remain plaintext until the annotation update?
  - What proves the missing-key fault changed readability without deleting the stored record?
  - Why did restoring key1 recover the data, and what must real key rotation preserve?
  evidence:
    columns:
    - Phase
    - Observed state
    - Evidence / explanation
    rows:
    - Plaintext baseline
    - Encryption enabled
    - New encrypted write
    - Legacy rewritten
    - Missing decryption key
    - Key restored
  transfer: Would encrypting etcd prevent a principal with permission to read this Secret through the
    API from obtaining its value?
solution:
- The API server transforms stored records on reads and writes. Its authorized response still contains
  the same base64-encoded data, and secret_value decodes it. Only the separate etcd observation distinguishes
  the plaintext marker from the encrypted record in this experiment.
- Changing provider configuration affects subsequent writes. identity keeps old plaintext readable, but
  does not migrate it. Updating the annotation writes the existing object through the first provider;
  the password remains ce-lab26-demo while its stored prefix changes to the key1 encryption prefix.
- 'After the key2 manifest is running, record a live API response and the failed fresh Secret read with
  its error and nonzero status. stored_secret should still find the key1-prefixed record. An unreadable
  record is not necessarily absent or corrupt: its matching key is unavailable to this API server.'
- The restored key1 configuration can decrypt the same stored record, so both Secret values return without
  recreation. Verify their storage prefixes too. Rotation must keep required old keys readable while new
  writes migrate; backup restoration may still require older keys after live records have moved.
transfer_solution: No. The API decrypts an authorized read. Encryption at rest addresses access to stored
  bytes; least-privilege authorization and workload access controls remain necessary. Protecting local
  key files or using an appropriate KMS is also a separate responsibility.
verify_note: The key1 API server is ready; legacy and fresh return ce-lab26-demo, and both stored records
  retain the lab-key1 encryption prefix.
prerequisites: Provision the shared VM once with ./lab.sh provision. Run ./lab.sh 26 setup on the host.
  No other lab is required.
files:
- prepare.py
- storage_probe.py
- exercise.sh
commands:
- name: Compare the API value with the original storage record
  where: VM terminal 1, same shell
  run: !unsafe |
    source ~/labs/lab26/helpers.sh
    secret_value legacy
    stored_secret legacy baseline
  record: 'Plaintext baseline row: decoded API value, raw storage prefix and toy-password visibility.'
  expect: The toy value should be readable and visible inside the original unencrypted storage record.
- name: Enable encryption and inspect the unchanged old record
  where: VM terminal 1, same shell
  run: !unsafe |
    provider_summary key1
    install_provider key1
    wait_provider key1
    secret_value legacy
    stored_secret legacy enabled
  record: 'Encryption enabled row: active key name, API value and the legacy storage representation.'
  expect: 'The old record should still be plaintext: changing configuration has not rewritten it.'
- name: Write a new Secret through the encrypted API server
  where: VM terminal 1, same shell
  run: !unsafe |
    k create secret generic fresh --from-literal=password=ce-lab26-demo
    secret_value fresh
    stored_secret fresh new-write
  record: 'New encrypted write row: unchanged toy value, storage prefix and marker visibility.'
  expect: 'The new record should use k8s:enc:aescbc:v1:lab-key1: and hide the toy marker in its stored
    bytes.'
- name: Rewrite the legacy record without changing its value
  where: VM terminal 1, same shell
  run: !unsafe |
    k annotate secret legacy ce-lab26/rewrite=encrypted --overwrite
    secret_value legacy
    stored_secret legacy rewritten
  record: 'Legacy rewritten row: API value and storage representation after the annotation update.'
  expect: The existing record should now be encrypted with key1 while its password remains unchanged.
- name: Omit the key needed to decrypt the existing records
  where: VM terminal 1, same shell
  run: !unsafe |
    provider_summary key2
    install_provider key2
    wait_provider key2
    k get --raw /livez
    k get --raw /readyz
    secret_value fresh
    echo "Secret read exit=$?"
    stored_secret fresh missing-key
  record: 'Missing decryption key row: running provider, health responses, exact Secret error and exit
    status, retained storage prefix.'
  expect: The API process should become live, but the fresh record should fail to decrypt. Record readiness
    separately; the etcd record should still exist under key1.
- name: Restore the original decryption key and verify recovery
  where: VM terminal 1, same shell
  run: !unsafe |
    install_provider key1
    wait_provider key1
    k get --raw /readyz
    secret_value legacy
    secret_value fresh
    stored_secret legacy restored
    stored_secret fresh restored
  record: 'Key restored row: readiness, both readable values and both storage prefixes.'
  expect: The existing encrypted records should become readable again. Keep key1 configured; do not restore
    a plaintext-only API server.
setup:
- name: Prepare plaintext evidence and two independent encryption keys
  command: !unsafe |
    cat > ~/labs/lab26/helpers.sh <<'SH'
    k() { kubectl --kubeconfig="$HOME/labs/lab26/kubeconfig" --context=kind-lab26 --namespace=ce-lab26 --request-timeout=10s "$@"; }
    source "$HOME/labs/lab26/exercise.sh"
    SH
    source ~/labs/lab26/helpers.sh
    k create namespace ce-lab26 --dry-run=client -o yaml | k apply -f -
    k create secret generic legacy --from-literal=password=ce-lab26-demo
    k -n kube-system get pod kube-apiserver-lab26-control-plane -o json > ~/labs/lab26/apiserver-observed.json
    python3 ~/labs/lab26/prepare.py
    docker exec lab26-control-plane mkdir -p /etc/kubernetes/ce-lab26
    docker cp ~/labs/lab26/provider-key1.json lab26-control-plane:/etc/kubernetes/ce-lab26/provider-key1.json
    docker cp ~/labs/lab26/provider-key2.json lab26-control-plane:/etc/kubernetes/ce-lab26/provider-key2.json
    docker exec lab26-control-plane chmod 600 /etc/kubernetes/ce-lab26/provider-key1.json /etc/kubernetes/ce-lab26/provider-key2.json
    stored_secret legacy setup
verify:
- name: Check the plaintext baseline and prepared providers
  command: !unsafe |
    source ~/labs/lab26/helpers.sh
    test "$(secret_value legacy)" = ce-lab26-demo
    provider_summary key1
    provider_summary key2
    stored_secret legacy verified
reset: []
fallback:
- name: Restore the readable provider if an API wait fails
  where: VM terminal 1, same shell
  run: !unsafe |
    source ~/labs/lab26/helpers.sh
    install_provider key1
    wait_provider key1
    secret_value legacy
  record: Record the restored provider and whether the legacy Secret is readable.
  expect: If an API wait fails, run install_provider key1, then wait_provider key1 in the VM shell. This
    uses Docker to restore the static Pod and does not require the API. Recheck both Secret reads. To
    discard the entire experiment, run ./lab.sh 26 reset on the host; its private-cluster cleanup also
    works without a responsive API.
