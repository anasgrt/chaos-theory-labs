title: Lab 04 — CPU contention and a quota
units: [ce-lab04.service]
task:
  question: How does capping a CPU competitor change the time taken by the same job?
  brief:
    theory_source: 'docs/chaos-theory.md: §§3.2, 3.3.5 and the CPU-shares correction; §5.5.2.'
    theory:
    - A CPU-bound job needs CPU execution time. Its wall time also includes waiting to be scheduled. Keeping
      the calculation fixed while adding another runnable job on the same CPU tests contention without
      changing the application’s work.
    - USE means utilization, saturation and errors, checked per resource. CPU utilization says how busy
      the CPU is; saturation is runnable work waiting for CPU. High utilization alone does not prove a
      problem. Connect the resource measurements to a change in this job’s elapsed time.
    - CPU placement and CPU bandwidth are different controls. taskset pins both jobs to the same allowed
      CPU. CPUQuota=20% caps the neighbour at one fifth of one CPU on average. It neither reserves a core
      nor promises the remaining time exclusively to the measured job.
    - In cgroup v2, cpu.max contains quota and period in microseconds. Divide quota by period to obtain
      the CPU budget, for example 20000 / 100000 = 0.2. When the group uses that budget it waits until
      replenishment; rising throttling counters show enforcement. Compare repeated baseline timings, loaded
      timings, capped timings and recovery using the same calculation.
    in_this_lab:
    - Select one allowed CPU automatically and pin both jobs to it. The neighbour runs in ce-lab04 for
      at most 45 seconds. Each measurement uses the same six-iteration job.
    readings:
    - signal: work.py output
      meaning: Column 1 is iteration number; column 2 is elapsed seconds. Mean is the sum of column 2
        divided by the number of rows; range is its minimum to maximum. Compare all samples in each phase,
        not a single fast sample.
    - signal: cpu.max / cpu.stat
      meaning: cpu.max is configuration. nr_throttled counts throttled periods; throttled_usec is accumulated
        throttling time. Configuration alone does not show that a limit was reached.
    - signal: CPU PSI / vmstat r
      meaning: PSI reports time with runnable tasks waiting; r counts runnable tasks. Both are VM-wide
        supporting signals, not attribution to this one neighbour.
    - signal: Neighbour active
      meaning: If it ended before the job finished, the sample mixes loaded and recovered states and must
        be repeated.
  predict: Rank the job time with no competitor, an unrestricted competitor and a competitor capped at
    20%. Explain your prediction.
  answer_with:
  - What were the mean and range of iteration times at baseline, with the unrestricted neighbour, with
    the 20% neighbour and after recovery?
  - Was the neighbour active throughout each loaded measurement? Which measurements, if any, are inconclusive?
  - What quota/period ratio did cpu.max show, and how much did the throttling counters increase during
    the capped measurement?
  - How do the timings, throttling evidence and recovered baseline explain the effect of capping the competitor?
  evidence:
    columns:
    - Phase
    - Mean / range (s)
    - Neighbour active?
    - Throttle evidence
    rows:
    - Baseline
    - Unrestricted neighbour
    - 20% neighbour
    - Recovered
  transfer: Would pinning the neighbour to a different otherwise idle CPU test the same contention?
solution:
- Use the printed mean and range for all four phases. The unrestricted neighbour should increase
  iteration time; the capped neighbour should reduce that increase. There is no fixed required speedup,
  and small differences within baseline variation do not establish a clear effect.
- Both loaded measurements require an active neighbour before and after work.py. If the neighbour ended
  early, that phase mixes contention and recovery and is inconclusive.
- cpu.max should have quota/period = 0.2. Subtract the before counters from the after counters; rising
  nr_throttled and throttled_usec show the competitor used its budget and was throttled.
- The two jobs share one CPU. Restricting the competitor's CPU time should leave more scheduling time
  for the measured job. Quota enforcement plus shorter measured times and recovery toward baseline
  support that explanation; PSI and vmstat are supporting VM-wide signals.
verify_note: ce-lab04 is stopped and the final job timing is recorded.
commands:
- name: Choose an allowed CPU
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab04
    CPU=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
    echo "Both workloads will use CPU $CPU"
    systemctl is-active ce-lab04.service; echo "unit status=$? (nonzero means not active)"
  expect: One CPU permitted by this shell’s affinity; use the same shell and CPU for every phase.
  record: Note the selected CPU and confirm no ce-lab04 neighbour is active before baseline. Keep this
    VM shell open so CPU stays defined for all later commands.
- name: Record the baseline three times
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab04
    for run in 1 2 3; do taskset -c "$CPU" python3 work.py | tee "baseline-$run.txt"; done
    awk 'NR==1 {min=max=$2} {sum+=$2; if ($2<min) min=$2; if ($2>max) max=$2} END {printf "baseline mean=%.4fs range=%.4f-%.4fs\n", sum/NR, min, max}' baseline-1.txt baseline-2.txt baseline-3.txt
  expect: Three runs produce 18 finite iteration timings with no deliberate competitor.
  record: Fill the Baseline row with the combined mean and range. Keep all three baseline files to
    distinguish a change under contention from ordinary variation.
- name: Add one bounded CPU neighbour on the same CPU
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab04
    sudo systemd-run --unit=ce-lab04 --collect -p RuntimeMaxSec=45s \
      taskset -c "$CPU" stress-ng --cpu 1 --timeout 40s
    systemctl is-active ce-lab04
    taskset -c "$CPU" python3 work.py | tee loaded.txt
    systemctl is-active ce-lab04 || echo 'Inconclusive: the neighbour ended before the measurement finished.'
    cat /proc/pressure/cpu
    vmstat 1 5
    sudo systemctl stop ce-lab04
  expect: Compare iteration time with baseline. PSI and vmstat provide supporting waiting measurements;
    neither alone proves which task caused the slowdown.
  record: Save loaded.txt and the neighbour's before/after active states. Record CPU PSI and vmstat r
    as supporting observations; mark the phase inconclusive if the neighbour was not active throughout.
- name: Cap the neighbour at 20 percent and read throttling counters
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab04
    for i in $(seq 1 10); do
      systemctl list-units --all --plain --no-legend ce-lab04.service | grep -q . || break
      sleep 1
    done
    sudo systemd-run --unit=ce-lab04 --collect -p CPUQuota=20% -p RuntimeMaxSec=45s \
      taskset -c "$CPU" stress-ng --cpu 1 --timeout 40s
    path=$(systemctl show ce-lab04 -p ControlGroup --value)
    if [ -n "$path" ] && systemctl is-active --quiet ce-lab04; then
      echo 'Neighbour active before measurement'
      sudo cat "/sys/fs/cgroup$path/cpu.max"
      sudo cat "/sys/fs/cgroup$path/cpu.stat" | tee quota-before.txt
      taskset -c "$CPU" python3 work.py | tee quota.txt
      if systemctl is-active --quiet ce-lab04; then
        echo 'Neighbour still active after measurement'
        sudo cat "/sys/fs/cgroup$path/cpu.stat" | tee quota-after.txt
        awk 'NR==FNR {before[$1]=$2; next} $1 ~ /^(nr_throttled|throttled_usec)$/ {print $1 " increase=" $2-before[$1]}' quota-before.txt quota-after.txt
      else
        echo 'Inconclusive: the neighbour ended before the measurement finished.'
      fi
    else
      echo 'STOP: no active neighbour cgroup; this phase was not measured.'
    fi
    sudo systemctl stop ce-lab04
  expect: cpu.max should show a quota/period ratio of 0.2, and cpu.stat should show throttling. If the
    neighbour ends before measurement finishes, this phase is inconclusive.
  record: Save quota.txt, the cpu.max values, both cpu.stat snapshots and their printed counter increases.
    Record whether the neighbour stayed active; the configuration alone is not evidence of enforcement.
- name: Recover and repeat the baseline
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab04
    sudo systemctl stop ce-lab04 2>/dev/null || true
    for i in $(seq 1 10); do
      systemctl list-units --all --plain --no-legend ce-lab04.service | grep -q . || break
      sleep 1
    done
    systemctl is-active ce-lab04; echo "unit status=$? (nonzero means not active)"
    taskset -c "$CPU" python3 work.py | tee recovered.txt
    awk 'NR==1 {min=max=$2} {sum+=$2; if ($2<min) min=$2; if ($2>max) max=$2} END {printf "baseline mean=%.4fs range=%.4f-%.4fs\n", sum/NR, min, max}' baseline-1.txt baseline-2.txt baseline-3.txt
    for f in loaded.txt quota.txt recovered.txt; do
      awk -v f="$f" 'NR==1 {min=max=$2} {sum+=$2; if ($2<min) min=$2; if ($2>max) max=$2} END {printf "%s mean=%.4fs range=%.4f-%.4fs\n", f, sum/NR, min, max}' "$f"
    done
  expect: The neighbour is no longer active. Recovered timings should move toward the baseline range;
    report measured variation rather than assuming exact equality.
  record: Fill the remaining mean/range cells using the printed summary and record the recovered neighbour
    state. Use this comparison and the counter differences to answer the quota question.
setup:
- name: Create the finite CPU workload
  command: !unsafe |
    mkdir -p "$HOME/labs/lab04"
    cat > "$HOME/labs/lab04/work.py" <<'PY'
    import time
    for i in range(6):
        start = time.monotonic()
        sum(j * j for j in range(5_000_000))
        print(i, round(time.monotonic() - start, 4), flush=True)
    PY
verify:
- name: Verify CPU experiment prerequisites
  command: !unsafe |
    taskset -pc $$ >/dev/null
    test -r /proc/pressure/cpu
    ! systemctl is-active --quiet ce-lab04.service
reset: []
prerequisites: Provision the shared VM once with ./lab.sh provision. Run ./lab.sh 04 setup on the host. No other lab is required.
transfer_solution: No. It changes placement and removes the intended competition for a single CPU. Keep
  placement fixed when evaluating the quota.
