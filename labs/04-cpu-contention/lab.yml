title: Lab 04 — CPU contention and a quota
units: [ce-lab04.service]
task:
  question: How does capping a CPU competitor change the time taken by the same job?
  brief:
    theory_source: 'docs/chaos-theory.md: §§3.2, 3.3.5 and the CPU-shares correction; §5.5.2.'
    theory:
    - A CPU-bound job needs CPU execution time. Its wall time also includes waiting to be scheduled. Keeping
      the calculation fixed while adding another runnable job on the same CPU tests contention without
      changing the application’s work.
    - USE means utilization, saturation and errors, checked per resource. CPU utilization says how busy
      the CPU is; saturation is runnable work waiting for CPU. High utilization alone does not prove a
      problem. Connect the resource measurements to a change in this job’s elapsed time.
    - CPU placement and CPU bandwidth are different controls. taskset pins both jobs to the same allowed
      CPU. CPUQuota=20% caps the neighbour at one fifth of one CPU on average. It neither reserves a core
      nor promises the remaining time exclusively to the measured job.
    - In cgroup v2, cpu.max contains quota and period in microseconds. Divide quota by period to obtain
      the CPU budget, for example 20000 / 100000 = 0.2. When the group uses that budget it waits until
      replenishment; rising throttling counters show enforcement. Compare repeated baseline timings, loaded
      timings, capped timings and recovery using the same calculation.
    in_this_lab:
    - Select one allowed CPU automatically and pin both jobs to it. The neighbour runs in ce-lab04 for
      at most 45 seconds. Each measurement uses the same six-iteration job.
    readings:
    - signal: work.py output
      meaning: Column 1 is iteration number; column 2 is elapsed seconds. Mean is the sum of column 2
        divided by the number of rows; range is its minimum to maximum. Compare all samples in each phase,
        not a single fast sample.
    - signal: cpu.max / cpu.stat
      meaning: cpu.max is configuration. nr_throttled counts throttled periods; throttled_usec is accumulated
        throttling time. Configuration alone does not show that a limit was reached.
    - signal: CPU PSI / vmstat r
      meaning: PSI reports time with runnable tasks waiting; r counts runnable tasks. Both are VM-wide
        supporting signals, not attribution to this one neighbour.
    - signal: Neighbour active
      meaning: If it ended before the job finished, the sample mixes loaded and recovered states and must
        be repeated.
  predict: Rank the job time with no competitor, an unrestricted competitor and a competitor capped at
    20%. Explain your prediction.
  answer_with: Compare the measured job times and quota counters. Explain how throttling the competitor
    changes waiting for CPU; mark a run inconclusive if the competitor stopped too early.
  evidence:
    columns:
    - Phase
    - Mean job time (s)
    - Neighbour active?
    - Throttle evidence
    rows:
    - Baseline
    - Unrestricted neighbour
    - 20% neighbour
    - Recovered
  transfer: Would pinning the neighbour to a different otherwise idle CPU test the same contention?
solution: An unrestricted neighbour competes for CPU time. Capping it should leave more time for work.py,
  though the measured gain depends on scheduling. cpu.max shows the configured cap; cpu.stat shows throttling.
  Recovery toward baseline strengthens the contention explanation. A run that outlasts the neighbour mixes
  contention with recovery and cannot support the comparison.
verify_note: ce-lab04 is stopped and the final job timing is recorded.
commands:
- name: Choose an allowed CPU
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab04
    CPU=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
    echo "Both workloads will use CPU $CPU"
  expect: One CPU permitted by this shell’s affinity; use the same shell and CPU for every phase.
- name: Record the baseline three times
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab04
    for run in 1 2 3; do taskset -c "$CPU" python3 work.py | tee "baseline-$run.txt"; done
    sort -k2 -n baseline-*.txt | awk 'NR==1 {min=$2} {max=$2} END {print "iteration range:", min, "-", max, "s"}'
- name: Add one bounded CPU neighbour on the same CPU
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab04
    sudo systemd-run --unit=ce-lab04 --collect -p RuntimeMaxSec=45s \
      taskset -c "$CPU" stress-ng --cpu 1 --timeout 40s
    taskset -c "$CPU" python3 work.py | tee loaded.txt
    systemctl is-active --quiet ce-lab04 || echo 'Inconclusive: the neighbour ended before the measurement finished.'
    cat /proc/pressure/cpu
    vmstat 1 5
    sudo systemctl stop ce-lab04
  expect: Compare iteration time with baseline. PSI and vmstat provide supporting waiting measurements;
    neither alone proves which task caused the slowdown.
- name: Cap the neighbour at 20 percent and read throttling counters
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab04
    for i in $(seq 1 10); do
      systemctl list-units --all --plain --no-legend ce-lab04.service | grep -q . || break
      sleep 1
    done
    sudo systemd-run --unit=ce-lab04 --collect -p CPUQuota=20% -p RuntimeMaxSec=45s \
      taskset -c "$CPU" stress-ng --cpu 1 --timeout 40s
    taskset -c "$CPU" python3 work.py | tee quota.txt
    path=$(systemctl show ce-lab04 -p ControlGroup --value)
    if systemctl is-active --quiet ce-lab04 && [ -n "$path" ]; then
      sudo cat "/sys/fs/cgroup$path/cpu.max" "/sys/fs/cgroup$path/cpu.stat"
    else
      echo 'Inconclusive: the neighbour ended before the measurement finished.'
    fi
    sudo systemctl stop ce-lab04
  expect: cpu.max should show a quota/period ratio of 0.2, and cpu.stat should show throttling. If the
    neighbour ends before measurement finishes, shorten work.py's iteration count and repeat every phase
    with that same workload.
- name: Recover and repeat the baseline
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab04
    sudo systemctl stop ce-lab04 2>/dev/null || true
    for i in $(seq 1 10); do
      systemctl list-units --all --plain --no-legend ce-lab04.service | grep -q . || break
      sleep 1
    done
    taskset -c "$CPU" python3 work.py | tee recovered.txt
    for f in baseline-1.txt baseline-2.txt baseline-3.txt loaded.txt quota.txt recovered.txt; do
      awk -v f="$f" '{s+=$2} END {printf "%-15s mean=%.4fs\n", f, s/NR}' "$f"
    done
setup:
- name: Create the finite CPU workload
  command: !unsafe |
    mkdir -p "$HOME/labs/lab04"
    cat > "$HOME/labs/lab04/work.py" <<'PY'
    import time
    for i in range(6):
        start = time.monotonic()
        sum(j * j for j in range(5_000_000))
        print(i, round(time.monotonic() - start, 4), flush=True)
    PY
verify:
- name: Verify CPU experiment prerequisites
  command: !unsafe |
    taskset -pc $$ >/dev/null
    test -r /proc/pressure/cpu
    ! systemctl is-active --quiet ce-lab04.service
reset: []
prerequisites: Provision the shared VM once with ./lab.sh provision. Run ./lab.sh 04 setup, then ./lab.sh ssh. No other lab is required.
transfer_solution: No. It changes placement and removes the intended competition for a single CPU. Keep
  placement fixed when evaluating the quota.
