apiVersion: v1
kind: Pod
metadata:
  name: startup-check
  labels:
    app: startup-check
spec:
  containers:
  - name: web
    image: python:3.12-slim
    imagePullPolicy: IfNotPresent
    command:
    - python
    - -m
    - http.server
    - '8080'
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      periodSeconds: 1
  restartPolicy: Never
  nodeSelector:
    chaos-labs.invalid/placement: missing
---
apiVersion: v1
kind: Service
metadata:
  name: startup-check
spec:
  type: NodePort
  selector:
    app: startup-check
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30090
