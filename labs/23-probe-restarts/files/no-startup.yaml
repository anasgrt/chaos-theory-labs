apiVersion: v1
kind: Pod
metadata:
  name: probe-web
  labels:
    app: probe-web
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: web
    image: python:3.12-slim
    imagePullPolicy: IfNotPresent
    command:
    - python3
    - -u
    - /scripts/server.py
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 128Mi
    volumeMounts:
    - name: scripts
      mountPath: /scripts
      readOnly: true
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8080
      periodSeconds: 2
      failureThreshold: 1
    livenessProbe:
      httpGet:
        path: /livez
        port: 8080
      periodSeconds: 2
      failureThreshold: 3
  volumes:
  - name: scripts
    configMap:
      name: probe-scripts
