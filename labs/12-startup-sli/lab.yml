title: Lab 12 — Locate startup failures and measure recovery
kubernetes: true
task:
  question: Can the startup SLI detect different failure stages, distinguish their causes and measure
    recovery?
  brief:
    theory_source: 'docs/chaos-theory.md: §§11.2, 11.4.1–11.4.3; scheduling in §12.1.1.'
    theory:
    - An SLI is a measured service outcome; an SLO is a target for it. This lab measures elapsed time
      from submitting a fresh Pod and Service to receiving HTTP 200 through that Service. The per-trial
      target is at most 30 seconds. Pod Running is an earlier, weaker milestone.
    - Startup includes API submission, scheduling, container startup, readiness and usable routing. The
      image is cached, so this experiment does not include a cold image download. Repeating a warm-start
      check cannot establish a cold-start guarantee.
      With imagePullPolicy=Always, the runtime checks the registry to resolve the image to a digest
      (a content identifier), but can reuse cached layers. Always does not mean every layer is downloaded
      again; registry access and layer transfer are different startup costs.
    - 'Test the checker as well as the workload: a known 45-second startup delay should exceed its 30-second
      budget, and restoring the normal command should recover. Delete the previous Pod and Service before
      each trial so an old server cannot answer for the new one.'
    - A completed trial can report success=0; that is valid evidence of a missed target. A checker error
      or stale metrics is not a completed failed trial. The last-run timestamp identifies fresh results.
      Over many representative trials the fraction meeting the target forms an SLI; these diagnostic trials
      do not establish a long-term SLO.
    - 'The same HTTP deadline miss can have different causes. An unmatched required nodeSelector leaves
      a Pod unscheduled: PodScheduled=False, reason Unschedulable, and no nodeName. A delayed application
      has a node but cannot yet pass readiness. A wrong Service selector leaves a healthy Ready Pod with
      zero matching endpoints. Use these intermediate observations to locate the failed stage; success=0
      alone does not identify it.'
    - A container restart reruns the same configured command. It does not change nodeSelector or Service
      labels, and a command containing a 45-second sleep repeats that sleep after restart. Recovery must
      change the setting responsible for the failed stage.
    - The checker saves a per-trial JSON snapshot of the Pod, Service, EndpointSlices and Pod events before
      cleanup. Capture occurs after the timed HTTP measurement, so it does not increase the measured startup
      duration. Each read is a separate observation, not an atomic cluster snapshot; diagnostics errors
      are recorded explicitly.
    - Run three healthy trials after removing the faults. The fraction meeting the target is successful
      completed trials / all completed trials. Keep deliberate fault trials separate from the healthy
      sample. A small controlled sample tests repeatability, not a production reliability target; a missed
      trial has no measured eventual time-to-success.
    in_this_lab:
    - Setup prepares the checker and manifest. Each invocation creates a fresh workload, waits up to its
      30-second budget, records a result and cleans up. The image is preloaded.
    readings:
    - signal: success / elapsed
      meaning: success=1 means an HTTP 200 was observed within the budget. success=0 means none was observed
        by the deadline. elapsed is seconds from submission.
    - signal: checker exit
      meaning: 0 means the checker completed and recorded trials, including misses. Nonzero means execution
        or cleanup failed; inspect the output before using metrics.
    - signal: ce_last_run_timestamp_seconds
      meaning: Unix timestamp of the last completed trial. It must advance; old output cannot represent
        a new run.
    - signal: NotFound after cleanup
      meaning: Both Pod and Service should be absent. An API connection error is not evidence that they
        were deleted.
    - signal: PodScheduled / nodeName / Ready
      meaning: No node and Unschedulable locates placement failure. Assigned but unready locates a later
        stage. Ready alone does not prove Service routing.
    - signal: diagnostics/run-N.json
      meaning: Contains the trial timestamp, measurement and pre-cleanup API evidence. Errors mean the
        corresponding diagnostic was unavailable; they are not an empty successful query.
    - signal: Healthy sample SLI
      meaning: Calculate the fraction from the three run output lines, not start.prom, which contains
        only the most recent trial.
    theory_sections:
    - 11.4.1
    - 11.4.2
    - 11.4.3
  predict: Predict success and the distinguishing Pod/endpoint evidence for delayed startup, impossible
    placement and wrong Service selection. Predict which faults restarting the container could repair.
  answer_with: Complete the seven rows, explain the earliest failed stage in each fault, and calculate
    the restored sample’s success fraction. Show fresh diagnostics and cleanup; distinguish a completed
    miss, missing diagnostics and a checker execution error.
  evidence:
    columns:
    - Trial
    - success / elapsed
    - Scheduled / Ready
    - Eligible endpoints / cause
    rows:
    - Normal
    - 45 s delay
    - Unmatched nodeSelector
    - Wrong Service selector
    - Restored trial 1
    - Restored trial 2
    - Restored trial 3
  transfer: 'Does imagePullPolicy: Always force every image layer to download on each run?'
solution: The delayed workload should miss the 30-second budget and be reported as unsuccessful. Restored
  healthy runs check that the fault was removed. These trials validate those checker paths; they do not
  establish an SLO for all future startups. The unscheduled trial fails before a container can start;
  the selector trial can have a Ready process but no usable Service backend. Diagnose using conditions
  and endpoints captured before cleanup. Report healthy successes divided by three completed trials without
  mixing in deliberate failures.
verify_note: The healthy manifest is restored and no startup-check Pod or Service remains.
commands:
- name: Run one healthy check and confirm cleanup
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab12
    source ~/labs/lab12/env.sh
    bash run.sh | tee runs.txt
    echo "checker exit=${PIPESTATUS[0]} (0 means the checker and cleanup completed)"
    cat metrics/start.prom
    k get pod startup-check; k get svc startup-check
    cp diagnostics/run-1.json evidence-normal.json
  expect: One result with success=1 and a few seconds elapsed; both final gets report NotFound. A nonzero
    checker exit or no new result means the check did not complete; do not interpret old metrics as a
    new result.
- name: Prove the check detects a deliberately delayed startup
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab12
    cp startup-delayed.yaml startup.yaml
    grep -n 'command:' startup.yaml
    bash run.sh | tee runs-delayed.txt
    echo "checker exit=${PIPESTATUS[0]} (0 means the checker and cleanup completed)"
    cp diagnostics/run-1.json evidence-delayed.json
    jq '{trial, conditions: .pod.status.conditions, containers: .pod.status.containerStatuses}' evidence-delayed.json
  expect: The grep shows the sleep 45 command; the run reports success=0 after about 30 s.
- name: Make placement impossible without changing the application
  where: VM terminal 1, same shell
  run: !unsafe |
    cp startup-unscheduled.yaml startup.yaml
    bash run.sh | tee runs-unscheduled.txt
    echo "checker exit=${PIPESTATUS[0]}"
    cp diagnostics/run-1.json evidence-unscheduled.json
    jq '{trial, pod: .pod.status, spec: .pod.spec.nodeSelector, events: .events}' evidence-unscheduled.json
  expect: A completed miss should show PodScheduled=False/Unschedulable with no assigned node. This is
    not evidence of a slow web process.
- name: Break Service matching while allowing the Pod to become Ready
  where: VM terminal 1, same shell
  run: !unsafe |
    cp startup-selector.yaml startup.yaml
    bash run.sh | tee runs-selector.txt
    echo "checker exit=${PIPESTATUS[0]}"
    cp diagnostics/run-1.json evidence-selector.json
    jq '{trial, conditions: .pod.status.conditions, selector: .service.spec.selector, slices: .endpointslices}' evidence-selector.json
  expect: A Ready Pod with no matching endpoints isolates Service selection as the failure stage.
- name: Restore the healthy manifest, run three trials and calculate the sample SLI
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab12
    cp startup-good.yaml startup.yaml
    grep -n 'command:' startup.yaml
    bash run.sh 3 | tee runs-restored.txt
    echo "checker exit=${PIPESTATUS[0]} (0 means the checker and cleanup completed)"
    cat metrics/start.prom
    k get pod startup-check; k get svc startup-check

    mkdir -p evidence-restored
    cp diagnostics/run-*.json evidence-restored/
    awk '/^run=/ {n++; if ($2 == "success=1") good++} END {if (n == 3) printf "healthy sample: %d/%d = %.3f\n", good,n,good/n; else print "Incomplete sample; inspect checker exit"}' runs-restored.txt
setup:
- name: Restore this lab's startup baseline manifest
  command: !unsafe |
    mkdir -p ~/labs/lab12/metrics
    cp ~/labs/lab12/startup-good.yaml ~/labs/lab12/startup.yaml
- name: Prepare the checker entry point
  command: !unsafe |
    cat > "$HOME/labs/lab12/run.sh" <<'SH'
    #!/usr/bin/env bash
    exec python3 "$(dirname "$0")/startup-check.py" "$@"
    SH
verify:
- name: Verify startup-check readiness to run
  command: !unsafe |
    test -s "$HOME/labs/lab12/startup.yaml"
    test -s "$HOME/labs/lab12/run.sh"
    k() { kubectl --kubeconfig="$HOME/labs/lab12/kubeconfig" --context=kind-lab12 --namespace=chaos-labs --request-timeout=10s "$@"; }
    remaining_pod=$(k get pod startup-check --ignore-not-found -o name)
    remaining_service=$(k get svc startup-check --ignore-not-found -o name)
    test -z "$remaining_pod"
    test -z "$remaining_service"
    test "$(k get nodes -l chaos-labs.invalid/placement=missing -o json | jq '.items | length')" -eq 0
reset: []
prerequisites: Provision the shared VM once with ./lab.sh provision. Run ./lab.sh 12 setup, then ./lab.sh ssh. No other lab is required.
transfer_solution: No. It checks the registry for the image resolution, but cached layers can still be
  reused. A cold-image experiment must control the node’s cache as well.
fallback:
- name: Manual fallback if the loop was killed
  where: VM terminal 2
  run: !unsafe |
    source ~/labs/lab12/env.sh
    k delete -f ~/labs/lab12/startup.yaml --ignore-not-found --grace-period=1
files:
- startup-selector.yaml
- startup-unscheduled.yaml
- startup-delayed.yaml
- startup-good.yaml
- startup-check.py
