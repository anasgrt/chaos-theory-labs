title: Lab 01 — A timeout makes a silent failure manageable
units: [ce-lab01-runner.service, ce-lab01-redis.service]
task:
  question: Why does the exception handler run after refusal but not while packets are silently dropped?
  brief:
    theory_source: 'docs/chaos-theory.md: §1.5 and Experiment Card 1.1.'
    theory:
    - A dependency call must return or raise an error before execution can reach the next statement or
      an exception handler. try/except supplies a reaction to an error; it does not give the call a deadline.
    - REJECT with a TCP reset gives the client a prompt refusal. DROP silently discards matching packets.
      Without a reply the network stack retries and waits; its eventual failure can be much later than
      a useful application deadline. These are two different failure modes of the same dependency.
    - A connect timeout bounds connection establishment. A read timeout bounds waiting for data after
      connecting. The prepared client disables retries and sets both to TIMEOUT when supplied. A socket
      timeout is not a general end-to-end deadline across many operations or retries.
    - 'The five-second timeout command is an external watchdog: it terminates the test process. It does
      not execute the client’s fallback. Compare that termination with the client catching its own timeout,
      then remove the firewall rule and check the same request again.'
    in_this_lab:
    - One ce-lab01 firewall rule targets TCP 127.0.0.1:6381. All fault runs use a five-second watchdog;
      TIMEOUT=0.5 sets the client timeouts. The comparison runs in ce-lab01-runner.service
      so reset can stop it before removing its firewall rules.
    readings:
    - signal: OK / DEGRADED
      meaning: OK means Redis answered. DEGRADED means the client caught a Redis error and executed its
        fallback.
    - signal: elapsed
      meaning: Seconds measured inside the client. A watchdog-killed, buffered process may print no elapsed
        line.
    - signal: exit=124
      meaning: The external timeout command reached its deadline. This is not the application’s handled
        error.
    - signal: iptables pkts
      meaning: A nonzero counter confirms traffic matched the fault rule; no matches means you have not
        tested that fault.
  predict: 'Predict which of the three attempts reaches the handler: REJECT, DROP, and DROP with a 0.5-second
    timeout.'
  answer_with:
  - Did the baseline and recovered requests succeed? What proves the firewall fault was removed?
  - For REJECT, DROP and DROP with TIMEOUT=0.5, did the handler run, what ended the wait, and what were
    the elapsed time and exit status? Cite each rule's packet counter.
  - Why does try/except need an application timeout to handle a silent dependency promptly?
  evidence:
    columns:
    - Attempt
    - Handler ran?
    - Elapsed / exit
    - Rule packets
    - What ended the wait?
    rows:
    - Baseline
    - REJECT
    - DROP
    - DROP + 0.5 s timeout
    - Recovered
  transfer: If each attempt has a 0.5-second timeout and you allow three attempts, is the whole request
    bounded by 0.5 seconds?
solution:
- Baseline and recovery should both print PONG and OK True. The final firewall search should find no
  ce-lab01 rule (grep status 1). Cite your observed output; an unsuccessful recovery leaves the comparison incomplete.
- REJECT should print DEGRADED ConnectionError promptly and client exit=0 because the error is caught.
  DROP without an application timeout should reach the five-second watchdog, print client exit=124,
  and have no handler or elapsed line. DROP with TIMEOUT=0.5 should print DEGRADED TimeoutError near
  0.5 seconds and client exit=0. Report actual timings and nonzero packet counters for all three cases;
  zero matched packets do not demonstrate the intended fault.
- try/except reacts only after the dependency call raises an error. A silent DROP can leave that call
  waiting beyond the experiment's watchdog. The client's connection/read timeout makes the call raise
  an error the handler can catch; the external watchdog terminates the process without running its fallback.
verify_note: The client succeeds again and no ce-lab01 rule remains.
commands:
- name: Check the Redis baseline
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab01
    redis-cli -p 6381 ping
    env -u TIMEOUT timeout 5s python3 client.py
    echo "client exit=$?"
  expect: PONG, then OK True, an elapsed time and client exit=0. Stop if this baseline fails.
  record: Fill the Baseline row with OK or error, elapsed time and client exit status. OK means the
    request succeeded; the fallback handler was not needed.
- name: Case 1 - REJECT without an application timeout
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab01
    sudo systemd-run --unit=ce-lab01-runner --collect --wait --pipe \
      --uid="$(id -u)" --property=RuntimeMaxSec=20s --working-directory="$PWD" \
      /bin/bash "$PWD/run.sh" reject
  expect: DEGRADED ConnectionError, a short elapsed time, client exit=0 and a nonzero REJECT packet
    counter. The runner removes its rule before returning.
  record: Fill the REJECT row with any handler message, elapsed time, client exit and matched packets.
    Use the output to identify what ended the wait.
- name: Case 2 - DROP without an application timeout
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab01
    sudo systemd-run --unit=ce-lab01-runner --collect --wait --pipe \
      --uid="$(id -u)" --property=RuntimeMaxSec=20s --working-directory="$PWD" \
      /bin/bash "$PWD/run.sh" drop
  expect: The external watchdog stops the client after five seconds with client exit=124. There should
    be no DEGRADED or elapsed line; the DROP rule must have matched packets.
  record: Fill the DROP row with whether a handler or elapsed line appeared, client exit, whole seconds
    waited and matched packets. Identify what ended the wait from those observations.
- name: Case 3 - DROP with a 0.5-second application timeout
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab01
    sudo systemd-run --unit=ce-lab01-runner --collect --wait --pipe \
      --uid="$(id -u)" --property=RuntimeMaxSec=20s --working-directory="$PWD" \
      /bin/bash "$PWD/run.sh" drop-timeout
  expect: DEGRADED TimeoutError near 0.5 seconds, client exit=0 and a nonzero DROP packet counter.
    The application handles its own timeout before the watchdog fires.
  record: Fill the DROP + 0.5 s timeout row with the handler message, elapsed time, client exit and
    matched packets. Compare what ended this wait with Case 2.
- name: Prove Redis and firewall recovery
  where: VM terminal 1
  run: !unsafe |
    cd ~/labs/lab01
    redis-cli -p 6381 ping
    env -u TIMEOUT timeout 5s python3 client.py
    echo "client exit=$?"
    if rules=$(sudo iptables -S OUTPUT); then
      printf '%s\n' "$rules" | grep -- '--comment ce-lab01'
      echo "grep exit=$? (1 means no lab rule remains)"
    else
      echo 'UNKNOWN: firewall rules could not be read; fault removal is not verified.'
    fi
  expect: PONG and OK True with client exit=0; the firewall search prints no rule and grep exit=1.
  record: Fill the Recovered row with the response, elapsed time and exit status. Save the firewall
    search output and status to establish whether the fault rule remains.
setup:
- name: Start the dedicated Redis dependency
  command: !unsafe |
    sudo tee /etc/systemd/system/ce-lab01-redis.service >/dev/null <<UNIT
    [Unit]
    Description=Lab 01 Redis
    [Service]
    User=$USER
    WorkingDirectory=$HOME/labs/lab01
    ExecStart=/usr/bin/redis-server --bind 127.0.0.1 --port 6381 --save "" --appendonly no --dir $HOME/labs/lab01
    UNIT
    sudo systemctl daemon-reload
    sudo systemctl start ce-lab01-redis.service
    for i in $(seq 1 20); do redis-cli -p 6381 ping 2>/dev/null | grep -qx PONG && break; sleep 0.2; done
- name: Prepare the Redis client
  command: !unsafe |
    mkdir -p "$HOME/labs/lab01"
    cd "$HOME/labs/lab01"
    cat > client.py <<'PY'
    import os, time, redis
    from redis.retry import Retry
    from redis.backoff import NoBackoff
    t = float(os.environ['TIMEOUT']) if 'TIMEOUT' in os.environ else None
    c = redis.Redis(host='127.0.0.1', port=6381,
        socket_connect_timeout=t, socket_timeout=t,
        retry=Retry(NoBackoff(), 0))
    start = time.monotonic()
    try:
        print('OK', c.ping())
    except redis.exceptions.RedisError as exc:
        print('DEGRADED', type(exc).__name__)
    print(f'elapsed={time.monotonic()-start:.3f}s')
    PY
- name: Prepare the bounded single-case runner
  command: !unsafe |
    cd ~/labs/lab01
    cat > run.sh <<'SH'
    #!/usr/bin/env bash
    set -u
    case "${1:-}" in
      reject) target=(REJECT --reject-with tcp-reset); client=(env -u TIMEOUT) ;;
      drop) target=(DROP); client=(env -u TIMEOUT) ;;
      drop-timeout) target=(DROP); client=(env TIMEOUT=0.5) ;;
      *) echo 'Usage: bash run.sh reject|drop|drop-timeout' >&2; exit 2 ;;
    esac
    rule=(-p tcp -d 127.0.0.1 --dport 6381 -m comment --comment ce-lab01)
    cleanup() {
      sudo iptables -D OUTPUT "${rule[@]}" -j DROP 2>/dev/null || true
      sudo iptables -D OUTPUT "${rule[@]}" -j REJECT --reject-with tcp-reset 2>/dev/null || true
    }
    trap cleanup EXIT
    trap 'exit 130' INT TERM
    sudo -v || exit 1
    cleanup
    echo "Case: $1 (watchdog: 5 seconds)"
    sudo iptables -I OUTPUT 1 "${rule[@]}" -j "${target[@]}" || exit 1
    SECONDS=0
    "${client[@]}" timeout 5s python3 client.py
    echo "client exit=$?"
    echo "whole seconds waited=$SECONDS"
    echo 'Rule counters for this case (pkts must be above 0)'
    sudo iptables -nvL OUTPUT --line-numbers | grep -E 'num|ce-lab01'
    SH
verify:
- name: Verify Redis and firewall recovery
  command: !unsafe |
    redis-cli -p 6381 ping | grep -qx PONG
    rules=$(sudo iptables -S OUTPUT) || exit 1
    ! printf '%s\n' "$rules" | grep -q -- '--comment ce-lab01'
    test -s "$HOME/labs/lab01/client.py"
    test -s "$HOME/labs/lab01/run.sh"
reset:
- name: Remove only Lab 01 firewall rules
  command: !unsafe |
    rule=(-p tcp -d 127.0.0.1 --dport 6381 -m comment --comment ce-lab01)
    sudo iptables -S OUTPUT >/dev/null
    while sudo iptables -C OUTPUT "${rule[@]}" -j DROP 2>/dev/null; do
      sudo iptables -D OUTPUT "${rule[@]}" -j DROP
    done
    while sudo iptables -C OUTPUT "${rule[@]}" -j REJECT --reject-with tcp-reset 2>/dev/null; do
      sudo iptables -D OUTPUT "${rule[@]}" -j REJECT --reject-with tcp-reset
    done
prerequisites: Provision the shared VM once with ./lab.sh provision. Run ./lab.sh 01 setup on the host. No other lab is required.
transfer_solution: No. Attempt budgets and any backoff accumulate. A whole-request deadline must also
  cover retries and other work.
fallback:
- name: Manual rule removal, only if run.sh was killed
  where: VM terminal 2
  run: !unsafe |
    sudo iptables -D OUTPUT -p tcp -d 127.0.0.1 --dport 6381 -m comment --comment ce-lab01 -j DROP
    sudo iptables -D OUTPUT -p tcp -d 127.0.0.1 --dport 6381 -m comment --comment ce-lab01 -j REJECT --reject-with tcp-reset
    env -u TIMEOUT timeout 5s python3 ~/labs/lab01/client.py
    echo "client exit=$?"
