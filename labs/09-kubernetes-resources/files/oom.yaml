apiVersion: v1
kind: Pod
metadata:
  name: resource-web
  labels:
    app: resource-web
spec:
  terminationGracePeriodSeconds: 2
  containers:
  - name: web
    image: python:3.12-slim
    command:
    - python
    - -u
    - -c
    - import time; print("allocating 96 MiB", flush=True); data=bytearray(96*1024*1024);
      time.sleep(300)
    resources:
      requests:
        cpu: 20m
        memory: 16Mi
      limits:
        memory: 32Mi
