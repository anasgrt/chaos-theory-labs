title: Lab 15 — Admission control as a synchronous dependency
kubernetes: true
task:
  question: What happens to a cluster when the webhook that approves new Pods stops answering?
  brief:
    theory_source: 'docs/chaos-theory.md: §§12.4.1–12.4.2.'
    theory_sections:
    - 12.4.1
    - 12.4.2
    theory:
    - 'Every write to the API server passes through authentication, authorization, mutating admission,
      schema validation and validating admission before it is persisted. A ValidatingWebhookConfiguration
      inserts an HTTP call to a service of your own into that path. The call is synchronous: the creating
      request waits for the answer, bounded by timeoutSeconds, which is five seconds here.'
    - failurePolicy decides what no answer means. Fail turns an unreachable or timed-out webhook into
      a rejected request, so an outage of the webhook becomes an outage of object creation. Ignore lets
      the request continue without this check, so the same outage becomes a gap in enforcement. Other
      checks still apply. An explicit rejection from a reachable webhook is enforced with either value.
    - Scope decides the blast radius. This webhook selects only namespaces labelled ce-lab15=scoped, with
      a rule limited to CREATE on Pods, so unlabelled namespaces are never consulted and deletions, Deployment
      writes and other operations are never intercepted.
    - A webhook that matches every namespace, including its own, can block the creation of the very Pods
      that would restore it. That is why this backend lives in a namespace the webhook does not select,
      and why a single backend replica makes failurePolicy a single point of failure.
    - 'The fixture is therefore two namespaces. ce-lab15 carries the scoped label and holds the workloads
      you create. ce-lab15-system is unlabelled and holds the backend: one Deployment named admission
      with a single replica, and a Service publishing port 443 to the container''s 8443. The rule enforced
      is that a Pod must carry an owner label.'
    - Rejection appears where the request was made, not necessarily where you are looking. Creating a
      Pod directly returns the webhook error to kubectl. A Deployment is accepted, because a Deployment
      is not a Pod; its ReplicaSet then retries Pod creation, records FailedCreate events and leaves the
      Deployment reporting ReplicaFailure with zero ready replicas.
    - The outage is injected by scaling the backend to zero, which empties the Service's endpoints. A
      Service without endpoints is normally refused at once, so the create fails in a fraction of a second
      rather than spending the five-second timeout; that timeout is what a slow webhook would consume.
      Recovery lags too, until each node's rules allow the call again.
    - The API server calls the webhook over HTTPS and verifies its certificate against the caBundle in
      the configuration. Setup generates one self-signed certificate for admission.ce-lab15-system.svc
      and installs it in both places, so a failure here comes from the injected fault rather than from
      trust. Server-side dry run also invokes the webhook, which tests enforcement without creating anything.
    main_lesson: >-
      An admission webhook is a synchronous dependency of the requests it matches. During a call
      failure, Fail blocks those writes and Ignore skips that check; Ignore does not override an
      explicit policy rejection. Scope limits the blast radius, and an accepted Deployment can still
      fail to create Pods. Check controller events and restore both backend availability and
      enforcement before calling recovery complete.
    in_this_lab:
    - Use the scoped namespace ce-lab15 and the unscoped backend namespace ce-lab15-system. Remove the
      webhook backend, observe direct creation, controller-driven creation and an unscoped namespace,
      then compare failurePolicy values before recovering.
    - wait_backend_removed waits for an empty backend set; wait_backend_ready waits for a ready endpoint.
      Both print EndpointSlice evidence and return an error if the expected state is not observed within
      30 checks.
    readings:
    - signal: failurePolicy / timeoutSeconds / namespaceSelector
      meaning: The configured behaviour on no answer, the wait before that decision, and which namespaces
        are consulted at all.
    - signal: admission error text
      meaning: A rejection naming the webhook is a dependency failure; a rejection carrying the policy
        message is enforcement working as designed.
    - signal: ReplicaSet events
      meaning: FailedCreate entries record rejections the controller received. The Deployment object itself
        can be accepted while no Pod exists.
    - signal: review ... allowed=
      meaning: The backend logs one line per admission review. No line means the request never reached
        the webhook.
    - signal: k / ksys
      meaning: kubectl fixed to kind-lab15 for the scoped namespace ce-lab15 and for the unscoped backend
        namespace ce-lab15-system.
  predict: Predict the result of creating a labelled Pod, a Deployment and an unscoped Pod while the backend
    is unavailable, and what changes under failurePolicy Ignore.
  answer_with:
  - Which baseline rejection is the policy working, and which would mean the dependency failed?
  - Why did a correctly labelled Pod fail once the backend was gone?
  - Where did the failure surface for the Deployment, and what limited the blast radius?
  - What did failurePolicy Ignore allow, and what proves enforcement works again?
  evidence:
    columns:
    - Case
    - Pod create result
    - Controller or namespace effect
    - Webhook log evidence
    rows:
    - Baseline with backend available
    - Backend scaled to zero
    - Deployment in scoped namespace
    - Pod in unscoped namespace
    - failurePolicy Ignore
    - Backend and Fail restored
  transfer: If the webhook selected its own namespace, could scaling the backend restore admission?
solution:
- The baseline should show failurePolicy Fail, a five-second timeout, the ce-lab15=scoped selector and one
  ready backend endpoint. The labelled Pod should be created and the unlabelled Pod rejected with the policy
  message, with one review line logged for each. A rejection quoting the policy is the check working; a rejection
  naming the webhook call itself would mean the dependency failed.
- With no backend endpoint the API server cannot complete its admission call, so creating even a correctly
  labelled Pod should fail with an error naming the webhook and the HTTPS request it could not complete,
  usually a refused connection to the Service address.
  The request fails during validating admission, before anything is persisted, so no Pod object exists and
  the backend logs no review line. The wait is usually short because a Service without endpoints is refused
  rather than left to time out.
- The Deployment should be accepted, because the rule matches Pods and not Deployments. Its ReplicaSet then
  fails to create Pods and records FailedCreate events carrying the same webhook error, leaving zero replicas
  while the Deployment reports a ReplicaFailure condition alongside its usual ones. The Pod created in the unscoped namespace should succeed, because the namespaceSelector never selects
  that namespace; that scoping is what keeps the rest of the cluster, and the backend's own namespace, usable.
- Under Ignore the unlabelled Pod should be created although the policy forbids it, which is the cost of choosing
  availability over enforcement during an outage. After scaling the backend back to one replica, waiting for
  its endpoint and restoring Fail, the Deployment should converge to two ready replicas, a labelled Pod should
  be admitted, and a server-side dry run of the unlabelled Pod should be rejected with the policy message again.
transfer_solution: No. Creating the backend's own Pods would itself require an admission call to the unavailable webhook, so the Deployment would stay at zero replicas. Recovery would need the webhook configuration deleted or switched to Ignore first, which is why a webhook must never select its own namespace.
verify_note: The backend has one ready endpoint, failurePolicy is Fail, and a server-side dry run of an unlabelled Pod is still rejected by the policy.
prerequisites: Provision the shared VM once with ./lab.sh provision. Run ./lab.sh 15 setup on the host. No other lab is required.
files:
- webhook.py
- backend.yaml
- webhook-config.yaml
- labelled-pod.yaml
- unlabelled-pod.yaml
- workload.yaml
- system-pod.yaml
- exercise.sh
commands:
- name: Record the configured dependency and prove enforcement
  where: VM terminal 1
  run: !unsafe |
    source ~/labs/lab15/exercise.sh
    source ~/labs/lab15/helpers.sh
    webhook_state
    backend_state
    k apply -f ~/labs/lab15/labelled-pod.yaml
    k wait pod/labelled --for=condition=Ready --timeout=60s --request-timeout=0
    k apply -f ~/labs/lab15/unlabelled-pod.yaml
    echo "unlabelled create exit=$?"
    k get pods -o custom-columns='NAME:.metadata.name,OWNER:.metadata.labels.owner,READY:.status.conditions[?(@.type=="Ready")].status'
    ksys logs deployment/admission --tail=10
  record: 'Baseline with backend available row: the policy, timeout and selector, the backend endpoint,
    both create results and the review lines.'
  expect: The labelled Pod should be admitted and the unlabelled Pod rejected by the policy message, with
    one logged review for each request.
- name: Remove the backend and create the same labelled Pod again
  where: VM terminal 1, same shell
  run: !unsafe |
    k delete pod labelled --wait=true --timeout=30s
    ksys scale deployment admission --replicas=0
    wait_backend_removed
    backend_state
    time k apply -f ~/labs/lab15/labelled-pod.yaml
    echo "labelled create exit=$?"
    k get pods
    ksys logs deployment/admission --tail=5 --pod-running-timeout=5s
    echo "backend log exit=$?"
  record: 'Backend scaled to zero row: the exact error, the elapsed time, the exit status, and whether
    any Pod exists.'
  expect: Deleting a Pod is unaffected, because the rule matches creation only. The creation should fail
    during validating admission with an error naming this webhook, and no new review should be logged
    for it.
- name: Compare a controller-driven creation with an unscoped namespace
  where: VM terminal 1, same shell
  run: !unsafe |
    k apply -f ~/labs/lab15/workload.yaml
    echo "deployment apply exit=$?"
    sleep 5
    k describe deployment policy-web
    k get rs -l app=policy-web
    k get events --field-selector reason=FailedCreate
    ksys apply -f ~/labs/lab15/system-pod.yaml
    echo "unscoped create exit=$?"
    ksys get pod unscoped -o custom-columns='NAME:.metadata.name,PHASE:.status.phase'
    ksys get namespace ce-lab15 ce-lab15-system -o custom-columns='NAME:.metadata.name,SCOPED:.metadata.labels.ce-lab15'
  record: 'Deployment in scoped namespace and Pod in unscoped namespace rows: both apply results, the
    Deployment counts and conditions, and the FailedCreate message.'
  expect: The Deployment object should be accepted while its ReplicaSet cannot create Pods. The unlabelled
    namespace is never consulted, so creation there should succeed.
- name: Change only the failure policy and repeat the forbidden creation
  where: VM terminal 1, same shell
  run: !unsafe |
    k patch validatingwebhookconfiguration ce-lab15-pods --type=json -p '[{"op":"replace","path":"/webhooks/0/failurePolicy","value":"Ignore"}]'
    webhook_state
    k apply -f ~/labs/lab15/unlabelled-pod.yaml
    echo "unlabelled create exit=$?"
    sleep 5
    k get pods -o custom-columns='NAME:.metadata.name,OWNER:.metadata.labels.owner,PHASE:.status.phase'
    k describe deployment policy-web
  record: 'failurePolicy Ignore row: the new policy value, the result of creating the forbidden Pod, the
    Pod list and the Deployment counts.'
  expect: The backend is still absent; only the meaning of no answer changed. Creation should now succeed
    without any check being performed.
- name: Restore the backend, the Fail policy and enforcement
  where: VM terminal 1, same shell
  run: !unsafe |
    k delete pod unlabelled --wait=true --timeout=30s
    ksys scale deployment admission --replicas=1
    ksys rollout status deployment/admission --request-timeout=0 --timeout=120s
    wait_backend_ready
    k patch validatingwebhookconfiguration ce-lab15-pods --type=json -p '[{"op":"replace","path":"/webhooks/0/failurePolicy","value":"Fail"}]'
    for i in $(seq 1 30); do
      k apply -f ~/labs/lab15/labelled-pod.yaml --dry-run=server >/dev/null 2>&1 && break
      sleep 2
    done
    webhook_state
    backend_state
    k rollout status deployment/policy-web --request-timeout=0 --timeout=120s
    k apply -f ~/labs/lab15/labelled-pod.yaml
    k wait pod/labelled --for=condition=Ready --timeout=60s --request-timeout=0
    k apply -f ~/labs/lab15/unlabelled-pod.yaml --dry-run=server
    echo "dry-run exit=$?"
    ksys logs deployment/admission --tail=10
  record: 'Backend and Fail restored row: the endpoint, the policy, the ready count, the labelled create
    result and the dry-run rejection.'
  expect: A ready backend Pod is not proof yet; each node's proxy rules must be rewritten first, which
    the bounded dry-run loop waits for. The controller should then create its Pods, and the dry run should
    be rejected without creating anything.
- name: Remove the experiment objects and confirm the final state
  where: VM terminal 1, same shell
  run: !unsafe |
    k delete deployment policy-web --wait=true --timeout=60s
    k delete pod labelled --wait=true --timeout=30s
    ksys delete pod unscoped --wait=true --timeout=30s
    k get pods
    ksys get pods
    webhook_state
  record: The remaining Pods in both namespaces and the final webhook configuration.
  expect: Only the backend Pod should remain, and the webhook should still be configured with Fail and
    its namespace selector.
setup:
- name: Prepare the webhook backend, certificate and scoped namespaces
  command: !unsafe |
    mkdir -p ~/labs/lab15
    cat > ~/labs/lab15/helpers.sh <<'SH'
    k() { kubectl --kubeconfig="$HOME/labs/lab15/kubeconfig" --context=kind-lab15 --namespace=ce-lab15 --request-timeout=10s "$@"; }
    ksys() { kubectl --kubeconfig="$HOME/labs/lab15/kubeconfig" --context=kind-lab15 --namespace=ce-lab15-system --request-timeout=10s "$@"; }
    webhook_state() {
      k get validatingwebhookconfiguration ce-lab15-pods -o json |
        jq '.webhooks[0] | {failurePolicy, timeoutSeconds, namespaceSelector, rules, service: .clientConfig.service}'
    }
    backend_state() {
      ksys get deployment admission -o json | jq '{desired:.spec.replicas,ready:.status.readyReplicas}'
      ksys get endpointslices -l kubernetes.io/service-name=admission -o json |
        jq -c '[.items[].endpoints // [] | .[] | {pod: .targetRef.name, ready: .conditions.ready}]'
    }
    SH
    source ~/labs/lab15/helpers.sh
    k get nodes >/dev/null
    k create namespace ce-lab15 --dry-run=client -o yaml | k apply -f -
    k create namespace ce-lab15-system --dry-run=client -o yaml | k apply -f -
    k label namespace ce-lab15 ce-lab15=scoped --overwrite
    openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
      -keyout ~/labs/lab15/tls.key -out ~/labs/lab15/tls.crt \
      -subj '/CN=admission.ce-lab15-system.svc' \
      -addext 'subjectAltName=DNS:admission.ce-lab15-system.svc' 2>/dev/null
    ksys create secret tls admission-tls --cert="$HOME/labs/lab15/tls.crt" --key="$HOME/labs/lab15/tls.key" --dry-run=client -o yaml | ksys apply -f -
    ksys create configmap admission-scripts --from-file=webhook.py="$HOME/labs/lab15/webhook.py" --dry-run=client -o yaml | ksys apply -f -
    ksys apply -f ~/labs/lab15/backend.yaml
    ksys rollout status deployment/admission --request-timeout=0 --timeout=180s
    sed "s|CA_BUNDLE_PLACEHOLDER|$(base64 -w0 < ~/labs/lab15/tls.crt)|" ~/labs/lab15/webhook-config.yaml | k apply -f -
    for i in $(seq 1 30); do
      k apply -f ~/labs/lab15/labelled-pod.yaml --dry-run=server >/dev/null 2>&1 && break
      sleep 2
    done
    k apply -f ~/labs/lab15/labelled-pod.yaml --dry-run=server >/dev/null
    k delete pod labelled unlabelled --ignore-not-found --wait=true --timeout=30s
    k delete deployment policy-web --ignore-not-found --wait=true --timeout=60s
    ksys delete pod unscoped --ignore-not-found --wait=true --timeout=30s
verify:
- name: Verify the backend, the failure policy and live enforcement
  command: !unsafe |
    source ~/labs/lab15/helpers.sh
    ksys rollout status deployment/admission --request-timeout=0 --timeout=60s
    k get validatingwebhookconfiguration ce-lab15-pods -o json | jq -e '.webhooks[0].failurePolicy == "Fail" and .webhooks[0].namespaceSelector.matchLabels["ce-lab15"] == "scoped"' >/dev/null
    ksys get endpointslices -l kubernetes.io/service-name=admission -o json | jq -e '[.items[].endpoints // [] | .[]] | length > 0' >/dev/null
    k apply -f ~/labs/lab15/labelled-pod.yaml --dry-run=server >/dev/null
    ! k apply -f ~/labs/lab15/unlabelled-pod.yaml --dry-run=server 2>/dev/null
reset: []
