apiVersion: apps/v1
kind: Deployment
metadata:
  name: admission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admission
  template:
    metadata:
      labels:
        app: admission
    spec:
      terminationGracePeriodSeconds: 2
      volumes:
      - name: tls
        secret:
          secretName: admission-tls
      - name: scripts
        configMap:
          name: admission-scripts
      containers:
      - name: webhook
        image: python:3.12-slim
        command:
        - python
        - -u
        - /scripts/webhook.py
        ports:
        - containerPort: 8443
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: scripts
          mountPath: /scripts
        resources:
          requests:
            cpu: 20m
            memory: 16Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8443
            scheme: HTTPS
          periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: admission
spec:
  selector:
    app: admission
  ports:
  - port: 443
    targetPort: 8443
