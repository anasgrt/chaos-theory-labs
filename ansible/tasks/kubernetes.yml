---
# Shared implementation; each lab owns a separate cluster inside the same VM.
- name: Install the cluster definition
  ansible.builtin.copy:
    src: kubernetes/kind.yaml
    dest: "{{ lab_workspace }}/kind.yaml"
    mode: '0644'

- name: Check registry DNS before creating this lab's cluster
  ansible.builtin.command: "timeout 5s getent ahostsv4 {{ item }}"
  loop: [registry-1.docker.io, auth.docker.io, dl.k8s.io]
  changed_when: false

- name: Inspect clusters in the shared VM
  ansible.builtin.command: kind get clusters
  register: lab_clusters
  changed_when: false

- name: Create this lab's four-node cluster
  # The first run also downloads/extracts the large node image. Node readiness
  # still has its own 180-second bound; later labs reuse the shared image cache.
  ansible.builtin.shell: |
    timeout 30m kind create cluster --name {{ lab_cluster }} --config "{{ lab_workspace }}/kind.yaml" --kubeconfig "{{ lab_workspace }}/kubeconfig" --wait 180s
  when: lab_cluster not in lab_clusters.stdout_lines

- name: Install kubectl and load this lab's cached workload images
  ansible.builtin.shell: |
    set -euo pipefail
    "$HOME/labs/install-kubectl-for-kind.sh" {{ lab_cluster }}
    "$HOME/labs/load-lab-images-into-kind.sh" {{ lab_cluster }} {{ lab_cluster_images | join(' ') }}
  args:
    executable: /bin/bash
  vars:
    lab_cluster_images: "{{ ['bloomberg/goldpinger:3.11.3', 'ghcr.io/shopify/toxiproxy:2.12.0'] if lab_id in ['10', '11'] else (['nginx:1.27'] if lab_id == '13' else ['python:3.12-slim']) }}"

- name: Create this lab's working namespace
  ansible.builtin.shell: |
    set -euo pipefail
    source "{{ lab_workspace }}/env.sh"
    k create namespace chaos-labs --dry-run=client -o yaml | k apply -f -
  args:
    executable: /bin/bash

- name: Install the independent Goldpinger fixture
  ansible.builtin.copy:
    src: kubernetes/goldpinger.yaml
    dest: "{{ lab_workspace }}/goldpinger.yaml"
    mode: '0644'
  when: lab_id in ['10', '11']

- name: Start this lab's Goldpinger replicas
  ansible.builtin.shell: |
    set -euo pipefail
    source "{{ lab_workspace }}/env.sh"
    k apply -f "{{ lab_workspace }}/goldpinger.yaml"
    k rollout status deployment/goldpinger --request-timeout=0 --timeout=180s
  args:
    executable: /bin/bash
  when: lab_id in ['10', '11']
