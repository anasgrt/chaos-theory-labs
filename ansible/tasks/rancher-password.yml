---
# Rancher 2.15 PasswordChangeRequest updates existing users as well as bootstrap
# users. Changing the Helm bootstrapPassword alone cannot reset an existing login.
- name: Wait for Rancher before reconciling the admin account
  ansible.builtin.command:
    argv: [/var/lib/rancher/rke2/bin/kubectl, --kubeconfig=/etc/rancher/rke2/rke2.yaml, --context=default, --namespace=cattle-system, rollout, status, deployment/rancher, --timeout=300s]
  changed_when: false

- name: Find the default Rancher admin account
  ansible.builtin.command:
    argv: [/var/lib/rancher/rke2/bin/kubectl, --kubeconfig=/etc/rancher/rke2/rke2.yaml, --context=default, --request-timeout=15s, get, users.management.cattle.io, -l, authz.management.cattle.io/bootstrapping=admin-user, -o, json]
  register: rancher_admin_lookup
  changed_when: false
  until: rancher_admin_lookup.rc == 0 and (rancher_admin_lookup.stdout | from_json)['items'] | length == 1
  retries: 12
  delay: 5

- name: Require the expected admin username
  ansible.builtin.assert:
    that: (rancher_admin_lookup.stdout | from_json)['items'][0].username == 'admin'
    fail_msg: The default Rancher account was renamed; refusing to print an incorrect admin login.

- name: Reset the existing admin password using the Rancher management API
  ansible.builtin.command:
    argv: [/var/lib/rancher/rke2/bin/kubectl, --kubeconfig=/etc/rancher/rke2/rke2.yaml, --context=default, --request-timeout=30s, create, -f, '-', -o, json]
    stdin: "{{ {'apiVersion': 'ext.cattle.io/v1', 'kind': 'PasswordChangeRequest', 'spec': {'userID': (rancher_admin_lookup.stdout | from_json)['items'][0].metadata.name, 'newPassword': rancher_admin_password}} | to_json }}"
  register: rancher_password_reset
  changed_when: true
  until: rancher_password_reset.rc == 0
  retries: 12
  delay: 5
  no_log: true

- name: Require a completed password change
  ansible.builtin.assert:
    that: (rancher_password_reset.stdout | from_json).status.summary == 'Completed'
  no_log: true

- name: Verify the configured admin password through Rancher HTTPS
  ansible.builtin.uri:
    url: "https://{{ rancher_hostname }}/v3-public/localProviders/local?action=login"
    method: POST
    body_format: json
    body:
      username: admin
      password: "{{ rancher_admin_password }}"
      responseType: json
      description: Provisioning login verification
      ttl: 60000
    ca_path: /etc/chaos-platform/tls/ca.crt
    validate_certs: true
    use_proxy: false
    status_code: 201
    return_content: true
  register: rancher_login_check
  until: rancher_login_check.status == 201
  retries: 6
  delay: 5
  no_log: true

- name: Revoke the temporary verification login
  ansible.builtin.uri:
    url: "https://{{ rancher_hostname }}/v3/tokens?action=logout"
    method: POST
    headers:
      Authorization: "Bearer {{ rancher_login_check.json.token }}"
    ca_path: /etc/chaos-platform/tls/ca.crt
    validate_certs: true
    use_proxy: false
    status_code: [200, 204]
  no_log: true
