title: "Lab 08 — A syscall error tests application handling"
concept: >-
  A syscall is an application request to the kernel, such as writing bytes or closing a
  connection. The kernel can return an error, and the application decides how to handle
  it. A server that normally works may still have a fragile error path.
mechanism: >-
  strace can substitute an EIO error for close in one process. The INJECTED marker identifies
  the artificial failure. Compare that line with the server's log and process state: a response
  may already have been sent before close fails. This tests error handling, not throughput;
  tracing itself adds overhead, and a synthetic error does not reproduce every detail of
  a real failure.
task:
  question: >-
    Why can one request succeed even though its close error stops the server?
  brief:
    theory_source: >-
      chaos-theory.md: §§6.2–6.4 and Experiment Cards 6.1–6.2.
    theory:
      - >-
        A syscall is an application request to the kernel, such as writing bytes or closing
        a connection. The kernel can return an error, and the application decides how to
        handle it. A server that normally works may still have a fragile error path.
      - >-
        strace can substitute an EIO error for close in one process. The INJECTED marker
        identifies the artificial failure. Compare that line with the server's log and process
        state: a response may already have been sent before close fails. This tests error
        handling, not throughput; tracing itself adds overhead, and a synthetic error does
        not reproduce every detail of a real failure.
    in_this_lab:
      - >-
        Target only the PID saved in server.pid. Use two VM terminals; Ctrl-C in the tracing
        terminal detaches strace.
  predict: >-
    Predict the triggering response, process state and next request after close returns
    EIO.
  steps:
    - >-
      Start the server and request a page; observe its normal syscalls without injecting.
    - >-
      Detach the observer, inject EIO into close and request another page.
    - >-
      Check the injection marker, server log and process state; try a second request to
      test whether service continues.
    - >-
      Restart without the injector, confirm HTTP works again and stop the recorded server.
  answer_with: >-
    Connect the injected close error to the server log and exit status. Explain the first
    and next HTTP results separately.
solution: >-
  This server treats a close error as fatal and should exit with status 1. The triggering
  request may already have received its response, but a dead process cannot serve later
  requests. The fault exposes an application error-handling decision, not a Kubernetes or
  network failure.
verify_note: >-
  The server responds after restart, then the test process is stopped.
commands:
  - name: Start the compiled book server and record its exact PID
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab08
      ./legacy_server > ~/labs/lab08-server.log 2>&1 & server=$!
      echo "$server" > server.pid
      sleep 1
      curl -fsS --max-time 3 http://127.0.0.1:8080/ | head -3
      echo "server PID=$server"
    expect: >-
      HTML lines from the server. Keep this terminal: wait "$server" only works in it.
  - name: Observe writes, closes and fsyncs without changing behaviour (Ctrl-C to detach)
    where: VM terminal 2
    run: !unsafe |
      PID=$(cat ~/labs/lab08/server.pid)
      sudo strace -p "$PID" -e trace=write,close,fsync -o ~/labs/lab08-trace.txt
  - name: Request one page while the tracer is attached
    where: VM terminal 1
    run: !unsafe |
      curl -sS --max-time 3 -o /dev/null -w '%{http_code} %{size_download}\n' http://127.0.0.1:8080/
  - name: After Ctrl-C in terminal 2, inspect the trace
    where: VM terminal 2
    run: !unsafe |
      awk -F'(' '{print $1}' ~/labs/lab08-trace.txt | sort | uniq -c
      grep -E '= -1' ~/labs/lab08-trace.txt | head
    expect: >-
      Many write calls, one fsync and one close per request. fsync on a socket returns -1
      EINVAL, which is not an outage cause.
  - name: Inject EIO into close (leave attached)
    where: VM terminal 2
    run: !unsafe |
      PID=$(cat ~/labs/lab08/server.pid)
      sudo strace -p "$PID" -e trace=close -e inject=close:error=EIO
  - name: Request one page and read the application outcome
    where: VM terminal 1
    run: !unsafe |
      curl -sS --max-time 3 -o /dev/null -w '%{http_code} %{size_download}\n' http://127.0.0.1:8080/
      sleep 1
      if kill -0 "$server" 2>/dev/null; then echo 'server still running'; else wait "$server"; echo "server exit=$?"; fi
      tail -3 ~/labs/lab08-server.log
      curl -sS --max-time 3 -o /dev/null -w 'next request: %{http_code}\n' http://127.0.0.1:8080/
    expect: >-
      strace shows close(...) = -1 EIO (Input/output error) (INJECTED); the server exits
      with status 1 after "error closing socket". The next request should fail to connect;
      record its result separately from the first response.
  - name: Restore HTTP service, then stop the test server
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab08
      if kill -0 "$server" 2>/dev/null; then kill "$server"; wait "$server"; fi
      ./legacy_server > ~/labs/lab08-server.log 2>&1 & server=$!
      echo "$server" > server.pid
      sleep 1
      curl -sS --max-time 3 -o /dev/null -w '%{http_code} %{size_download}\n' http://127.0.0.1:8080/
      kill "$server"; wait "$server"
      rm -f ~/labs/lab08/server.pid
    expect: >-
      HTTP responds after restart; the test server is then stopped.
optional_explanation: >-
  Optional: alternating write errors and tracer cost. The blocks restart the server, compare
  untraced and traced controls, inject alternating write errors, then clean up. Header writes
  and body retries differ; a living process may send invalid HTTP.
optional_commands:
  - name: Restart the server (detach any tracer first) and confirm the baseline
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab08
      ./legacy_server > ~/labs/lab08-server.log 2>&1 & server=$!
      echo "$server" > server.pid
      sleep 1
      curl -sS --max-time 3 -o /dev/null -w '%{http_code} %{size_download}\n' http://127.0.0.1:8080/
      ab -r -n 200 -c 1 -s 5 http://127.0.0.1:8080/ | grep -E 'Complete requests|Failed requests|Requests per second'
  - name: Traced, non-injecting control for tracer overhead (Ctrl-C after the next step)
    where: VM terminal 2
    run: !unsafe |
      PID=$(cat ~/labs/lab08/server.pid)
      sudo strace -p "$PID" -e trace=write -o /dev/null
  - name: Measure under the control tracer
    where: VM terminal 1
    run: !unsafe |
      ab -r -n 200 -c 1 -s 5 http://127.0.0.1:8080/ | grep -E 'Complete requests|Failed requests|Requests per second'
  - name: Inject EIO into the 1st, 3rd, 5th ... write (after Ctrl-C of the control tracer)
    where: VM terminal 2
    run: !unsafe |
      PID=$(cat ~/labs/lab08/server.pid)
      sudo strace -p "$PID" -e trace=write -e inject=write:error=EIO:when=1+2
  - name: Measure status, body completeness and throughput under write injection
    where: VM terminal 1
    run: !unsafe |
      for i in 1 2 3 4 5; do curl -sS --max-time 3 -o /dev/null -w '%{http_code} %{size_download}\n' http://127.0.0.1:8080/; done
      ab -r -n 200 -c 1 -s 5 http://127.0.0.1:8080/ | grep -E 'Complete requests|Failed requests|Requests per second'
    expect: >-
      Every request loses its header: curl reports "Received HTTP/0.9 when not allowed"
      and 000, and strace shows the HTTP/1.0 header write as (INJECTED). The header write
      in main.c has no retry; respond() retries each failed body write, so body writes succeed.
      Compare ab's results with the baseline and note the server keeps running.
  - name: Recover (Ctrl-C the tracer first)
    where: VM terminal 1
    run: !unsafe |
      kill "$server"; wait "$server"
      rm -f ~/labs/lab08/server.pid
setup:
  - name: Free the shared WordPress port and compile the C fixture
    command: !unsafe |
      # legacy_server listens on 8080, which Lab 07's WordPress stack also uses.
      if [[ -f "$HOME/labs/lab07/compose.yaml" ]]; then docker compose -f "$HOME/labs/lab07/compose.yaml" down; fi
      mkdir -p "$HOME/labs/lab08"
      cd "$HOME/labs/book/examples/who-you-gonna-call/src"
      cc -O0 -o "$HOME/labs/lab08/legacy_server" $(find . -name '*.c')
verify:
  - name: Verify the syscall fixture is ready
    command: !unsafe |
      test -x "$HOME/labs/lab08/legacy_server"
      if [[ -f "$HOME/labs/lab08/server.pid" ]]; then ! kill -0 "$(cat "$HOME/labs/lab08/server.pid")" 2>/dev/null; fi
reset:
  - name: Stop only the PID recorded by Lab 08
    command: !unsafe |
      pid_file="$HOME/labs/lab08/server.pid"
      if [[ -f "$pid_file" ]] && [[ "$(cat "$pid_file")" =~ ^[0-9]+$ ]]; then
        kill "$(cat "$pid_file")" 2>/dev/null || true
      fi
      rm -f "$pid_file" "$HOME/labs/lab08/legacy_server" "$HOME/labs/lab08-trace.txt" "$HOME/labs/lab08-server.log"
