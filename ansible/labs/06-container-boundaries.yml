title: "Lab 06 — Separate containers can share a full filesystem"
concept: >-
  Containers can have separate process and filesystem views while still mounting the same
  underlying storage. A container boundary does not create additional capacity for that
  shared mount. Both writers consume the same finite pool of free space.
mechanism: >-
  When the shared filesystem is full, a write can fail with No space left on device even
  in a newly started container. Freeing space and retrying the same write tests whether
  shared capacity caused the failure. This lab uses a small tmpfs to demonstrate capacity
  exhaustion; it does not measure physical disk performance.
task:
  question: >-
    Why can one container prevent another from writing to a shared filesystem?
  brief:
    theory_source: >-
      chaos-theory.md: §5.4 and Experiment Card 5.1. The tmpfs fixture adapts the shared-storage
      example.
    theory:
      - >-
        Containers can have separate process and filesystem views while still mounting the
        same underlying storage. A container boundary does not create additional capacity
        for that shared mount. Both writers consume the same finite pool of free space.
      - >-
        When the shared filesystem is full, a write can fail with No space left on device
        even in a newly started container. Freeing space and retrying the same write tests
        whether shared capacity caused the failure. This lab uses a small tmpfs to demonstrate
        capacity exhaustion; it does not measure physical disk performance.
    in_this_lab:
      - >-
        Two disposable containers mount the same 32 MiB tmpfs. Only this small lab mount
        is filled.
  predict: >-
    Will a fresh container be able to write after another fills their shared mount?
  steps:
    - >-
      Write one MiB to the empty shared mount to establish the baseline.
    - >-
      Fill the mount from one container and repeat the same probe from another.
    - >-
      Delete the filling file, repeat the probe and unmount the filesystem.
  answer_with: >-
    Compare the identical write before filling, while full and after freeing space. Explain
    which resource the two containers share.
solution: >-
  The new container has a separate process environment but uses the same full tmpfs. Its
  write therefore fails until the filling file is removed. Success before filling and after
  freeing space supports shared-capacity exhaustion as the explanation. Container separation
  alone does not protect this shared resource.
verify_note: >-
  No ce-lab06 test container remains and the shared tmpfs is unmounted.
commands:
  - name: Mount the small shared filesystem and prove a write works
    where: VM terminal 1
    run: !unsafe |
      mkdir -p ~/labs/lab06/shared
      sudo mount -t tmpfs -o size=32m tmpfs "$HOME/labs/lab06/shared"
      docker run --rm -v "$HOME/labs/lab06/shared:/data" ubuntu:24.04 sh -c 'dd if=/dev/zero of=/data/probe bs=1M count=1'
      sudo rm -f ~/labs/lab06/shared/probe
    expect: >-
      The one-MiB write succeeds before space is consumed.
  - name: Fill it from one container and repeat the same write from another
    where: VM terminal 1
    run: !unsafe |
      docker run --rm -v "$HOME/labs/lab06/shared:/data" ubuntu:24.04 sh -c 'dd if=/dev/zero of=/data/full bs=1M count=40; df -h /data'
      docker run --rm -v "$HOME/labs/lab06/shared:/data" ubuntu:24.04 sh -c 'dd if=/dev/zero of=/data/probe bs=1M count=1'
    expect: >-
      The filling write and the second container’s probe reach No space left on device.
  - name: Free the space, repeat the write, and unmount
    where: VM terminal 1
    run: !unsafe |
      sudo rm -f ~/labs/lab06/shared/full ~/labs/lab06/shared/probe
      docker run --rm -v "$HOME/labs/lab06/shared:/data" ubuntu:24.04 sh -c 'dd if=/dev/zero of=/data/probe bs=1M count=1'
      sudo rm -f ~/labs/lab06/shared/probe
      sudo umount ~/labs/lab06/shared
    expect: >-
      The same probe succeeds after capacity is freed.
setup:
  - name: Create the Lab 06 shared-path mountpoint
    command: !unsafe |
      mkdir -p "$HOME/labs/lab06/shared"
verify:
  - name: Verify the clean container-limit baseline
    command: !unsafe |
      test -z "$(docker ps -aq --filter 'name=^/ce-lab06-')"
      ! mountpoint -q "$HOME/labs/lab06/shared"
reset:
  - name: Remove only Lab 06 containers and tmpfs
    command: !unsafe |
      docker ps -aq --filter 'name=^/ce-lab06-' | xargs -r docker rm -f
      if mountpoint -q "$HOME/labs/lab06/shared"; then sudo umount "$HOME/labs/lab06/shared"; fi
      rm -f "$HOME/labs/lab06/shared/full" "$HOME/labs/lab06/shared/probe"
optional_commands:
  - name: Read a hard CPU cap
    where: VM terminal 1
    run: !unsafe |
      source ~/labs/common.sh
      docker run -d --name ce-lab06-cpu --cpus=0.5 python:3.12-slim \
        python -c 'import time; end=time.monotonic()+30
      while time.monotonic()<end: pass'
      path=$(cg ce-lab06-cpu)
      cat "$path/cpu.max" "$path/cpu.stat"
      docker stats --no-stream ce-lab06-cpu
      docker wait ce-lab06-cpu
      docker rm ce-lab06-cpu
    expect: >-
      cpu.max shows 50000 100000 and docker stats shows about 50% CPU.
  - name: Bound a memory allocator and collect three kinds of evidence
    where: VM terminal 1
    run: !unsafe |
      since=$(date --iso-8601=seconds)
      docker run --name ce-lab06-mem --memory=64m --memory-swap=64m python:3.12-slim \
        python -c 'a=[]
      while True: a.append(b"x"*1000000)'
      echo "exit=$?"
      docker inspect ce-lab06-mem --format '{{json .State}}'
      sudo journalctl -k --since "$since" --no-pager | grep -iE 'oom|killed process'
      docker rm ce-lab06-mem
    expect: >-
      exit=137, "OOMKilled":true and a kernel OOM line naming python.
  - name: Bound process creation without a fork bomb
    where: VM terminal 1
    run: !unsafe |
      docker run --name ce-lab06-pids --pids-limit=20 --memory=128m python:3.12-slim python -c '
      import subprocess
      children=[]
      try:
          for i in range(40): children.append(subprocess.Popen(["sleep","15"]))
      except OSError as e: print(type(e).__name__,str(e),"children",len(children),flush=True)
      finally:
          for p in children: p.terminate()
          for p in children: p.wait()'
      docker rm ce-lab06-pids
    expect: >-
      A BlockingIOError (Resource temporarily unavailable) with fewer than 20 children.
optional_explanation: >-
  Optional: compare CPU, memory and task limits. CPU quotas throttle execution; memory exhaustion
  may trigger OOM; a task cap refuses new processes. Record the different symptom and evidence
  in each case. These cgroup limits do not establish separate capacity for a shared filesystem.
