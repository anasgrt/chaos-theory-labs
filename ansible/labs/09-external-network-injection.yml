title: 'Lab 09 — Delay from outside the target container'
concept: >-
  A network namespace contains interfaces, routes and packet-handling configuration. Containers sharing that namespace share those network settings even if they have separate filesystems. This lets a helper supply diagnostic tools without modifying the application's image. It also means a helper's networking changes can directly affect the target, so the chosen namespace defines the actual scope.
mechanism: >-
  The host can enter MySQL's network namespace, or a helper container can join it and use NET_ADMIN permission to configure tc. Both methods install a netem qdisc on the same target interface, delaying database egress. Pumba automates related targeting and cleanup. The qdisc remains attached to the interface after the helper exits; deleting the helper alone does not restore traffic.
solution: 'Run both Lab 9 injection methods, confirm qdisc counters and HTTP impact, then delete the MySQL namespace qdisc before removing the helper.'
verify_note: 'WordPress is reachable, the helper image exists, and MySQL has no netem qdisc.'
commands:
  - name: Resolve MySQL and measure WordPress
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab05
      DB=$(docker compose ps -q db)
      PID=$(docker inspect -f '{{.State.Pid}}' "$DB")
      dbnet() { [ "$PID" -gt 1 ] || return 1; sudo nsenter --target "$PID" --net -- "$@"; }
      dbnet tc qdisc show dev eth0
      source ~/labs/common.sh
      measure http://localhost:8080/ 10
    expect: >-
      eth0 shows only the default qdisc (noqueue). Do not continue if a custom root qdisc exists.
  - name: Add 25 ms on all MySQL egress from the host, measure, recover
    where: VM terminal 1, same shell
    run: !unsafe |
      dbnet tc qdisc add dev eth0 root netem delay 25ms
      dbnet tc -s qdisc show dev eth0
      measure http://localhost:8080/ 10
      dbnet tc qdisc del dev eth0 root
      measure http://localhost:8080/ 10
    expect: >-
      Page latency rises by more than 25 ms while the netem counter grows, then returns to baseline.
  - name: Repeat the same injection from a helper container that joins the MySQL network namespace
    where: VM terminal 1, same shell
    run: !unsafe |
      docker image inspect ce-tc:lab --format '{{.Config.Entrypoint}}'
      docker run --rm --network "container:$DB" --cap-add NET_ADMIN ce-tc:lab qdisc add dev eth0 root netem delay 25ms
      docker run --rm --network "container:$DB" --cap-add NET_ADMIN ce-tc:lab -s qdisc show dev eth0
      measure http://localhost:8080/ 10
      dbnet tc qdisc show dev eth0
      docker run --rm --network "container:$DB" --cap-add NET_ADMIN ce-tc:lab qdisc del dev eth0 root
    expect: >-
      Entrypoint [tc]. The host still sees the netem qdisc after each --rm helper exited: removing the helper does not undo tc.
  - name: Confirm recovery
    where: VM terminal 1, same shell
    run: !unsafe |
      dbnet tc qdisc show dev eth0
      measure http://localhost:8080/ 10
    expect: >-
      eth0 is back to the default qdisc and latency matches the baseline.
setup:
  - name: Ensure the shared WordPress stack is running
    command: |
      test -f "$HOME/labs/lab05/compose.yaml" || {
        echo 'Lab 09 requires Lab 05. Run ./ansible/run-lab.sh 05 setup first.' >&2
        exit 1
      }
      cd "$HOME/labs/lab05"
      docker compose up -d
  - name: Build the explicit tc helper image
    command: |
      mkdir -p "$HOME/labs/lab09"
      cat > "$HOME/labs/lab09/Dockerfile" <<'DOCKERFILE'
      FROM ubuntu:24.04
      RUN apt-get update && apt-get install -y iproute2 && rm -rf /var/lib/apt/lists/*
      ENTRYPOINT ["tc"]
      DOCKERFILE
      docker build -t ce-tc:lab "$HOME/labs/lab09"
verify:
  - name: Verify helper and MySQL network recovery
    command: |
      docker inspect ce-lab05-db-1 >/dev/null || {
        echo 'Lab 09 requires the Lab 05 MySQL fixture.' >&2
        exit 1
      }
      docker image inspect ce-tc:lab >/dev/null
      curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8080/
      db_pid=$(docker inspect ce-lab05-db-1 | jq -er '.[0].State.Pid')
      ! sudo nsenter --target "$db_pid" --net -- tc qdisc show dev eth0 | grep -q netem
reset:
  - name: Remove the qdisc from MySQL before the helper
    command: |
      db_pid=$(docker inspect ce-lab05-db-1 2>/dev/null | jq -er '.[0].State.Pid' 2>/dev/null || true)
      if [[ "$db_pid" =~ ^[2-9][0-9]*$ ]]; then
        sudo nsenter --target "$db_pid" --net -- tc qdisc del dev eth0 root 2>/dev/null || true
      fi
      docker image rm ce-tc:lab 2>/dev/null || true
