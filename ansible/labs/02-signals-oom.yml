title: "Lab 02 — Prove why a process was killed"
concept: >-
  SIGKILL stops a process without allowing a handler to run. Bash commonly reports death
  by SIGKILL as 137: 128 plus signal number 9. That status describes how the process ended,
  not why the signal was sent. A program can also explicitly return 137, so the number alone
  cannot establish the cause.
mechanism: >-
  A cgroup memory limit restricts a group even when the VM has free memory elsewhere. If
  its memory demand cannot be satisfied, the kernel may kill a process to reclaim memory.
  Match the unit result and kernel log to the same process and time window to distinguish
  that event from an ordinary kill or the runtime limit expiring.
task:
  question: >-
    Why is exit status 137 insufficient to diagnose an OOM kill?
  brief:
    theory_source: >-
      chaos-theory.md: §2.3; optional memory comparison: §3.3.4 and Experiment Card 5.4
      (with its qualification).
    theory:
      - >-
        SIGKILL stops a process without allowing a handler to run. Bash commonly reports
        death by SIGKILL as 137: 128 plus signal number 9. That status describes how the
        process ended, not why the signal was sent. A program can also explicitly return
        137, so the number alone cannot establish the cause.
      - >-
        A cgroup memory limit restricts a group even when the VM has free memory elsewhere.
        If its memory demand cannot be satisfied, the kernel may kill a process to reclaim
        memory. Match the unit result and kernel log to the same process and time window
        to distinguish that event from an ordinary kill or the runtime limit expiring.
    in_this_lab:
      - >-
        The allocator runs only in ce-lab02, with 128 MiB memory, no swap and a 20-second
        runtime bound.
  predict: >-
    Will a deliberate SIGKILL and a memory-limit kill have different exit statuses? Which
    evidence can distinguish them?
  steps:
    - >-
      Record the status of the deliberately killed process.
    - >-
      Run the memory-limited allocator and collect its unit and kernel logs.
    - >-
      Match the termination to its logged cause, then stop the allocator if needed.
  answer_with: >-
    Compare the known SIGKILL with the allocator result. Cite the matching log that identifies
    the allocator’s cause; status 137 alone is not enough.
solution: >-
  The allocator should trigger a cgroup OOM kill before its runtime bound. Status 137 is
  consistent with SIGKILL, but only the matching memory-kill evidence explains why. If the
  logs show a runtime timeout or a userspace kill, report that cause instead.
verify_note: >-
  The allocator is stopped and its termination evidence has been recorded.
commands:
  - name: Record a deliberate SIGKILL
    where: VM terminal 1
    run: !unsafe |
      python3 -c 'import os,signal; os.kill(os.getpid(),signal.SIGKILL)'
      echo "deliberate KILL exit=$?"
    expect: >-
      Bash normally reports 137. Here you know the cause because the program deliberately
      sent SIGKILL.
  - name: Cause a cgroup-bounded OOM and collect unit plus kernel evidence
    where: VM terminal 1
    run: !unsafe |
      since=$(date --iso-8601=seconds)
      sudo systemd-run --unit=ce-lab02 --wait --collect \
        -p MemoryMax=128M -p MemorySwapMax=0 -p RuntimeMaxSec=20s \
        /usr/bin/python3 -c 'a=[]
      while True: a.append(b"x"*1000000)'
      sudo journalctl -u ce-lab02 --since "$since" --no-pager
      sudo journalctl -k --since "$since" --no-pager | grep -iE 'oom|killed process'
      sudo journalctl -u systemd-oomd --since "$since" --no-pager
    expect: >-
      The unit fails before the 20 s bound, with oom-kill in the unit log and a matching
      kernel line. An oomd entry means userspace acted instead.
  - name: Stop the allocator if it remains active
    where: VM terminal 1
    run: !unsafe |
      sudo systemctl stop ce-lab02.service 2>/dev/null || true
optional_explanation: >-
  Optional: compare other signal statuses, then virtual and resident memory. These examples
  extend the process-forensics lesson; they are not needed to distinguish a deliberate kill
  from OOM.
optional_commands:
  - name: Compare TERM, KILL and FPE exit statuses (interactive Bash, no set -e)
    where: VM terminal 1
    run: !unsafe |
      sleep 60 & victim=$!; kill -TERM "$victim"; wait "$victim"; echo "TERM=$?"
      sleep 60 & victim=$!; kill -KILL "$victim"; wait "$victim"; echo "KILL=$?"
      python3 -c 'import os,signal; os.kill(os.getpid(),signal.SIGFPE)'; echo "FPE=$?"
    expect: >-
      TERM=143, KILL=137, FPE=136.
  - name: Compare virtual size (VSZ) with touched memory (RSS)
    where: VM terminal 1
    run: !unsafe |
      mkdir -p ~/labs/lab02 && cd ~/labs/lab02
      cat > pages.py <<'PY'
      import mmap, os, time
      n=256*1024*1024
      m=mmap.mmap(-1,n)
      print('PID',os.getpid(),'mapped, not yet touched',flush=True)
      time.sleep(10)
      for offset in range(0,n,mmap.PAGESIZE): m[offset]=1
      print('touched every page',flush=True)
      time.sleep(10)
      PY
      python3 pages.py & victim=$!
      for i in $(seq 1 20); do ps -p "$victim" -o pid,vsz,rss,comm; sleep 1; done
      wait "$victim"
    expect: >-
      VSZ jumps by about 256 MiB at mapping; RSS rises only after "touched every page".
  - name: Cleanup, only if something is still running
    where: VM terminal 1, same shell
    run: !unsafe |
      sudo systemctl stop ce-lab02.service 2>/dev/null || true
      kill -0 "$victim" 2>/dev/null && kill "$victim"
setup:
  - name: Create the Lab 02 workspace
    command: !unsafe |
      mkdir -p "$HOME/labs/lab02"
verify:
  - name: Verify memory-control readiness
    command: !unsafe |
      grep -qw memory /sys/fs/cgroup/cgroup.controllers
      ! systemctl is-active --quiet ce-lab02.service
reset:
  - name: Stop the exact bounded unit
    command: !unsafe |
      sudo systemctl stop ce-lab02.service 2>/dev/null || true
