title: 'Lab 12 — Automated startup checks'
concept: >-
  An SLI measures a service outcome; an SLO sets a target for that measurement over a stated scope and window. This lab measures time from workload creation until an HTTP probe succeeds. That includes platform startup work, not just application execution. A repeated check samples variability, but five successful samples cannot establish a long-term availability or latency guarantee.
mechanism: >-
  The loop creates a disposable workload, starts timing, probes its exposed endpoint, records the result and removes its objects before repeating. Scheduling, image retrieval, startup and routing can all affect the duration. A deliberately delayed server acts as a known failing case to validate the checker. Cleanup prevents an old endpoint from producing false success; timestamps expose a checker that has stopped reporting.
task:
  question: >-
    Can a script reliably measure "a new Pod serves HTTP within 30 seconds", and does it actually detect a startup that is too slow?
  brief:
    theory:
      - >-
        One run proves one run (Ch. 11 §11.2): "a single counterexample is enough to prove a hypothesis wrong, but absence of such a counterexample doesn't prove anything." A pass shows only that the system behaved as expected during that experiment, not under peak traffic, other usage or other data.
      - >-
        Run it continuously (Ch. 11 §11.2): the book's PaaS promises a 1-minute deploy in its SLA and measured 30 s once — "Or does it?" Run the experiment continuously, on a system in a different state each time, and alert on an internal SLO more aggressive than the contractual SLA so you are warned before trouble.
      - >-
        SLI, SLO, SLA (Ch. 1 §1.2.1): an SLI puts a number on an event, an SLO is the agreed target range for it, an SLA is an SLO enforced by contract with a penalty. Work backward: business goal → SLO → a condition you can test continuously.
      - >-
        Why pod start time is unpredictable (Ch. 11 §11.2): image download (remote, prone to failure and retries), preparing dependencies such as volumes and configuration, and actually running the containers on a busy host all take variable time. Phases are pending, running, succeeded, failed and unknown; "you can't easily predict how long it's going to take", so test continuously and alert near the threshold.
      - >-
        The continuous check (Card 11.2): create a pod and a service → wait 30 seconds → call the service and fail if it is unavailable → remove both → repeat. Steady state is N/A because it measures a transition, no failure was injected, and the pod went Pending → ContainerCreating → Running in ~1 s.
      - >-
        Make it realistic (Card 11.2, Ch. 12 §12.1.1): use images that resemble what the platform runs, several of them, and imagePullPolicy: Always to test the cold-pull worst case — the scheduler prefers nodes that already hold the image because pulling is slow and failure-prone. The same pattern verifies pod-healing and scaling SLOs.
      - >-
        Continuous means recorded (Ch. 11 connections, cheat sheet §6–§7): an experiment that runs forever needs metrics and alerting, not a UI — metrics in a time-series database, not a dashboard refreshed by hand. Ask whether a result could be an artefact of the tooling, and whether the check should become continuous at all.
    in_this_lab:
      - >-
        startup.yaml creates Pod startup-check (python:3.12-slim running http.server on 8080, restartPolicy Never, HTTP readiness probe every 1 s) and a NodePort Service on 30090. The image is preloaded into the kind nodes with imagePullPolicy IfNotPresent, so no download is timed.
      - >-
        The Service routes only to Ready pods, so a probe succeeds only after the server listens and readiness passes. run.sh probes every 0.5 s for up to 30 s and records elapsed time in whole seconds (date +%s).
      - >-
        Each run writes ce_start_success, ce_start_seconds and ce_last_run_timestamp_seconds to a temporary file and renames it to metrics/start.prom, so a reader never sees half a file. An old timestamp reveals a checker that stopped.
      - >-
        The EXIT trap deletes the objects on normal exit and on Ctrl-C. Python as PID 1 in the container ignores SIGTERM, so cleanup uses --grace-period=1 instead of waiting 30 s.
      - >-
        sleep 45 before the server starts exceeds the 30 s budget, so a correct checker reports success=0.
  predict: >-
    Success and elapsed seconds for the healthy manifest, and the result when the container sleeps 45 s before serving.
  steps:
    - >-
      Save run.sh: five cycles of apply startup.yaml, probe NodePort 30090 for up to 30 s, write metrics, delete.
    - >-
      Run it against the healthy manifest; confirm no startup-check Pod or Service remains.
    - >-
      Change the command to sleep 45; exec python -m http.server 8080 and run it again.
    - >-
      Restore the good manifest and rerun; press Ctrl-C mid-run once and confirm cleanup still happens.
  answer_with: >-
    Per-run success and elapsed time for healthy, delayed and restored runs, the metrics/start.prom contents, and NotFound for the startup-check objects. Explain why five runs prove the checker works but do not prove an SLO.
solution: 'After Lab 10, use the prepared startup manifest and follow Lab 12 to run five healthy cycles, then prove detection using the deliberately delayed command.'
verify_note: 'The chaos cluster is reachable, the startup manifest is present, and no stale startup-check objects exist.'
commands:
  - name: Save the finite startup-check loop with cleanup
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab12
      cat > run.sh <<'SH'
      #!/usr/bin/env bash
      set -u
      source "$HOME/labs/common.sh"
      cd "$HOME/labs/lab12" || exit 1
      NODE_IP=$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' chaos-control-plane) || exit 1
      # PID 1 in the pod ignores SIGTERM; a 1 s grace period keeps cleanup inside the timeouts.
      cleanup() { k delete -f startup.yaml --ignore-not-found --wait=true --timeout=30s --grace-period=1 --request-timeout=0 >/dev/null; }
      trap cleanup EXIT
      trap 'exit 130' INT TERM
      mkdir -p metrics
      for run in $(seq 1 5); do
        cleanup || exit 1
        start=$(date +%s)
        ok=0
        k apply -f startup.yaml >/dev/null || exit 1
        while (( $(date +%s)-start < 30 )); do
          if curl -fs --max-time 1 -o /dev/null "http://$NODE_IP:30090/"; then ok=1; break; fi
          sleep 0.5
        done
        elapsed=$(( $(date +%s)-start ))
        (( elapsed <= 30 )) || ok=0
        printf 'run=%s success=%s elapsed=%ss\n' "$run" "$ok" "$elapsed"
        printf 'ce_start_success %s\nce_start_seconds %s\nce_last_run_timestamp_seconds %s\n' \
          "$ok" "$elapsed" "$(date +%s)" > metrics/start.prom.tmp
        mv metrics/start.prom.tmp metrics/start.prom
        k get pod startup-check -o wide
        sleep 2
      done
      SH
  - name: Predict, run five healthy cycles, confirm nothing is left behind
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab12
      source ~/labs/common.sh
      bash run.sh | tee runs.txt
      cat metrics/start.prom
      k get pod startup-check; k get svc startup-check
    expect: >-
      Five lines with success=1 and a few seconds elapsed; both final gets report NotFound.
  - name: Prove the check detects a deliberately delayed startup
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab12
      cp startup.yaml startup-good.yaml
      sed -i "s|command: \[python, -m, http.server, '8080'\]|command: [sh, -c, 'sleep 45; exec python -m http.server 8080']|" startup.yaml
      grep -n 'command:' startup.yaml
      bash run.sh | tee runs-delayed.txt
    expect: >-
      The grep shows the sleep 45 command; all five runs report success=0 after about 30 s.
  - name: Restore the good command and confirm healthy cycles again
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab12
      mv startup-good.yaml startup.yaml
      grep -n 'command:' startup.yaml
      bash run.sh | tee runs-restored.txt
  - name: Manual fallback if the loop was killed
    where: VM terminal 2
    run: !unsafe |
      source ~/labs/common.sh
      k delete -f ~/labs/lab12/startup.yaml --ignore-not-found --grace-period=1
setup:
  - name: Write the disposable startup-check manifest
    command: |
      kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos get nodes >/dev/null
      mkdir -p "$HOME/labs/lab12/metrics"
      cat > "$HOME/labs/lab12/startup.yaml" <<'YAML'
      apiVersion: v1
      kind: Pod
      metadata: {name: startup-check, labels: {app: startup-check}}
      spec:
        containers:
        - name: web
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: [python, -m, http.server, '8080']
          readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 1}
        restartPolicy: Never
      ---
      apiVersion: v1
      kind: Service
      metadata: {name: startup-check}
      spec:
        type: NodePort
        selector: {app: startup-check}
        ports: [{port: 8080, targetPort: 8080, nodePort: 30090}]
      YAML
verify:
  - name: Verify startup-check readiness to run
    command: |
      test -s "$HOME/labs/lab12/startup.yaml"
      ! kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs get pod startup-check >/dev/null 2>&1
reset:
  - name: Delete only startup-check resources and current metrics
    command: |
      kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs delete -f "$HOME/labs/lab12/startup.yaml" --ignore-not-found --wait=true 2>/dev/null || true
      rm -f "$HOME/labs/lab12/metrics/start.prom"
