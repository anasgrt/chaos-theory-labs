title: "Lab 12 — Test whether the checker detects failure"
concept: >-
  Startup is useful only when the requested workload can serve. Timing an HTTP response
  through its Service includes more of that path than checking whether the Pod is Running.
  The result is one service-level measurement, not proof of long-term reliability.
mechanism: >-
  A checker that only sees healthy runs might be wrong. Introduce a known delay beyond its
  30-second budget, then restore the healthy version. Deleting the previous workload prevents
  it from answering for the next test. The last-run timestamp distinguishes a recent result
  from one left by a stopped checker.
task:
  question: >-
    How do you show that a startup checker detects a missed deadline and subsequent recovery?
  brief:
    theory_source: >-
      chaos-theory.md: §11.2 and Experiment Card 11.2.
    theory:
      - >-
        Startup is useful only when the requested workload can serve. Timing an HTTP response
        through its Service includes more of that path than checking whether the Pod is
        Running. The result is one service-level measurement, not proof of long-term reliability.
      - >-
        A checker that only sees healthy runs might be wrong. Introduce a known delay beyond
        its 30-second budget, then restore the healthy version. Deleting the previous workload
        prevents it from answering for the next test. The last-run timestamp distinguishes
        a recent result from one left by a stopped checker.
    in_this_lab:
      - >-
        Setup prepares the checker and manifest. Each invocation creates a fresh workload,
        waits up to its 30-second budget, records a result and cleans up. The image is preloaded.
  predict: >-
    Predict success and elapsed time for normal startup, a 45-second delay, and the restored
    workload.
  steps:
    - >-
      Run one healthy trial; record HTTP startup time and the checker’s exit status.
    - >-
      Add the 45-second startup delay and repeat against the same 30-second budget.
    - >-
      Restore the manifest and repeat once more; confirm the test objects are removed.
  answer_with: >-
    Give the three results and explain why an HTTP deadline miss differs from a checker
    that exits without recording a trial.
solution: >-
  The delayed workload should miss the 30-second budget and be reported as unsuccessful.
  Restored healthy runs check that the fault was removed. These trials validate those checker
  paths; they do not establish an SLO for all future startups.
verify_note: >-
  The healthy manifest is restored and no startup-check Pod or Service remains.
commands:
  - name: Run one healthy check and confirm cleanup
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab12
      source ~/labs/common.sh
      bash run.sh | tee runs.txt
      echo "checker exit=${PIPESTATUS[0]} (0 means the loop completed)"
      cat metrics/start.prom
      k get pod startup-check; k get svc startup-check
    expect: >-
      One result with success=1 and a few seconds elapsed; both final gets report NotFound.
      A nonzero checker exit or no new result means the check did not complete; do not interpret
      old metrics as a new result.
  - name: Prove the check detects a deliberately delayed startup
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab12
      cp startup-delayed.yaml startup.yaml
      grep -n 'command:' startup.yaml
      bash run.sh | tee runs-delayed.txt
      echo "checker exit=${PIPESTATUS[0]} (0 means the loop completed)"
    expect: >-
      The grep shows the sleep 45 command; the run reports success=0 after about 30 s.
  - name: Restore the healthy command and repeat the check
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab12
      cp startup-good.yaml startup.yaml
      grep -n 'command:' startup.yaml
      bash run.sh | tee runs-restored.txt
      echo "checker exit=${PIPESTATUS[0]} (0 means the loop completed)"
  - name: Manual fallback if the loop was killed
    where: VM terminal 2
    run: !unsafe |
      source ~/labs/common.sh
      k delete -f ~/labs/lab12/startup.yaml --ignore-not-found --grace-period=1
setup:
  - name: Write the disposable startup-check manifest
    command: !unsafe |
      kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos get nodes >/dev/null
      mkdir -p "$HOME/labs/lab12/metrics"
      cat > "$HOME/labs/lab12/startup.yaml" <<'YAML'
      apiVersion: v1
      kind: Pod
      metadata: {name: startup-check, labels: {app: startup-check}}
      spec:
        containers:
        - name: web
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: [python, -m, http.server, '8080']
          readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 1}
        restartPolicy: Never
      ---
      apiVersion: v1
      kind: Service
      metadata: {name: startup-check}
      spec:
        type: NodePort
        selector: {app: startup-check}
        ports: [{port: 8080, targetPort: 8080, nodePort: 30090}]
      YAML
      cp "$HOME/labs/lab12/startup.yaml" "$HOME/labs/lab12/startup-good.yaml"
      sed "s|command: \[python, -m, http.server, '8080'\]|command: [sh, -c, 'sleep 45; exec python -m http.server 8080']|" "$HOME/labs/lab12/startup-good.yaml" > "$HOME/labs/lab12/startup-delayed.yaml"
      grep -q 'sleep 45' "$HOME/labs/lab12/startup-delayed.yaml"
  - name: Prepare the startup checker
    command: !unsafe |
      cd ~/labs/lab12
      cat > run.sh <<'SH'
      #!/usr/bin/env bash
      set -u
      source "$HOME/labs/common.sh"
      cd "$HOME/labs/lab12" || exit 1
      NODE_IP=$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' chaos-control-plane) || exit 1
      # PID 1 in the pod ignores SIGTERM; a 1 s grace period keeps cleanup inside the timeouts.
      cleanup() { k delete -f startup.yaml --ignore-not-found --wait=true --timeout=30s --grace-period=1 --request-timeout=0 >/dev/null; }
      trap cleanup EXIT
      trap 'exit 130' INT TERM
      mkdir -p metrics
      for run in $(seq 1 "${1:-1}"); do
        cleanup || exit 1
        start=$(date +%s)
        ok=0
        k apply -f startup.yaml >/dev/null || exit 1
        while (( $(date +%s)-start < 30 )); do
          if curl -fs --max-time 1 -o /dev/null "http://$NODE_IP:30090/"; then ok=1; break; fi
          sleep 0.5
        done
        elapsed=$(( $(date +%s)-start ))
        (( elapsed <= 30 )) || ok=0
        printf 'run=%s success=%s elapsed=%ss\n' "$run" "$ok" "$elapsed"
        printf 'ce_start_success %s\nce_start_seconds %s\nce_last_run_timestamp_seconds %s\n' \
          "$ok" "$elapsed" "$(date +%s)" > metrics/start.prom.tmp
        mv metrics/start.prom.tmp metrics/start.prom
        k get pod startup-check -o wide
        sleep 2
      done
      SH
verify:
  - name: Verify startup-check readiness to run
    command: !unsafe |
      test -s "$HOME/labs/lab12/startup.yaml"
      ! kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs get pod startup-check >/dev/null 2>&1
      test -s "$HOME/labs/lab12/run.sh"
reset:
  - name: Delete only startup-check resources and current metrics
    command: !unsafe |
      kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs delete -f "$HOME/labs/lab12/startup.yaml" --ignore-not-found --wait=true 2>/dev/null || true
      rm -f "$HOME/labs/lab12/metrics/start.prom"
      if [[ -f "$HOME/labs/lab12/startup-good.yaml" ]]; then cp "$HOME/labs/lab12/startup-good.yaml" "$HOME/labs/lab12/startup.yaml"; fi
optional_explanation: >-
  Optional: run five healthy cycles to observe variation, then interrupt another run with
  Ctrl-C. Verify that its Pod and Service are removed. The saved metric is the last completed
  trial; its timestamp must advance before it can represent a new result.
optional_commands:
  - name: Repeat healthy checks
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab12
      bash run.sh 5 | tee runs-repeated.txt
      echo "checker exit=${PIPESTATUS[0]}"
      cat metrics/start.prom
  - name: Start another run, press Ctrl-C, then inspect cleanup
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab12
      bash run.sh
      # Press Ctrl-C while the script is running; after it exits:
      source ~/labs/common.sh
      k get pod startup-check; k get svc startup-check
      cat metrics/start.prom
