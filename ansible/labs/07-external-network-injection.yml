title: "Lab 07 — Tools can act through a shared namespace"
concept: >-
  A network namespace contains interfaces, routes and packet-handling settings. A host process
  or helper container can join MySQL's namespace and configure its interface even though
  tc is not installed in MySQL's image. The helper needs NET_ADMIN to make that change.
mechanism: >-
  netem adds a queueing rule to the interface. The rule remains after the helper exits because
  it belongs to the shared network configuration. Delaying MySQL egress delays replies to
  WordPress; several dependent database exchanges can make a page slower by more than one
  delay interval.
task:
  question: >-
    Why does MySQL’s network delay remain after the helper container exits?
  brief:
    theory_source: >-
      chaos-theory.md: §§5.8–5.8.1 and Experiment Card 5.5.
    theory:
      - >-
        A network namespace contains interfaces, routes and packet-handling settings. A
        host process or helper container can join MySQL's namespace and configure its interface
        even though tc is not installed in MySQL's image. The helper needs NET_ADMIN to
        make that change.
      - >-
        netem adds a queueing rule to the interface. The rule remains after the helper exits
        because it belongs to the shared network configuration. Delaying MySQL egress delays
        replies to WordPress; several dependent database exchanges can make a page slower
        by more than one delay interval.
    in_this_lab:
      - >-
        The helper joins MySQL’s network namespace and adds 25 ms on eth0 egress. The core
        uses this method once; the host method is optional.
  predict: >-
    After the helper exits, predict the qdisc state and the page latency. What action should
    restore the baseline?
  steps:
    - >-
      Measure the page baseline and check that MySQL has only its default qdisc.
    - >-
      Add 25 ms through the helper; after it exits, inspect the qdisc and measure the page.
    - >-
      Delete the qdisc and compare the recovered page timing with baseline.
  answer_with: >-
    Record the qdisc and page timing after the helper exits and after deletion. Explain
    why removing the injector did not remove its effect.
solution: >-
  The helper changes the interface’s queueing configuration in MySQL’s network namespace.
  That configuration outlives the helper process, so its exit does not remove the delay.
  Deleting the qdisc removes the fault. Page time can increase by more than 25 ms because
  serving the page can require several database exchanges.
verify_note: >-
  MySQL has no netem qdisc and the page returns toward baseline latency.
commands:
  - name: Resolve MySQL and measure WordPress
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab07
      DB=$(docker compose ps -q db)
      PID=$(docker inspect -f '{{.State.Pid}}' "$DB")
      dbnet() { [ "$PID" -gt 1 ] || return 1; sudo nsenter --target "$PID" --net -- "$@"; }
      dbnet tc qdisc show dev eth0
      # Continue only with the default qdisc (noqueue), not an existing custom root qdisc.
      source ~/labs/common.sh
      measure http://localhost:8080/ 10
    expect: >-
      eth0 shows only the default qdisc (noqueue). Do not continue if a custom root qdisc
      exists.
  - name: Add delay from the helper and inspect it after the helper exits
    where: VM terminal 1, same shell
    run: !unsafe |
      docker image inspect ce-tc:lab --format '{{.Config.Entrypoint}}'
      docker run --rm --network "container:$DB" --cap-add NET_ADMIN ce-tc:lab qdisc add dev eth0 root netem delay 25ms
      docker run --rm --network "container:$DB" --cap-add NET_ADMIN ce-tc:lab -s qdisc show dev eth0
      measure http://localhost:8080/ 10
      dbnet tc qdisc show dev eth0
      docker run --rm --network "container:$DB" --cap-add NET_ADMIN ce-tc:lab qdisc del dev eth0 root
    expect: >-
      Entrypoint [tc]. The host still sees the netem qdisc after each --rm helper exited:
      removing the helper does not undo tc.
  - name: Confirm recovery
    where: VM terminal 1, same shell
    run: !unsafe |
      dbnet tc qdisc show dev eth0
      measure http://localhost:8080/ 10
    expect: >-
      eth0 is back to the default qdisc and latency matches the baseline.
setup:
  - name: Start the WordPress and MySQL fixture
    command: !unsafe |
      mkdir -p "$HOME/labs/lab07"
      cat > "$HOME/labs/lab07/compose.yaml" <<'YAML'
      name: ce-lab07
      services:
        db:
          image: mysql:8.4
          environment:
            MYSQL_ROOT_PASSWORD: lab-only-root
            MYSQL_DATABASE: wordpress
            MYSQL_USER: wordpress
            MYSQL_PASSWORD: lab-only-wordpress
          volumes: [dbdata:/var/lib/mysql]
          healthcheck:
            test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 --silent']
            interval: 5s
            timeout: 3s
            retries: 30
        wordpress:
          image: wordpress:6-apache
          depends_on:
            db: {condition: service_healthy}
          ports: ['127.0.0.1:8080:80']
          environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: lab-only-wordpress
            WORDPRESS_DB_NAME: wordpress
          volumes: [wp:/var/www/html]
      volumes: {dbdata: {}, wp: {}}
      YAML
      cd "$HOME/labs/lab07"
      docker compose up -d
      for _ in $(seq 1 36); do
        docker inspect ce-lab07-db-1 | jq -e '.[0].State.Health.Status == "healthy"' >/dev/null && exit 0
        sleep 5
      done
      echo 'MySQL did not become healthy; read docker compose logs db.' >&2
      exit 1
  - name: Complete the WordPress installer with disposable credentials
    command: !unsafe |
      code=000
      for _ in $(seq 1 30); do
        code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
        [[ "$code" =~ ^(200|302)$ ]] && break
        sleep 2
      done
      if [[ "$code" == 302 ]]; then
        curl -fsS --max-time 60 -o /dev/null "http://localhost:8080/wp-admin/install.php?step=2" \
          --data-urlencode weblog_title=ce-lab07 --data-urlencode user_name=labadmin \
          --data-urlencode admin_password=lab-only-Pass-123 --data-urlencode admin_password2=lab-only-Pass-123 \
          --data-urlencode pw_weak=1 --data-urlencode admin_email=lab@example.com --data-urlencode blog_public=0
      fi
      test "$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 200
  - name: Build the explicit tc helper image
    command: !unsafe |
      mkdir -p "$HOME/labs/lab07/tc-helper"
      cat > "$HOME/labs/lab07/tc-helper/Dockerfile" <<'DOCKERFILE'
      FROM ubuntu:24.04
      RUN apt-get update && apt-get install -y iproute2 && rm -rf /var/lib/apt/lists/*
      ENTRYPOINT ["tc"]
      DOCKERFILE
      # Host networking keeps apt DNS working even on a VM provisioned before the shared Docker DNS fix.
      docker build --network host -t ce-tc:lab "$HOME/labs/lab07/tc-helper"
verify:
  - name: Verify the WordPress fixture, helper image and MySQL network recovery
    command: !unsafe |
      docker inspect ce-lab07-db-1 | jq -e '.[0].State.Health.Status == "healthy"' >/dev/null
      docker image inspect ce-tc:lab >/dev/null
      test "$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 200
      db_pid=$(docker inspect ce-lab07-db-1 | jq -er '.[0].State.Pid')
      ! sudo nsenter --target "$db_pid" --net -- tc qdisc show dev eth0 | grep -q netem
reset:
  - name: Remove the MySQL qdisc, the helper image and the running stack (volumes are kept)
    command: !unsafe |
      db_pid=$(docker inspect ce-lab07-db-1 2>/dev/null | jq -er '.[0].State.Pid' 2>/dev/null || true)
      if [[ "$db_pid" =~ ^[2-9][0-9]*$ ]]; then
        sudo nsenter --target "$db_pid" --net -- tc qdisc del dev eth0 root 2>/dev/null || true
      fi
      docker image rm ce-tc:lab 2>/dev/null || true
      if [[ -f "$HOME/labs/lab07/compose.yaml" ]]; then docker compose -f "$HOME/labs/lab07/compose.yaml" down; fi
optional_commands:
  - name: Add 25 ms on all MySQL egress from the host, measure, recover
    where: VM terminal 1, same shell
    run: !unsafe |
      dbnet tc qdisc add dev eth0 root netem delay 25ms
      dbnet tc -s qdisc show dev eth0
      measure http://localhost:8080/ 10
      dbnet tc qdisc del dev eth0 root
      measure http://localhost:8080/ 10
    expect: >-
      Page latency rises by more than 25 ms while the netem counter grows, then returns
      to baseline.
optional_explanation: >-
  Optional: repeat the same 25 ms fault using host tc through nsenter. Use the same shell
  after core recovery. Both methods change MySQL’s network namespace; compare results and
  remove the qdisc before resetting.
