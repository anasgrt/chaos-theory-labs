title: 'Lab 21 — Team learning exercise'
concept: >-
  Operational recovery depends on a chain of people, permissions, decisions and documentation. A single specialist can become a knowledge dependency even when the software has redundant replicas. Having a runbook is insufficient if another responder cannot find it, access the tools or interpret its steps. The purpose is to expose weaknesses in that response system, not grade individuals.
mechanism: >-
  A tabletop substitutes a fictional incident for a live outage and assumes the usual specialist is unavailable. The responder explains concrete next actions while a scribe records missing evidence, access or handoffs. A skill matrix helps locate where knowledge is concentrated. Turning one observed obstacle into an owned improvement and rehearsing again tests whether the team's response path actually became more usable.
solution: 'Complete Lab 21’s skill matrix and 15-minute tabletop using the prepared template; the solution is an evidence-backed owner and completion check, not a technical fault.'
verify_note: 'The tabletop template names a scenario, responder, scribe, stop authority, and one measurable follow-up.'
commands:
  - name: Create a three-task skill matrix next to the tabletop template
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab21
      cat > skill-matrix.csv <<'CSV'
      participant,task_1,task_2,task_3,runbook_links
      CSV
      cat tabletop.md
    expect: >-
      Score each task 0 (not yet trained), 1 (can do it with help) or 2 (independent with an available runbook). A lone 2 in a column is a knowledge dependency.
  - name: Fill in the matrix and run the 15-minute tabletop with a hard stop
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab21
      ${EDITOR:-nano} skill-matrix.csv
      date; timeout 15m bash -c 'read -r -p "Tabletop running - press Enter to end early "' ; date
      ${EDITOR:-nano} tabletop.md
  - name: Check that every field has an answer
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab21
      grep -n ':$' tabletop.md || echo 'all fields answered'
      cat skill-matrix.csv
    expect: >-
      No empty fields. The improvement line reads: Owner will add/test X by DATE; completion evidence Y.
setup:
  - name: Create the tabletop template
    command: |
      mkdir -p "$HOME/labs/lab21"
      cat > "$HOME/labs/lab21/tabletop.md" <<'MARKDOWN'
      # Chaos Lab 21 tabletop

      Scenario:
      Responder / facilitator / scribe / stop authority:
      Detection evidence and first reversible action:
      Missing access, evidence, or handoff:
      Improvement owner, due date, and completion evidence:
      MARKDOWN
verify:
  - name: Verify tabletop template availability
    command: test -s "$HOME/labs/lab21/tabletop.md"
reset: []
