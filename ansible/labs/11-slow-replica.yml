title: "Lab 11 — Health depends on what you test"
concept: >-
  A timeout is the caller’s waiting budget. A running server can respond too late for a
  caller and still remain alive. If injected latency exceeds the ping budget, peer requests
  can time out without the target process stopping.
mechanism: >-
  Readiness is only as informative as its configured probe. Here Kubernetes checks whether
  it can establish a TCP connection to the proxy; peer pings need an application response
  within 300 ms. The connection can succeed while the response arrives too late. Comparing
  the two checks exposes different definitions of health.
task:
  question: >-
    Why can the same Pod be Ready while peers report it as unhealthy?
  brief:
    theory_source: >-
      chaos-theory.md: §10.4.4 and Experiment Card 10.2. The timeout and readiness criteria
      are specific to this fixture.
    theory:
      - >-
        A timeout is the caller’s waiting budget. A running server can respond too late
        for a caller and still remain alive. If injected latency exceeds the ping budget,
        peer requests can time out without the target process stopping.
      - >-
        Readiness is only as informative as its configured probe. Here Kubernetes checks
        whether it can establish a TCP connection to the proxy; peer pings need an application
        response within 300 ms. The connection can succeed while the response arrives too
        late. Comparing the two checks exposes different definitions of health.
    in_this_lab:
      - >-
        The extra Goldpinger replica receives traffic through Toxiproxy. Peer pings use
        300 ms; readiness checks the proxy’s TCP listener.
  predict: >-
    With a 400 ms delay and a 300 ms ping budget, predict the peer result and TCP readiness
    result separately.
  steps:
    - >-
      Create the proxy listener and confirm healthy peer pings and Pod readiness.
    - >-
      Add 400 ms latency; compare fresh peer reports with the Pod’s Ready state.
    - >-
      Remove the delay, confirm pings recover, then delete the extra Pod and stop the port-forward.
  answer_with: >-
    Compare peer pings and readiness before, during and after delay. Explain the different
    operation each check measures.
solution: >-
  At 400 ms of added latency, a peer with a 300 ms budget should report failure. TCP readiness
  can remain successful because establishing the connection does not require the delayed
  application response. Removing the delay should restore peer success without restarting
  the Pod. If the baseline or recovery fails, resolve that before attributing the disagreement
  solely to the dose.
verify_note: >-
  The toxic is removed and the original three replicas are Ready.
commands:
  - name: Connect the prepared proxy and establish the no-delay baseline
    where: VM terminal 1
    run: !unsafe |
      source ~/labs/lab10/connect-proxy.sh
      pings
      k get pod goldpinger-slow
    expect: >-
      The extra replica is Ready and peer reports for its IP show OK true. Establish this
      baseline before adding delay.
  - name: Add 400 ms and compare peer pings with readiness
    where: VM terminal 1
    run: !unsafe |
      curl -fsS --max-time 5 -H 'Content-Type: application/json' -X POST "$T/proxies/slow/toxics" -d '{"name":"lat","type":"latency","stream":"upstream","toxicity":1,"attributes":{"latency":400,"jitter":0}}'
      sleep 8
      pings
      k get pod goldpinger-slow
    expect: >-
      Look for failed peer pings while the Pod remains Ready. The 400 ms delay exceeds the
      300 ms ping budget; readiness only checks TCP connection establishment.
  - name: Remove the fault, verify recovery, delete the pod and stop the port-forward
    where: VM terminal 1, same shell
    run: !unsafe |
      curl -fsS -X DELETE "$T/proxies/slow/toxics/lat"
      curl -fsS "$T/proxies/slow/toxics"; echo
      sleep 8
      pings
      k delete pod goldpinger-slow --wait=true
      kill "$(cat ~/labs/lab10/lab11-port-forward.pid)"; rm -f ~/labs/lab10/lab11-port-forward.pid
      k rollout status deployment/goldpinger --request-timeout=0 --timeout=180s
      k get pods -l app=goldpinger
    expect: >-
      No toxic remains, peer pings recover, and the original three replicas are Ready after
      the extra Pod is deleted.
setup:
  - name: Prepare the proxy-fronted Pod manifest
    command: !unsafe |
      kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs rollout status deployment/goldpinger --timeout=180s
      mkdir -p "$HOME/labs/lab10"
      cat > "$HOME/labs/lab10/slow.yaml" <<'YAML'
      apiVersion: v1
      kind: Pod
      metadata: {name: goldpinger-slow, labels: {app: goldpinger, experiment: lab11}}
      spec:
        serviceAccountName: goldpinger
        containers:
        - name: goldpinger
          image: bloomberg/goldpinger:v3.11.3
          env:
          - {name: HOST, value: '0.0.0.0'}
          - {name: PORT, value: '9090'}
          - {name: CLIENT_PORT_OVERRIDE, value: '8080'}
          - {name: PING_TIMEOUT, value: '300ms'}
          - {name: REFRESH_INTERVAL, value: '2'}
          - {name: NAMESPACE, value: chaos-labs}
          - name: HOSTNAME
            valueFrom: {fieldRef: {fieldPath: metadata.name}}
          - name: POD_IP
            valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports: [{containerPort: 9090}]
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.12.0
          args: ['-host=0.0.0.0']
          ports: [{containerPort: 8474}, {containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}, periodSeconds: 2}
      YAML
  - name: Prepare proxy connection and observation helpers
    command: !unsafe |
      cat > "$HOME/labs/lab10/connect-proxy.sh" <<'SH'
      source ~/labs/common.sh
      k apply -f ~/labs/lab10/slow.yaml
      k wait --for=jsonpath='{.status.phase}'=Running pod/goldpinger-slow --timeout=120s --request-timeout=0 || return 1
      T=http://127.0.0.1:8474
      # READY 1/2 can appear before Toxiproxy listens, which ends a port-forward; retry until the API answers.
      for attempt in $(seq 1 10); do
        k port-forward --request-timeout=0 pod/goldpinger-slow 8474:8474 > ~/labs/lab10/lab11-port-forward.log 2>&1 &
        echo $! > ~/labs/lab10/lab11-port-forward.pid
        for _ in $(seq 1 10); do curl -fs --max-time 2 -o /dev/null "$T/version" && break 2; sleep 1; done
        kill "$(cat ~/labs/lab10/lab11-port-forward.pid)" 2>/dev/null
      done
      curl -fsS --max-time 5 "$T/version" || return 1
      echo
      curl -fsS -H 'Content-Type: application/json' -X POST "$T/proxies" \
        -d '{"name":"slow","listen":"0.0.0.0:8080","upstream":"127.0.0.1:9090","enabled":true}'; echo
      k wait --for=condition=Ready pod/goldpinger-slow --request-timeout=0 --timeout=60s
      NODE_IP=$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' chaos-control-plane)
      SLOW_IP=$(k get pod goldpinger-slow -o jsonpath='{.status.podIP}')
      # Latest background ping result for goldpinger-slow, from 3 Service requests (not necessarily distinct pods; PING_TIMEOUT).
      pings() {
        for _ in 1 2 3; do
          curl -sS --max-time 5 "http://$NODE_IP:30080/check" |
            jq -c --arg ip "$SLOW_IP" '[.podResults[] | select(.PodIP == $ip)][0] | {OK, status: .["status-code"], ms: .["response-time-ms"], error}'
        done
      }
      sleep 10

      SH
verify:
  - name: Verify the Lab 11 base fixture
    command: !unsafe |
      kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs rollout status deployment/goldpinger --timeout=30s
      test -s "$HOME/labs/lab10/connect-proxy.sh"
reset:
  - name: Delete only the slow replica and recorded port-forward
    command: !unsafe |
      pid_file="$HOME/labs/lab10/lab11-port-forward.pid"
      if [[ -f "$pid_file" ]] && [[ "$(cat "$pid_file")" =~ ^[0-9]+$ ]]; then kill "$(cat "$pid_file")" 2>/dev/null || true; fi
      rm -f "$pid_file"
      kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs delete pod goldpinger-slow --ignore-not-found --wait=true || true
