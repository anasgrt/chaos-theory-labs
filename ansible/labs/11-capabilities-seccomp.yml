title: 'Lab 11 — Capabilities and seccomp controls'
concept: >-
  Linux capabilities divide privileged authority into named permissions, such as permission to change a process's filesystem root. Seccomp instead filters the system calls a process attempts. An operation may therefore fail because authorization is missing or because a filter rejects the call. Neither control grants permission denied by another layer; several checks can apply to the same operation.
mechanism: >-
  Dropping SYS_CHROOT removes the permission needed by the demonstrated chroot operation. The separate C program installs a seccomp filter after startup and makes one selected syscall return an error number. The filter applies to that process and is inherited by its descendants, without changing the whole host. Installing it after startup avoids confusing loader failures with the intended syscall test.
solution: 'Run the capability comparisons and compile/filter.c sequence in Lab 11; the process exit removes the seccomp filter automatically.'
verify_note: 'libseccomp headers are installed and the Lab 11 workspace is writable.'
commands:
  - name: Remove one capability
    where: VM terminal 1
    run: !unsafe |
      docker run --rm ubuntu:24.04 chroot / true; echo "default exit=$?"
      docker run --rm --cap-drop SYS_CHROOT ubuntu:24.04 chroot / true; echo "no SYS_CHROOT exit=$?"
      docker run --rm --cap-drop ALL ubuntu:24.04 sh -c 'grep CapEff /proc/self/status'
    expect: >-
      The first exits 0; the second prints "chroot: cannot change root directory to '/': Operation not permitted"; CapEff is 0000000000000000.
  - name: Write, compile and run the post-startup seccomp filter
    where: VM terminal 1
    run: !unsafe |
      mkdir -p ~/labs/lab11 && cd ~/labs/lab11
      cat > filter.c <<'C'
      #include <seccomp.h>
      #include <unistd.h>
      #include <sys/syscall.h>
      #include <errno.h>
      #include <stdio.h>
      int main(void) {
          scmp_filter_ctx ctx = seccomp_init(SCMP_ACT_ALLOW);
          if (!ctx) return 1;
          if (seccomp_rule_add(ctx, SCMP_ACT_ERRNO(EACCES), SCMP_SYS(getpid), 0) < 0)
              return 2;
          if (seccomp_load(ctx) < 0) return 3;
          seccomp_release(ctx);
          errno = 0;
          long r = syscall(SYS_getpid);
          printf("getpid result=%ld errno=%d\n", r, errno);
          return (r == -1 && errno == EACCES) ? 0 : 4;
      }
      C
      cc -Wall -Wextra filter.c -lseccomp -o filter
      ./filter; echo "exit=$?"
    expect: >-
      getpid result=-1 errno=13 and exit=0. Exit 1-3 means filter setup failed; 4 means the filter did not act.
  - name: Show that the filter is gone once the process exits
    where: VM terminal 1
    run: !unsafe |
      grep Seccomp /proc/self/status
      rm -f ~/labs/lab11/filter
    expect: >-
      Seccomp 0 for a fresh process: nothing host-wide changed.
setup:
  - name: Create the Lab 11 workspace
    command: mkdir -p "$HOME/labs/lab11"
verify:
  - name: Verify seccomp build prerequisites
    command: |
      test -f /usr/include/seccomp.h
      docker info >/dev/null
reset:
  - name: Remove only the Lab 11 compiled filter
    command: rm -f "$HOME/labs/lab11/filter"
