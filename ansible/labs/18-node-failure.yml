title: 'Lab 18 — Kubelet loss versus machine loss'
concept: >-
  The kubelet is the node-local agent that reconciles assigned Pods with the container runtime and reports health. Stopping it interrupts supervision and reporting but does not inherently terminate existing containers. Stopping the node removes a much broader part of the execution environment. Kubernetes must infer loss of contact, so failure detection and application recovery are separate events.
mechanism: >-
  Missing heartbeats lead the control plane to mark the node unhealthy or unreachable. NoExecute taints can cause Pods to be evicted after their applicable toleration period; a controller then creates replacements that still need capacity, scheduling and startup. The disconnected node's old processes may continue running. Shortening a toleration changes the eviction wait, not heartbeat detection, and does not guarantee faster end-to-end recovery.
solution: 'After Lab 15, apply the node-web fixture, record node and Pod watches, stop only kubelet, restore it, and optionally compare an entire worker stop.'
verify_note: 'node-web is Ready and its selected worker kubelet is active before an injection.'
commands:
  - name: Find the worker running node-web and inspect its tolerations
    where: VM terminal 1
    run: !unsafe |
      source ~/labs/common.sh
      k rollout status deployment/node-web --request-timeout=0 --timeout=180s
      k get pods -l app=node-web -o wide
      NODE=$(k get pods -l app=node-web -o jsonpath='{.items[0].spec.nodeName}')
      echo "NODE=$NODE"
      k get pods -l app=node-web -o jsonpath='{.items[0].spec.tolerations}'; echo
    expect: >-
      The pod is Ready on chaos-worker (the affinity is only preferred, so it can land on another worker; every later command uses $NODE). The not-ready and unreachable NoExecute tolerations have tolerationSeconds 300.
  - name: Timestamped node watch
    where: VM terminal 2
    run: !unsafe |
      source ~/labs/common.sh
      k get nodes --request-timeout=0 -w | while IFS= read -r line; do printf '%s %s\n' "$(date +%T)" "$line"; done
  - name: Timestamped pod watch
    where: VM terminal 3
    run: !unsafe |
      source ~/labs/common.sh
      k get pods -l app=node-web -o wide --request-timeout=0 -w | while IFS= read -r line; do printf '%s %s\n' "$(date +%T)" "$line"; done
  - name: Stop only kubelet on that worker
    where: VM terminal 1, same shell
    run: !unsafe |
      date --iso-8601=seconds
      docker exec "$NODE" systemctl stop kubelet
      docker exec "$NODE" crictl ps --name web
    expect: >-
      The web container is still Running although kubelet stopped.
  - name: Sample detection, taints and eviction (repeat every minute; stop after eight minutes without a replacement)
    where: VM terminal 1, same shell
    run: !unsafe |
      date --iso-8601=seconds
      k get node "$NODE"
      k get node "$NODE" -o jsonpath='{.spec.taints}'; echo
      k get pods -l app=node-web -o wide
      docker exec "$NODE" crictl ps --name web
    expect: >-
      After the node-monitor grace period (40-50 s depending on Kubernetes version) the node turns NotReady with node.kubernetes.io/unreachable taints. About 300 s after that the old pod goes Terminating and a replacement starts on another worker, while crictl still shows the old container running.
  - name: Restore kubelet before any other fault
    where: VM terminal 1, same shell
    run: !unsafe |
      docker exec "$NODE" systemctl start kubelet
      k wait --for=condition=Ready "node/$NODE" --request-timeout=0 --timeout=180s
      k rollout status deployment/node-web --request-timeout=0 --timeout=180s
      k get nodes
      k get pods -l app=node-web -o wide
    expect: >-
      All four nodes Ready and one Ready node-web pod. Stop the watches with Ctrl-C.
setup:
  - name: Create the guide's node-web workload preferring chaos-worker
    command: |
      mkdir -p "$HOME/labs/lab15"
      cat > "$HOME/labs/lab15/node-web.yaml" <<'YAML'
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: node-web}
      spec:
        replicas: 1
        selector: {matchLabels: {app: node-web}}
        template:
          metadata: {labels: {app: node-web}}
          spec:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                    - {key: kubernetes.io/hostname, operator: In, values: [chaos-worker]}
            containers:
            - name: web
              image: nginx:1.27
              readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 2}
      YAML
      k() { kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs "$@"; }
      k apply -f "$HOME/labs/lab15/node-web.yaml"
      k rollout status deployment/node-web --timeout=180s
verify:
  - name: Verify a ready node-web baseline
    command: |
      k() { kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs "$@"; }
      test "$(k get pods -l app=node-web --no-headers | awk '$2 == "1/1" && $3 == "Running" {count++} END {print count+0}')" = 1
      node=$(k get pods -l app=node-web -o jsonpath='{.items[0].spec.nodeName}')
      docker exec "$node" systemctl is-active --quiet kubelet
reset:
  - name: Restore kubelet on dedicated chaos workers and remove node-web
    command: |
      for worker in chaos-worker chaos-worker2 chaos-worker3; do
        docker inspect "$worker" >/dev/null 2>&1 && docker exec "$worker" systemctl start kubelet || true
      done
      kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs delete deployment node-web --ignore-not-found || true
