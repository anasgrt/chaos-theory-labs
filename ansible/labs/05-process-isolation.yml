title: "Lab 05 — A container is several Linux mechanisms"
concept: >-
  chroot changes the root used to resolve filesystem paths. A PID namespace gives processes
  a separate PID view, and a suitable proc mount lets ps display that view. A mount namespace
  separates mount configuration. These mechanisms do not themselves limit CPU or memory.
mechanism: >-
  Cgroups separately account for and limit resource use. A sandbox can see only a few processes
  yet still share the VM's kernel, network and storage. Reading the configured limits and
  observing a throttled busy loop distinguishes resource enforcement from an isolated-looking
  view.
task:
  question: >-
    Why does an isolated process view not tell you how much CPU a sandbox can use?
  brief:
    theory_source: >-
      chaos-theory.md: §§5.2–5.5.2 and §5.7.1.
    theory:
      - >-
        chroot changes the root used to resolve filesystem paths. A PID namespace gives
        processes a separate PID view, and a suitable proc mount lets ps display that view.
        A mount namespace separates mount configuration. These mechanisms do not themselves
        limit CPU or memory.
      - >-
        Cgroups separately account for and limit resource use. A sandbox can see only a
        few processes yet still share the VM's kernel, network and storage. Reading the
        configured limits and observing a throttled busy loop distinguishes resource enforcement
        from an isolated-looking view.
    in_this_lab:
      - >-
        The prepared BusyBox sandbox uses chroot, PID and mount namespaces, and a systemd
        scope with CPU, memory and task limits.
  predict: >-
    Predict which observation shows a separate PID view and which shows enforced CPU limiting.
  steps:
    - >-
      Start the bounded sandbox and record echo $$, ps and ls / inside it.
    - >-
      From the VM, inspect its PID namespace and cpu.max, memory.max and pids.max.
    - >-
      Run the busy loop; read cpu.stat twice and observe CPU usage from the VM.
    - >-
      Stop the loop and exit. Match the filesystem view, PID view and throttling to their
      mechanisms.
  answer_with: >-
    Use the PID view and increasing throttling counters to explain the separate roles of
    namespaces and cgroups.
solution: >-
  The prepared root explains the files under /. The PID namespace explains the different
  process view. The cgroup explains the CPU cap and throttling. None of these creates a
  separate kernel or automatically isolates every shared resource.
verify_note: >-
  The sandbox is exited and its scope is no longer active.
commands:
  - name: Confirm the exported BusyBox root filesystem
    where: VM terminal 1
    run: !unsafe |
      ls ~/labs/lab05/rootfs
  - name: Start the sandbox under a resource-limited systemd scope (this shell becomes the
      sandbox)
    where: VM terminal 1
    run: !unsafe |
      sudo systemd-run --unit=ce-lab05 --scope --collect \
        -p MemoryMax=128M -p MemorySwapMax=0 -p TasksMax=50 -p CPUQuota=20% \
        unshare --fork --pid --mount --mount-proc="$HOME/labs/lab05/rootfs/proc" \
        chroot "$HOME/labs/lab05/rootfs" /bin/sh
  - name: Inspect the view inside the sandbox
    where: Sandbox shell (terminal 1)
    run: !unsafe |
      echo $$
      ps
      ls /
    expect: >-
      $$ is 1, ps lists only the sandbox processes, and / is the BusyBox tree.
  - name: Read the limits and PID namespaces from the host
    where: VM terminal 2
    run: !unsafe |
      path=$(systemctl show ce-lab05.scope -p ControlGroup --value)
      sudo cat "/sys/fs/cgroup$path/cpu.max" "/sys/fs/cgroup$path/memory.max" "/sys/fs/cgroup$path/pids.max"
      sudo lsns -t pid
    expect: >-
      cpu.max 20000 100000, memory.max 134217728, pids.max 50; lsns shows a separate PID
      namespace whose command is sh.
  - name: Burn CPU inside the sandbox
    where: Sandbox shell (terminal 1)
    run: !unsafe |
      while :; do :; done
  - name: Observe enforcement from the host while the loop runs
    where: VM terminal 2
    run: !unsafe |
      path=$(systemctl show ce-lab05.scope -p ControlGroup --value)
      sudo cat "/sys/fs/cgroup$path/cpu.stat"
      sleep 5
      sudo cat "/sys/fs/cgroup$path/cpu.stat"
      top -b -n 2 -d 2 | awk '/^top -/ {frame++} frame == 2' | head -15
    expect: >-
      nr_throttled and throttled_usec increase; top shows sh near 20 percent CPU.
  - name: Stop the loop with Ctrl-C, then leave the sandbox
    where: Sandbox shell (terminal 1)
    run: !unsafe |
      exit
  - name: Fallback if the sandbox shell is unresponsive
    where: VM terminal 2
    run: !unsafe |
      sudo systemctl stop ce-lab05.scope
      sudo systemctl reset-failed ce-lab05.scope 2>/dev/null || true
setup:
  - name: Export the BusyBox root filesystem
    command: !unsafe |
      rootfs="$HOME/labs/lab05/rootfs"
      rm -rf "$rootfs"
      mkdir -p "$rootfs"
      container=$(docker create busybox:1.36)
      trap 'docker rm "$container" >/dev/null 2>&1 || true' EXIT
      docker export "$container" | tar -x -C "$rootfs"
      docker rm "$container" >/dev/null
      trap - EXIT
verify:
  - name: Verify namespace fixture readiness
    command: !unsafe |
      test -x "$HOME/labs/lab05/rootfs/bin/sh"
      ! systemctl is-active --quiet ce-lab05.scope
reset:
  - name: Stop and remove the Lab 05 sandbox
    command: !unsafe |
      sudo systemctl stop ce-lab05.scope 2>/dev/null || true
      sudo systemctl reset-failed ce-lab05.scope 2>/dev/null || true
      rm -rf "$HOME/labs/lab05/rootfs"
