title: "Lab 10 — Replacing a Pod is not the same as uninterrupted service"
concept: >-
  A Deployment maintains a desired number of replicas through a ReplicaSet. Deleting a managed
  Pod does not change that desired count, so a new Pod is created and started. It is a replacement
  object, not the old Pod returning.
mechanism: >-
  A Service provides access while backends change. Remaining replicas may serve during replacement,
  but readiness and endpoint updates are asynchronous. Running does not mean Ready, and
  a TCP readiness check does not prove every HTTP request succeeds. Observe the replacement
  and the client responses separately.
task:
  question: >-
    What is the difference between replacing a deleted Pod and keeping requests successful?
  brief:
    theory_source: >-
      chaos-theory.md: §10.4, Experiment Card 10.1 and §§12.1.1–12.1.4.
    theory:
      - >-
        A Deployment maintains a desired number of replicas through a ReplicaSet. Deleting
        a managed Pod does not change that desired count, so a new Pod is created and started.
        It is a replacement object, not the old Pod returning.
      - >-
        A Service provides access while backends change. Remaining replicas may serve during
        replacement, but readiness and endpoint updates are asynchronous. Running does not
        mean Ready, and a TCP readiness check does not prove every HTTP request succeeds.
        Observe the replacement and the client responses separately.
    in_this_lab:
      - >-
        The chaos cluster has three Goldpinger replicas. The readiness probe checks TCP
        8080; HTTP probes sample /healthz through the Service.
  predict: >-
    Predict the replacement’s identity and the number of failed probes; explain why these
    are separate observations.
  steps:
    - >-
      Confirm three Ready replicas and a working HTTP baseline; save the Pod names.
    - >-
      Start the 100 HTTP probes, then delete exactly one managed Pod.
    - >-
      Wait for three Ready replicas and inspect the replacement and endpoints.
    - >-
      Count non-200 probes and explain whether service continued during replacement.
  answer_with: >-
    Report the replacement identity and non-200 count out of 100 probes. Explain what each
    observation establishes and why zero sampled failures cannot prove uninterrupted service.
solution: >-
  The ReplicaSet creates a replacement because the desired replica count remains three.
  Remaining backends may serve requests during that work, but endpoint changes and in-flight
  requests can still produce failures. A replacement proves reconciliation; the probe results
  measure sampled service availability. Zero failed samples means no failure was observed
  by these probes, not that every possible request succeeded.
verify_note: >-
  Three replicas are Ready and the Service responds.
commands:
  - name: Checkpoint the prepared chaos cluster
    where: VM terminal 1
    run: !unsafe |
      source ~/labs/common.sh
      k get nodes
      k get pods -l app=goldpinger -o wide
      k auth can-i list pods --as=system:serviceaccount:chaos-labs:goldpinger
      k auth can-i delete pods --as=system:serviceaccount:chaos-labs:goldpinger
      NODE_IP=$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' chaos-control-plane)
      curl -fsS --max-time 3 "http://$NODE_IP:30080/healthz"; echo
      k get endpointslices -l kubernetes.io/service-name=goldpinger -o wide
    expect: >-
      Three Ready replicas, matching endpoints and a working /healthz probe. The workload
      may list Pods but may not delete them.
  - name: Start 100 probes about 0.2 s apart (start this right before the deletion)
    where: VM terminal 2
    run: !unsafe |
      source ~/labs/common.sh
      NODE_IP=$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' chaos-control-plane)
      for i in $(seq 1 100); do
        code=$(curl -s --max-time 1 -o /dev/null -w '%{http_code}' "http://$NODE_IP:30080/healthz")
        printf '%s %s\n' "$(date --iso-8601=ns)" "$code"
        sleep 0.2
      done | tee ~/labs/lab10/probes.log
  - name: Delete exactly one managed pod and watch the replacement (Ctrl-C once three pods
      are 1/1 Ready)
    where: VM terminal 1, same shell
    run: !unsafe |
      k get pods -l app=goldpinger -o wide
      victim=$(k get pods -l app=goldpinger -o jsonpath='{.items[0].metadata.name}')
      echo "victim=$victim deleted_at=$(date --iso-8601=ns)"
      k delete pod "$victim" --wait=false
      k get pods -l app=goldpinger --request-timeout=0 -w
  - name: After all 100 probes finish in terminal 2, collect recovery evidence
    where: VM terminal 1, same shell
    run: !unsafe |
      k rollout status deployment/goldpinger --request-timeout=0 --timeout=180s
      k get pods -l app=goldpinger -o custom-columns='NAME:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status,START:.status.startTime,NODE:.spec.nodeName'
      k get pod "$victim" 2>&1 | tail -1
      k get endpointslices -l kubernetes.io/service-name=goldpinger -o wide
      samples=$(wc -l < ~/labs/lab10/probes.log)
      if [ "$samples" -eq 100 ]; then
        echo "non-200 samples: $(grep -vc ' 200$' ~/labs/lab10/probes.log)"
        grep -v ' 200$' ~/labs/lab10/probes.log | head
      else
        echo "Only $samples/100 samples recorded; wait for terminal 2 to finish before counting."
      fi
    expect: >-
      The victim is NotFound, a new pod name replaced it, all READY=True, three endpoints
      and a counted number of non-200 samples (0 or a few, right after the deletion).
setup:
  - name: Create the dedicated multi-node kind cluster
    command: !unsafe |
      for host in registry-1.docker.io auth.docker.io dl.k8s.io; do
        timeout 5s getent ahostsv4 "$host" >/dev/null || {
          echo "Required DNS lookup failed for $host. Docker/kind image registry DNS is unavailable in the VM; restore DNS before Lab 10." >&2
          exit 1
        }
      done
      mkdir -p "$HOME/labs/lab10"
      cat > "$HOME/labs/lab10/kind.yaml" <<'YAML'
      kind: Cluster
      apiVersion: kind.x-k8s.io/v1alpha4
      name: chaos
      nodes:
      - role: control-plane
      - role: worker
        labels: {topology.kubernetes.io/zone: west-1}
      - role: worker
        labels: {topology.kubernetes.io/zone: west-2}
      - role: worker
        labels: {topology.kubernetes.io/zone: east-1}
      YAML
      kind get clusters | grep -Fx chaos >/dev/null || timeout 10m kind create cluster --config "$HOME/labs/lab10/kind.yaml" --kubeconfig "$HOME/labs/chaos.kubeconfig" --wait 180s
      "$HOME/labs/install-kubectl-for-kind.sh" chaos
      "$HOME/labs/load-lab-images-into-kind.sh" chaos \
        bloomberg/goldpinger:v3.11.3 \
        ghcr.io/shopify/toxiproxy:2.12.0 \
        python:3.12-slim \
        nginx:1.27
  - name: Deploy the Goldpinger fixture
    command: !unsafe |
      cat > "$HOME/labs/lab10/goldpinger.yaml" <<'YAML'
      apiVersion: v1
      kind: ServiceAccount
      metadata: {name: goldpinger}
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata: {name: goldpinger}
      rules:
      - apiGroups: ['']
        resources: [pods]
        verbs: [get, list, watch]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: goldpinger}
      subjects: [{kind: ServiceAccount, name: goldpinger, namespace: chaos-labs}]
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: goldpinger}
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: goldpinger}
      spec:
        replicas: 3
        selector: {matchLabels: {app: goldpinger}}
        template:
          metadata: {labels: {app: goldpinger}}
          spec:
            serviceAccountName: goldpinger
            containers:
            - name: goldpinger
              image: bloomberg/goldpinger:v3.11.3
              env:
              - {name: HOST, value: '0.0.0.0'}
              - {name: PORT, value: '8080'}
              - {name: CLIENT_PORT_OVERRIDE, value: '8080'}
              - {name: PING_TIMEOUT, value: '300ms'}
              - {name: REFRESH_INTERVAL, value: '2'}
              - {name: NAMESPACE, value: chaos-labs}
              - name: HOSTNAME
                valueFrom: {fieldRef: {fieldPath: metadata.name}}
              - name: POD_IP
                valueFrom: {fieldRef: {fieldPath: status.podIP}}
              ports: [{name: http, containerPort: 8080}]
              readinessProbe: {tcpSocket: {port: http}, periodSeconds: 2}
              resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
      ---
      apiVersion: v1
      kind: Service
      metadata: {name: goldpinger}
      spec:
        type: NodePort
        selector: {app: goldpinger}
        ports: [{name: http, port: 8080, targetPort: 8080, nodePort: 30080}]
      YAML
      k() { kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs --request-timeout=10s "$@"; }
      k create namespace chaos-labs --dry-run=client -o yaml | k apply -f -
      k apply -f "$HOME/labs/lab10/goldpinger.yaml"
      k rollout status deployment/goldpinger --request-timeout=0 --timeout=180s
verify:
  - name: Verify pod-recovery baseline
    command: !unsafe |
      k() { kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs --request-timeout=10s "$@"; }
      test "$(k get pods -l app=goldpinger --no-headers | awk '$2 == "1/1" && $3 == "Running" {count++} END {print count+0}')" = 3
      k auth can-i list pods --as=system:serviceaccount:chaos-labs:goldpinger | grep -qx yes
      # can-i exits 1 for a "no" answer, so compare its output instead of the pipeline status.
      delete_answer=$(k auth can-i delete pods --as=system:serviceaccount:chaos-labs:goldpinger || true)
      test "$delete_answer" = no
reset:
  - name: Remove only Lab 10 namespace resources and preserve the shared cluster
    command: !unsafe |
      if kind get clusters | grep -Fx chaos >/dev/null; then
        kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos delete namespace chaos-labs --ignore-not-found --wait=true --timeout=180s || true
      fi
