title: 'Lab 15 — Retries under a short slowdown'
concept: >-
  A user intent is one desired operation; an attempt is one execution of it. Retries can improve success during brief failures, but retries at several layers multiply demand. For example, up to two client attempts and two proxy attempts per client attempt can produce four backend attempts. Actual amplification depends on which failures trigger retries and whether earlier attempts succeed.
mechanism: >-
  When a timeout expires, the caller may retry while the previous backend request is still executing or queued. Slow work occupies limited worker slots longer, which increases waiting, triggers more timeouts and adds further attempts. This feedback can outlast the original slowdown; persistent failure under continued load is metastability. The lab compares bounded runs so amplification and recovery can be measured rather than assumed.
task:
  question: >-
    During a 5-second backend slowdown, how many backend requests does each of 80 user requests create when both the client and NGINX retry? Does disabling client retries reduce that load, and what does it cost in successful requests?
  brief:
    theory:
      - >-
        Emergent properties (Ch. 1 §1.2.3): behaviour of the whole that no part possesses. In the book's DNS example every service retries DNS errors up to 10 times and users are told to retry too; the DNS server restarts into traffic amplified by the layers of retries, fails again and loops — no component has the property "creates infinite downtime", the system does.
      - >-
        Retry storm and metastable failure (Ch. 1 §1.2.3 supplementary, cheat sheet §13): retries at several layers overwhelm a recovering dependency so it never recovers. A metastable failure is one that persists after the original trigger is gone, because recovery itself generates the load that keeps it down.
      - >-
        Retries buy availability and spend throughput (Card 6.2): System X retried every failed write, kept 0 failed requests and roughly halved throughput. Retry-on-failure is a throughput amplifier under a degraded dependency — the DNS retry-storm shape at a smaller scale.
      - >-
        Retries hide failures (Ch. 2 §2.2, §2.4): a load balancer that retransmits a failed request to another instance keeps the internal failure invisible to users, and max_fails ejects a backend after a single error. That retry is useful until every backend is slow at once, when there is nothing healthy left to retry onto.
      - >-
        Time-out ordering (Ch. 12 §12.1.4, ingress experiment 2): "Does your proxy have the same time-out as the service it proxies to? If you time out quicker, not only can you have outstanding requests being processed long after the proxy dropped the connection, but the consequent retries might accumulate and take down the target service." Check time-outs along the whole path: client → ingress → service → database.
      - >-
        Counting amplification (lab guide, not the book): backend requests per user intent can reach client attempts × proxy attempts per client attempt. The real figure depends on which failures trigger each layer's retry, and metastability is proven only if failures continue after the slowdown is removed.
    in_this_lab:
      - >-
        NGINX on 127.0.0.1:8090 balances upstreams 9001 and 9002 with proxy_read_timeout 500ms, proxy_next_upstream error timeout and proxy_next_upstream_tries 2: a timed-out attempt is retried once on the other upstream. max_fails=0 means an upstream is never marked down.
      - >-
        Each upstream serves at most 4 requests at once; others wait up to 10 s for a slot. Work time comes from delay.txt (0.2 s normally, 1 s during the slowdown, capped at 2 s). A request NGINX abandoned keeps its slot until its work finishes.
      - >-
        client.py sends 80 intents, one every 0.25 s, through 8 worker threads, each attempt with a 2 s timeout. When both NGINX attempts time out, the client receives 504 after about 1 s; client.py treats that, a timeout or a connection error as a failed attempt. client.py 1 allows one retry after 0.2 s (up to 2 attempts); client.py 0 allows none. Worst case per intent: 2 x 2 = 4 backend arrivals.
      - >-
        Upstream counters are cumulative per process and printed every second. Subtract the pre-test arrivals (including the checkpoint curl) before dividing by 80.
  predict: >-
    Amplification (backend arrivals / 80) and the number of successful intents with one client retry and with zero.
  steps:
    - >-
      Start upstreams on ports 9001 and 9002 (4 slots each); confirm the NGINX proxy on 8090 answers and record pre-test arrivals.
    - >-
      Run client.py 1 (80 intents); from VM terminal 2, 5 s later set delay.txt to 1 for 5 s.
    - >-
      After the work drains, compute (arrivals - pre-test) / 80 and count client outcomes.
    - >-
      Restart both upstreams to reset counters and repeat with client.py 0.
    - >-
      Stop the upstreams by PID and remove the ce-lab15 NGINX config.
  answer_with: >-
    Amplification and outcome counts for both runs. Name which layer retried (NGINX proxy_next_upstream, the client, or both) and state whether failures continued after the slowdown ended.
solution: 'Use Lab 15 to create the two upstreams and proxy, apply the same five-second delay with one then zero client retries, and calculate arrivals divided by 80 intents.'
verify_note: 'Ports 8090 and 9001–9002 are free before setup and the NGINX configuration is removed on reset.'
commands:
  - name: Save the concurrency-limited upstream and the finite client
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab15
      cat > upstream.py <<'PY'
      import sys, time, threading
      from pathlib import Path
      from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
      port=int(sys.argv[1]); shed=len(sys.argv)>2 and sys.argv[2]=='shed'
      slots=threading.BoundedSemaphore(4)
      lock=threading.Lock(); counts={'arrived':0,'done':0,'shed':0}
      class H(BaseHTTPRequestHandler):
          def do_GET(self):
              with lock: counts['arrived']+=1
              acquired=slots.acquire(timeout=0.2 if shed else 10)
              if not acquired:
                  with lock: counts['shed']+=1
                  self.send_response(503); self.end_headers(); return
              try:
                  try: delay=float(Path('delay.txt').read_text())
                  except (ValueError,FileNotFoundError): delay=0.2
                  time.sleep(min(max(delay,0),2))
                  with lock: counts['done']+=1
                  self.send_response(200); self.end_headers()
                  try: self.wfile.write(b'ok\n')
                  except (BrokenPipeError,ConnectionResetError): pass
              finally: slots.release()
          def log_message(self,*args): pass
      def report():
          while True:
              time.sleep(1)
              with lock: sample=counts.copy()
              print(time.time(),port,sample,flush=True)
      threading.Thread(target=report,daemon=True).start()
      ThreadingHTTPServer(('127.0.0.1',port),H).serve_forever()
      PY
      cat > client.py <<'PY'
      import sys,time,urllib.request,urllib.error
      from concurrent.futures import ThreadPoolExecutor
      retries=int(sys.argv[1]) if len(sys.argv)>1 else 1
      def request(i):
          begin=time.monotonic(); outcome='failed'
          for attempt in range(retries+1):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8090/',timeout=2) as r:
                      if r.status==200: outcome='200'; break
              except (urllib.error.URLError,TimeoutError,OSError): pass
              if attempt<retries: time.sleep(0.2)
          print(i,outcome,attempt+1,round(time.monotonic()-begin,3),flush=True)
      with ThreadPoolExecutor(max_workers=8) as pool:
          futures=[]
          for i in range(80):
              futures.append(pool.submit(request,i))
              time.sleep(0.25)
          for f in futures: f.result()
      PY
  - name: Start both upstreams, pass the checkpoint, record pre-test arrivals
    where: VM terminal 1, same shell
    run: !unsafe |
      cd ~/labs/lab15
      echo 0.2 > delay.txt
      python3 upstream.py 9001 > upstream1.log 2>&1 & first=$!
      python3 upstream.py 9002 > upstream2.log 2>&1 & second=$!
      sleep 1
      curl -fsS --max-time 2 http://127.0.0.1:8090/
      arrived() { tail -n1 "$1" | sed -E "s/.*'arrived': ([0-9]+).*/\1/"; }
      sleep 2
      pre=$(( $(arrived upstream1.log) + $(arrived upstream2.log) ))
      echo "pre-test arrivals=$pre"
    expect: >-
      ok from the proxy and pre-test arrivals=1 (the checkpoint curl).
  - name: Run 80 intents with one client retry
    where: VM terminal 1, same shell
    run: !unsafe |
      python3 client.py 1 | tee client-retries.log
  - name: Start right after the client, a five-second slowdown after five seconds
    where: VM terminal 2
    run: !unsafe |
      cd ~/labs/lab15
      sleep 5; echo 1 > delay.txt; sleep 5; echo 0.2 > delay.txt
  - name: Let backend work drain, then calculate amplification and outcomes
    where: VM terminal 1, same shell
    run: !unsafe |
      sleep 5
      total=$(( $(arrived upstream1.log) + $(arrived upstream2.log) - pre ))
      echo "backend arrivals=$total amplification=$(echo "scale=2; $total/80" | bc)"
      awk '{outcome[$2]++; attempts+=$3} END {for (o in outcome) print "outcome", o, outcome[o]; print "client attempts", attempts}' client-retries.log
      tail -n1 upstream1.log upstream2.log
    expect: >-
      Amplification is typically above 1.0: proxy retries (up to 2 per client attempt) plus client retries multiply backend arrivals during the slowdown.
  - name: Reset counters by restarting the exact upstream PIDs, then repeat with zero client retries
    where: VM terminal 1, same shell
    run: !unsafe |
      kill "$first" "$second"; wait "$first" "$second" 2>/dev/null
      echo 0.2 > delay.txt
      python3 upstream.py 9001 > upstream1.log 2>&1 & first=$!
      python3 upstream.py 9002 > upstream2.log 2>&1 & second=$!
      sleep 1
      curl -fsS --max-time 2 http://127.0.0.1:8090/
      sleep 2
      pre=$(( $(arrived upstream1.log) + $(arrived upstream2.log) ))
      python3 client.py 0 | tee client-no-retries.log
  - name: Same slowdown for the zero-retry run (start right after that client)
    where: VM terminal 2
    run: !unsafe |
      cd ~/labs/lab15
      sleep 5; echo 1 > delay.txt; sleep 5; echo 0.2 > delay.txt
  - name: Compare the zero-retry run
    where: VM terminal 1, same shell
    run: !unsafe |
      sleep 5
      total=$(( $(arrived upstream1.log) + $(arrived upstream2.log) - pre ))
      echo "backend arrivals=$total amplification=$(echo "scale=2; $total/80" | bc)"
      awk '{outcome[$2]++; attempts+=$3} END {for (o in outcome) print "outcome", o, outcome[o]; print "client attempts", attempts}' client-no-retries.log
  - name: Clean up
    where: VM terminal 1, same shell
    run: !unsafe |
      echo 0.2 > delay.txt
      kill "$first" "$second"; wait "$first" "$second" 2>/dev/null || true
      sudo rm -f /etc/nginx/conf.d/ce-lab15.conf
      sudo nginx -t && sudo systemctl reload nginx
setup:
  - name: Prepare the retry-lab directory and baseline delay file
    command: |
      mkdir -p "$HOME/labs/lab15"
      printf '0.2\n' > "$HOME/labs/lab15/delay.txt"
  - name: Install the exact Lab 15 NGINX proxy configuration
    command: |
      sudo tee /etc/nginx/conf.d/ce-lab15.conf >/dev/null <<'NGX'
      upstream ce_lab15 { server 127.0.0.1:9001 max_fails=0; server 127.0.0.1:9002 max_fails=0; }
      server {
        listen 127.0.0.1:8090;
        location / {
          proxy_pass http://ce_lab15;
          proxy_connect_timeout 1s;
          proxy_read_timeout 500ms;
          proxy_next_upstream error timeout;
          proxy_next_upstream_tries 2;
        }
      }
      NGX
      sudo nginx -t
      sudo systemctl restart nginx
verify:
  - name: Verify retry-lab static prerequisites
    command: |
      test -f "$HOME/labs/lab15/delay.txt"
      sudo nginx -t
reset:
  - name: Restore delay and remove only the Lab 15 proxy configuration
    command: |
      if [[ -d "$HOME/labs/lab15" ]]; then printf '0.2\n' > "$HOME/labs/lab15/delay.txt"; fi
      sudo rm -f /etc/nginx/conf.d/ce-lab15.conf
      sudo nginx -t && sudo systemctl stop nginx || true
