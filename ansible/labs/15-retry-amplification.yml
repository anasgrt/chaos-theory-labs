title: "Lab 15 — Retries can multiply work"
concept: >-
  One user request can cause several attempts. If the client retries and NGINX retries each
  client attempt, their limits multiply: two attempts at each layer allow up to four backend
  arrivals. Actual amplification depends on which attempts fail or succeed.
mechanism: >-
  A caller timing out does not necessarily cancel work already running downstream. Slow
  requests hold worker slots while retries add more work. Retrying may recover an operation
  or worsen contention. Compare backend arrivals per original request with successful user
  outcomes, using the same load and slowdown in both runs.
task:
  question: >-
    How do retries change backend work per original request during the same slowdown?
  brief:
    theory_source: >-
      chaos-theory.md: §1.2.3 (retry amplification) and §1.5 (dependency failures).
    theory:
      - >-
        One user request can cause several attempts. If the client retries and NGINX retries
        each client attempt, their limits multiply: two attempts at each layer allow up
        to four backend arrivals. Actual amplification depends on which attempts fail or
        succeed.
      - >-
        A caller timing out does not necessarily cancel work already running downstream.
        Slow requests hold worker slots while retries add more work. Retrying may recover
        an operation or worsen contention. Compare backend arrivals per original request
        with successful user outcomes, using the same load and slowdown in both runs.
    in_this_lab:
      - >-
        Each case starts fresh upstreams and runs 80 requests. Five seconds after load starts,
        response delay rises from 0.2 to 1 second for five seconds. NGINX permits two upstream
        attempts per client attempt with a 0.5-second read timeout. Only the client retry
        setting changes. The runner prints measurements and cleans up its processes.
  predict: >-
    Predict backend arrivals per request and user successes with one client retry versus
    none.
  steps:
    - >-
      Run the prepared case with one client retry; record amplification and successes out
      of 80.
    - >-
      Run it again with zero client retries and compare the same measurements.
    - >-
      Confirm normal delay and remove the proxy configuration. Explain the extra work without
      assuming retries must improve success.
  answer_with: >-
    Compare arrivals / 80 and successful requests / 80 for both settings. Explain why the
    retry limits bound attempts but do not guarantee a particular success rate.
solution: >-
  Removing client retries removes one source of extra work; proxy retries can still amplify
  requests. Compare both runs using arrivals per original request and successes out of 80.
  The retry limits give an upper bound, not a guaranteed multiplier. Continued failures
  after the delay ends can indicate backlog; this short run alone does not prove a self-sustaining
  failure.
verify_note: >-
  Normal delay is restored, upstream processes are stopped and the lab proxy config is removed.
commands:
  - name: Run with one client retry
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab15
      bash run-case.sh 1
    expect: >-
      The runner checks the baseline, runs 80 original requests with the timed slowdown,
      prints arrivals and successes, then stops its upstreams.
  - name: Repeat with no client retry
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab15
      bash run-case.sh 0
    expect: >-
      Compare amplification and successes with the first run. Proxy retries remain enabled,
      so zero client retries does not imply one backend arrival per original request.
  - name: Confirm the delay is normal and remove the lab proxy
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab15
      cat delay.txt
      sudo rm -f /etc/nginx/conf.d/ce-lab15.conf
      sudo nginx -t && sudo systemctl reload nginx
    expect: >-
      delay.txt is 0.2. Each completed runner stops its own upstreams; the proxy configuration
      is now removed.
setup:
  - name: Prepare the retry-lab directory and baseline delay file
    command: !unsafe |
      mkdir -p "$HOME/labs/lab15"
      printf '0.2\n' > "$HOME/labs/lab15/delay.txt"
  - name: Install the exact Lab 15 NGINX proxy configuration
    command: !unsafe |
      sudo tee /etc/nginx/conf.d/ce-lab15.conf >/dev/null <<'NGX'
      upstream ce_lab15 { server 127.0.0.1:9001 max_fails=0; server 127.0.0.1:9002 max_fails=0; }
      server {
        listen 127.0.0.1:8090;
        location / {
          proxy_pass http://ce_lab15;
          proxy_connect_timeout 1s;
          proxy_read_timeout 500ms;
          proxy_next_upstream error timeout;
          proxy_next_upstream_tries 2;
        }
      }
      NGX
      sudo nginx -t
      sudo systemctl restart nginx
  - name: Prepare the upstream and client programs
    command: !unsafe |
      cd ~/labs/lab15
      cat > upstream.py <<'PY'
      import sys, time, threading
      from pathlib import Path
      from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
      port=int(sys.argv[1]); shed=len(sys.argv)>2 and sys.argv[2]=='shed'
      slots=threading.BoundedSemaphore(4)
      lock=threading.Lock(); counts={'arrived':0,'done':0,'shed':0}
      class H(BaseHTTPRequestHandler):
          def do_GET(self):
              with lock: counts['arrived']+=1
              acquired=slots.acquire(timeout=0.2 if shed else 10)
              if not acquired:
                  with lock: counts['shed']+=1
                  self.send_response(503); self.end_headers(); return
              try:
                  try: delay=float(Path('delay.txt').read_text())
                  except (ValueError,FileNotFoundError): delay=0.2
                  time.sleep(min(max(delay,0),2))
                  with lock: counts['done']+=1
                  self.send_response(200); self.end_headers()
                  try: self.wfile.write(b'ok\n')
                  except (BrokenPipeError,ConnectionResetError): pass
              finally: slots.release()
          def log_message(self,*args): pass
      def report():
          while True:
              time.sleep(1)
              with lock: sample=counts.copy()
              print(time.time(),port,sample,flush=True)
      threading.Thread(target=report,daemon=True).start()
      ThreadingHTTPServer(('127.0.0.1',port),H).serve_forever()
      PY
      cat > client.py <<'PY'
      import sys,time,urllib.request,urllib.error
      from concurrent.futures import ThreadPoolExecutor
      retries=int(sys.argv[1]) if len(sys.argv)>1 else 1
      def request(i):
          begin=time.monotonic(); outcome='failed'
          for attempt in range(retries+1):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8090/',timeout=2) as r:
                      if r.status==200: outcome='200'; break
              except (urllib.error.URLError,TimeoutError,OSError): pass
              if attempt<retries: time.sleep(0.2)
          print(i,outcome,attempt+1,round(time.monotonic()-begin,3),flush=True)
      with ThreadPoolExecutor(max_workers=8) as pool:
          futures=[]
          for i in range(80):
              futures.append(pool.submit(request,i))
              time.sleep(0.25)
          for f in futures: f.result()
      PY
  - name: Prepare the finite retry comparison runner
    command: !unsafe |
      cat > "$HOME/labs/lab15/run-case.sh" <<'SH'
      #!/usr/bin/env bash
      set -euo pipefail
      cd "$HOME/labs/lab15"
      retries=${1:?Use 0 or 1 client retries}
      [[ "$retries" == 0 || "$retries" == 1 ]] || exit 2
      first=''; second=''; slowdown=''
      cleanup() {
        if [[ -n "$slowdown" ]]; then kill "$slowdown" 2>/dev/null || true; wait "$slowdown" 2>/dev/null || true; fi
        echo 0.2 > delay.txt
        for pid in "$first" "$second"; do
          if [[ -n "$pid" ]]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi
        done
      }
      trap cleanup EXIT
      trap 'exit 130' INT TERM
      arrived() {
        python3 - "$1" <<'PYCOUNT'
      import ast, sys
      from pathlib import Path
      samples = [line for line in Path(sys.argv[1]).read_text().splitlines() if "{'arrived':" in line]
      if not samples:
          raise SystemExit('Missing upstream counters; inspect the log.')
      print(ast.literal_eval(samples[-1].split(' ', 2)[2])['arrived'])
      PYCOUNT
      }
      echo 0.2 > delay.txt
      python3 upstream.py 9001 > "upstream1-$retries.log" 2>&1 & first=$!
      python3 upstream.py 9002 > "upstream2-$retries.log" 2>&1 & second=$!
      sleep 2
      kill -0 "$first" "$second"
      curl -fsS --max-time 2 http://127.0.0.1:8090/
      sleep 2
      pre=$(( $(arrived "upstream1-$retries.log") + $(arrived "upstream2-$retries.log") ))
      echo "baseline arrivals=$pre; starting 80 requests with client retries=$retries"
      (sleep 5; echo 1 > delay.txt; sleep 5; echo 0.2 > delay.txt) & slowdown=$!
      python3 client.py "$retries" > "client-$retries.log"
      wait "$slowdown"; slowdown=''
      # Bounded slot waiting is 10 s, service time at most 2 s, reporter interval 1 s.
      sleep 15
      kill -0 "$first" "$second"
      total=$(( $(arrived "upstream1-$retries.log") + $(arrived "upstream2-$retries.log") - pre ))
      awk -v arrivals="$total" -v retries="$retries" '
        $2 == "200" {success++} {attempts += $3}
        END {
          if (NR != 80) {print "Incomplete client sample: " NR "/80"; exit 1}
          printf "client retries=%d original requests=80 client attempts=%d backend arrivals=%d amplification=%.2f successes=%d/80\n", retries, attempts, arrivals, arrivals/80, success
        }' "client-$retries.log"
      SH
verify:
  - name: Verify retry-lab static prerequisites
    command: !unsafe |
      test -f "$HOME/labs/lab15/delay.txt"
      sudo nginx -t
      test -s "$HOME/labs/lab15/upstream.py"
      test -s "$HOME/labs/lab15/client.py"
      test -s "$HOME/labs/lab15/run-case.sh"
reset:
  - name: Restore delay and remove only the Lab 15 proxy configuration
    command: !unsafe |
      if [[ -d "$HOME/labs/lab15" ]]; then printf '0.2\n' > "$HOME/labs/lab15/delay.txt"; fi
      sudo rm -f /etc/nginx/conf.d/ce-lab15.conf
      sudo nginx -t && sudo systemctl stop nginx || true
