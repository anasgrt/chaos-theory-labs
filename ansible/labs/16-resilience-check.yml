title: "Lab 16 — Design one clear experiment"
concept: >-
  A useful chaos experiment starts with a measurable service outcome. Its hypothesis states
  what should happen when one defined fault occurs. A baseline tells you how the service
  behaves without that fault, so the comparison has meaning.
mechanism: >-
  Choose an exact target and a finite duration. Define when to stop, how to remove the fault
  and how to confirm service recovery. The removal path must remain available if the injector
  fails. This exercise is a design on paper: a completed card is a plan, not evidence that
  the system passed.
task:
  question: >-
    How would you test one resilience claim so the result has a clear meaning?
  brief:
    theory_source: >-
      chaos-theory.md: §§1.3, 2.5; Appendix C; Master Cheat Sheet §6.
    theory:
      - >-
        A useful chaos experiment starts with a measurable service outcome. Its hypothesis
        states what should happen when one defined fault occurs. A baseline tells you how
        the service behaves without that fault, so the comparison has meaning.
      - >-
        Choose an exact target and a finite duration. Define when to stop, how to remove
        the fault and how to confirm service recovery. The removal path must remain available
        if the injector fails. This exercise is a design on paper: a completed card is a
        plan, not evidence that the system passed.
    in_this_lab:
      - >-
        Fill the prepared card for one service and one fault. Nothing is deployed or disrupted
        in this lab.
  predict: >-
    State what you expect to measure under one fault and why the service should behave that
    way.
  steps:
    - >-
      Choose one service outcome and write its normal baseline.
    - >-
      Choose one bounded fault and state the expected outcome in measurable terms.
    - >-
      Write the stop condition, rollback and recovery check, including a fallback if the
      normal removal path fails.
    - >-
      Read the card as another operator: can you run and stop the test without guessing?
  answer_with: >-
    Write a card another person can follow: measurable baseline, one fault, expected result,
    stop condition, rollback and recovery evidence. Keep it a plan; do not invent observations.
solution: >-
  A complete experiment connects one controlled fault to one measurable outcome. It also
  states how to stop and restore the service. If the outcome cannot be measured or the fault
  cannot be removed, improve the design before considering a run.
verify_note: >-
  The card answers each field clearly; this is a design review, not a live test.
commands:
  - name: Fill the short experiment card
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab16
      ${EDITOR:-nano} experiment-card.md
  - name: Find unanswered fields
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab16
      grep -nE ':[[:space:]]*$' experiment-card.md
      check_status=$?
      case "$check_status" in
        0) echo 'Fill the fields listed above.' ;;
        1) echo 'No blank fields found; review the answers for clarity.' ;;
        *) echo 'Could not read the card; fix the file error before continuing.' >&2 ;;
      esac
    expect: >-
      No blank fields remain. Read the answers too: this check does not validate their meaning.
optional_explanation: >-
  Optional: review automation failures and staged rollout. Complete the extra questions
  only when turning the paper experiment into an operational check.
optional_commands:
  - name: Record the review of the experiment's own failure modes
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab16
      cat >> experiment-card.md <<'MARKDOWN'

      ## Failure review of the experiment itself
      Selector matches zero objects:
      Selector matches far more objects than expected:
      Injector dies mid-run (how is the active fault removed?):
      API unavailable during rollback (independent fallback):
      Results stop arriving (missing-results alert):
      Staged plan (no-fault control, supervised disposable run, approved pilot):
      MARKDOWN
      ${EDITOR:-nano} experiment-card.md
      grep -nE ':[[:space:]]*$' experiment-card.md
      check_status=$?
      case "$check_status" in
        0) echo 'Fill the fields listed above.' ;;
        1) echo 'No blank fields found; review the answers for clarity.' ;;
        *) echo 'Could not read the card; fix the file error before continuing.' >&2 ;;
      esac
    expect: >-
      A reviewer can name the target, expected result, stop command and recovery probe without
      asking the author.
setup:
  - name: Create the resilience experiment card
    command: !unsafe |
      mkdir -p "$HOME/labs/lab16"
      cat > "$HOME/labs/lab16/experiment-card.md" <<'MARKDOWN'
      # Chaos Lab 16 experiment card

      Service and environment:
      Normal baseline and how to measure it:
      One fault, exact target and maximum duration:
      Expected outcome and measurement threshold:
      Stop condition:
      Rollback and fallback if normal removal fails:
      Recovery check:
      MARKDOWN
verify:
  - name: Verify experiment-card availability
    command: !unsafe |
      test -s "$HOME/labs/lab16/experiment-card.md"
reset: []
