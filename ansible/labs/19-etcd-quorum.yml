title: 'Lab 19 — Etcd quorum loss'
concept: >-
  The control plane stores and reconciles desired cluster state; the data plane carries application requests. etcd protects agreement on stored state using Raft consensus: a leader must obtain a voting majority to commit changes. This prevents separated minorities from independently accepting conflicting writes. Losing management availability therefore need not immediately stop an already-established application traffic path.
mechanism: >-
  Three voting members require two for quorum. After one member stops, the remaining majority can commit writes, with leader election if necessary; after two stop, it cannot. Existing processes and installed routing may continue serving HTTP while API writes fail. Probe both paths because some reads can be cached. Restoring the same members tests regained consensus, rather than backup restoration after permanent data loss.
solution: 'Use the separate ha cluster to record HTTP and ConfigMap-write baselines, stop one then two etcd members with the guide helpers, and restore both manifests before proceeding.'
verify_note: 'The ha cluster has three control-plane nodes, an HTTP workload, and a working ConfigMap write before the fault.'
commands:
  - name: Save the HA cluster helpers
    where: VM terminal 1
    run: !unsafe |
      cat > ~/labs/lab19/helpers.sh <<'SH'
      h() { kubectl --kubeconfig="$HOME/labs/ha.kubeconfig" --context=kind-ha --namespace=default --request-timeout=5s "$@"; }
      stop_etcd() { docker exec "$1" mv /etc/kubernetes/manifests/etcd.yaml /root/ce-etcd.yaml; }
      start_etcd() { docker exec "$1" mv /root/ce-etcd.yaml /etc/kubernetes/manifests/etcd.yaml; }
      ec() {
        local node=$1 container; shift
        container=$(docker exec "$node" crictl ps --name etcd -q)
        [ -n "$container" ] || return 1
        docker exec "$node" crictl exec "$container" etcdctl \
          --endpoints=https://127.0.0.1:2379 --dial-timeout=3s --command-timeout=5s \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key "$@"
      }
      SH
  - name: Establish HTTP and write baselines
    where: VM terminal 1
    run: !unsafe |
      source ~/labs/lab19/helpers.sh
      h get nodes
      h rollout status deployment/quorum-web --request-timeout=0 --timeout=180s
      PORT=$(h get svc quorum-web -o jsonpath='{.spec.ports[0].nodePort}')
      IP=$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' ha-worker)
      curl -fsS --max-time 3 "http://$IP:$PORT/" >/dev/null && echo 'HTTP baseline ok'
      h patch configmap quorum-probe --type merge -p '{"data":{"state":"baseline"}}'
      ec ha-control-plane endpoint status --cluster -w table
    expect: >-
      Four Ready nodes, 2/2 web pods, HTTP ok, "configmap/quorum-probe patched" and a table with three members, one IS LEADER=true.
  - name: Stop one etcd member and probe both paths
    where: VM terminal 1, same shell
    run: !unsafe |
      stop_etcd ha-control-plane2
      sleep 30
      docker exec ha-control-plane2 crictl ps --name etcd
      h patch configmap quorum-probe --type merge -p '{"data":{"state":"one-down"}}'
      curl -sS --max-time 3 -o /dev/null -w '%{http_code}\n' "http://$IP:$PORT/"
    expect: >-
      No etcd container on ha-control-plane2; the write normally succeeds because two of three members keep quorum (a single failure can come from the stopped member's API server before the load balancer drops it, so retry once); HTTP returns 200.
  - name: Stop a second member, probe, then restore both
    where: VM terminal 1, same shell
    run: !unsafe |
      stop_etcd ha-control-plane3
      sleep 30
      h patch configmap quorum-probe --type merge -p '{"data":{"state":"two-down"}}'
      curl -sS --max-time 3 -o /dev/null -w '%{http_code}\n' "http://$IP:$PORT/"
      start_etcd ha-control-plane2
      start_etcd ha-control-plane3
      sleep 30
      for _ in $(seq 1 12); do ec ha-control-plane endpoint health --cluster && break; sleep 5; done
      h patch configmap quorum-probe --type merge -p '{"data":{"state":"recovered"}}'
      h get configmap quorum-probe -o jsonpath='{.data.state}'; echo
    expect: >-
      With two members down, the write fails or times out while HTTP still returns 200. After restore, three healthy endpoints and state=recovered.
  - name: Independent fallback that restores the manifests without kubectl
    where: VM terminal 2
    run: !unsafe |
      for node in ha-control-plane2 ha-control-plane3; do
        docker exec "$node" sh -c 'test -f /root/ce-etcd.yaml && mv /root/ce-etcd.yaml /etc/kubernetes/manifests/etcd.yaml; ls /etc/kubernetes/manifests'
      done
setup:
  - name: Create the separate HA kind cluster
    command: |
      if kind get clusters | grep -Fx chaos >/dev/null; then
        echo 'Delete the chaos cluster before Lab 19 to preserve VM memory.' >&2
        exit 1
      fi
      mkdir -p "$HOME/labs/lab19"
      for host in registry-1.docker.io auth.docker.io dl.k8s.io; do
        timeout 5s getent ahostsv4 "$host" >/dev/null || {
          echo "Required DNS lookup failed for $host. Docker/kind image registry DNS is unavailable in the VM; restore DNS before Lab 19." >&2
          exit 1
        }
      done
      cat > "$HOME/labs/lab19/kind.yaml" <<'YAML'
      kind: Cluster
      apiVersion: kind.x-k8s.io/v1alpha4
      name: ha
      nodes:
      - role: control-plane
      - role: control-plane
      - role: control-plane
      - role: worker
      YAML
      kind get clusters | grep -Fx ha >/dev/null || timeout 10m kind create cluster --config "$HOME/labs/lab19/kind.yaml" --kubeconfig "$HOME/labs/ha.kubeconfig" --wait 180s
      "$HOME/labs/install-kubectl-for-kind.sh" ha
      "$HOME/labs/load-lab-images-into-kind.sh" ha nginx:1.27
      kubectl --kubeconfig="$HOME/labs/ha.kubeconfig" --context=kind-ha create deployment quorum-web --image=nginx:1.27 --replicas=2 --dry-run=client -o yaml | kubectl --kubeconfig="$HOME/labs/ha.kubeconfig" --context=kind-ha apply -f -
      kubectl --kubeconfig="$HOME/labs/ha.kubeconfig" --context=kind-ha rollout status deployment/quorum-web --timeout=180s
      kubectl --kubeconfig="$HOME/labs/ha.kubeconfig" --context=kind-ha expose deployment quorum-web --type=NodePort --port=80 --dry-run=client -o yaml | kubectl --kubeconfig="$HOME/labs/ha.kubeconfig" --context=kind-ha apply -f -
      kubectl --kubeconfig="$HOME/labs/ha.kubeconfig" --context=kind-ha create configmap quorum-probe --from-literal=state=baseline --dry-run=client -o yaml | kubectl --kubeconfig="$HOME/labs/ha.kubeconfig" --context=kind-ha apply -f -
verify:
  - name: Verify HA cluster write baseline
    command: |
      h() { kubectl --kubeconfig="$HOME/labs/ha.kubeconfig" --context=kind-ha --request-timeout=5s "$@"; }
      test "$(h get nodes --no-headers | awk '$2 == "Ready" {count++} END {print count+0}')" = 4
      h patch configmap quorum-probe --type merge -p '{"data":{"state":"verified"}}' >/dev/null
reset:
  - name: Restore any moved etcd manifests
    command: |
      for node in ha-control-plane ha-control-plane2 ha-control-plane3; do
        docker inspect "$node" >/dev/null 2>&1 || continue
        docker exec "$node" sh -c 'test -f /root/ce-etcd.yaml && mv /root/ce-etcd.yaml /etc/kubernetes/manifests/etcd.yaml || true'
      done
