title: "Lab 04 — CPU contention and a quota"
concept: >-
  A CPU-bound job needs execution time, but its elapsed time also includes waiting to be
  scheduled. Two runnable workloads pinned to one CPU compete for that time. A slower iteration
  can therefore come from contention rather than extra work in the application.
mechanism: >-
  A quota limits the competitor's CPU budget per period. After using its budget, that group
  is throttled until the next period. A 20% quota means 20 ms per 100 ms, not a reserved
  core for the other job. Compare job timing with the quota and throttling counters to see
  whether limiting the neighbour helps.
task:
  question: >-
    How does capping a CPU competitor change the time taken by the same job?
  brief:
    theory_source: >-
      chaos-theory.md: §§3.2, 3.3.5 and the CPU-shares correction; §5.5.2.
    theory:
      - >-
        A CPU-bound job needs execution time, but its elapsed time also includes waiting
        to be scheduled. Two runnable workloads pinned to one CPU compete for that time.
        A slower iteration can therefore come from contention rather than extra work in
        the application.
      - >-
        A quota limits the competitor's CPU budget per period. After using its budget, that
        group is throttled until the next period. A 20% quota means 20 ms per 100 ms, not
        a reserved core for the other job. Compare job timing with the quota and throttling
        counters to see whether limiting the neighbour helps.
    in_this_lab:
      - >-
        Both workloads use CPU 0. The neighbour runs in ce-lab04 with a finite runtime.
        Keep the same job and CPU placement in each phase.
  predict: >-
    Rank the job time with no competitor, an unrestricted competitor and a competitor capped
    at 20%. Explain your prediction.
  steps:
    - >-
      Run the job three times without the neighbour to establish normal variation.
    - >-
      Add the bounded neighbour on CPU 0 and rerun the job; observe CPU waiting.
    - >-
      Repeat with CPUQuota=20% on the neighbour; record job time and cpu.stat.
    - >-
      Stop the neighbour and rerun the job. Compare the mean times with baseline.
  answer_with: >-
    Compare the measured job times and quota counters. Explain how throttling the competitor
    changes waiting for CPU; mark a run inconclusive if the competitor stopped too early.
solution: >-
  An unrestricted neighbour competes for CPU time. Capping it should leave more time for
  work.py, though the measured gain depends on scheduling. cpu.max shows the configured
  cap; cpu.stat shows throttling. Recovery toward baseline strengthens the contention explanation.
  A run that outlasts the neighbour mixes contention with recovery and cannot support the
  comparison.
verify_note: >-
  ce-lab04 is stopped and the final job timing is recorded.
commands:
  - name: Choose an allowed CPU
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab04
      taskset -pc $$
      # If CPU 0 is not allowed, replace every -c 0 below with one allowed CPU.
    expect: >-
      The commands below use CPU 0. If CPU 0 is not listed, change every -c 0.
  - name: Record the baseline three times
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab04
      for run in 1 2 3; do taskset -c 0 python3 work.py | tee "baseline-$run.txt"; done
      sort -k2 -n baseline-*.txt | awk 'NR==1 {min=$2} {max=$2} END {print "iteration range:", min, "-", max, "s"}'
  - name: Add one bounded CPU neighbour on the same CPU
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab04
      sudo systemd-run --unit=ce-lab04 --collect -p RuntimeMaxSec=45s \
        taskset -c 0 stress-ng --cpu 1 --timeout 40s
      taskset -c 0 python3 work.py | tee loaded.txt
      systemctl is-active --quiet ce-lab04 || echo 'Inconclusive: the neighbour ended before the measurement finished.'
      cat /proc/pressure/cpu
      vmstat 1 5
      sudo systemctl stop ce-lab04
    expect: >-
      Compare iteration time with baseline. PSI and vmstat provide supporting waiting measurements;
      neither alone proves which task caused the slowdown.
  - name: Cap the neighbour at 20 percent and read throttling counters
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab04
      while systemctl list-units --all --plain --no-legend ce-lab04.service | grep -q .; do sleep 1; done
      sudo systemd-run --unit=ce-lab04 --collect -p CPUQuota=20% -p RuntimeMaxSec=45s \
        taskset -c 0 stress-ng --cpu 1 --timeout 40s
      taskset -c 0 python3 work.py | tee quota.txt
      path=$(systemctl show ce-lab04 -p ControlGroup --value)
      if systemctl is-active --quiet ce-lab04 && [ -n "$path" ]; then
        sudo cat "/sys/fs/cgroup$path/cpu.max" "/sys/fs/cgroup$path/cpu.stat"
      else
        echo 'Inconclusive: the neighbour ended before the measurement finished.'
      fi
      sudo systemctl stop ce-lab04
    expect: >-
      cpu.max should show a quota/period ratio of 0.2, and cpu.stat should show throttling.
      If the neighbour ends before measurement finishes, shorten work.py's iteration count
      and repeat every phase with that same workload.
  - name: Recover and repeat the baseline
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab04
      sudo systemctl stop ce-lab04 2>/dev/null || true
      while systemctl list-units --all --plain --no-legend ce-lab04.service | grep -q .; do sleep 1; done
      taskset -c 0 python3 work.py | tee recovered.txt
      for f in baseline-1.txt baseline-2.txt baseline-3.txt loaded.txt quota.txt recovered.txt; do
        awk -v f="$f" '{s+=$2} END {printf "%-15s mean=%.4fs\n", f, s/NR}' "$f"
      done
optional_explanation: >-
  Optional: compare nice 19 with the quota. Nice is a relative scheduling preference, not
  a CPU ceiling; cgroup scheduling can limit its effect. Run after the core comparison in
  the same VM shell.
optional_commands:
  - name: Contrast relative priority (nice) with the hard quota
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab04
      while systemctl list-units --all --plain --no-legend ce-lab04.service | grep -q .; do sleep 1; done
      sudo systemd-run --unit=ce-lab04 --collect -p RuntimeMaxSec=45s \
        nice -n 19 taskset -c 0 stress-ng --cpu 1 --timeout 40s
      taskset -c 0 python3 work.py | tee nice.txt
      sudo systemctl stop ce-lab04
      awk '{s+=$2} END {printf "nice mean=%.4fs\n", s/NR}' nice.txt
setup:
  - name: Create the finite CPU workload
    command: !unsafe |
      mkdir -p "$HOME/labs/lab04"
      cat > "$HOME/labs/lab04/work.py" <<'PY'
      import time
      for i in range(24):
          start = time.monotonic()
          sum(j * j for j in range(5_000_000))
          print(i, round(time.monotonic() - start, 4), flush=True)
      PY
verify:
  - name: Verify CPU experiment prerequisites
    command: !unsafe |
      taskset -pc $$ >/dev/null
      test -r /proc/pressure/cpu
      ! systemctl is-active --quiet ce-lab04.service
reset:
  - name: Stop the exact CPU transient unit
    command: !unsafe |
      sudo systemctl stop ce-lab04.service 2>/dev/null || true
