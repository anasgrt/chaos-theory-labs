title: 'Lab 22 — Maintainable resilience check'
concept: >-
  A resilience check starts with a user promise, a measurable service-level indicator and a target. Its hypothesis links one defined fault to an acceptable outcome within a specified window. Baseline health, the observation period and minimum samples make that judgement meaningful. An injector completing successfully only proves that its action ran; the service outcome requires separate evidence.
mechanism: >-
  Design the checker as another fallible component: it can select the wrong target, stop midway or lose access to the API needed for rollback. Target-count guards, limited duration and a no-fault control bound and clarify the experiment. An independently reachable recovery path removes active faults even if automation fails. Test both a known breach and missing reporting before relying on an unattended check.
solution: 'Fill the prepared experiment card using Lab 22, review its own failure modes, and schedule a supervised disposable-environment no-fault control before implementation.'
verify_note: 'A reviewer can identify the target, success criterion, abort condition, exact rollback, independent fallback, and recovery probe.'
commands:
  - name: Open the experiment card and fill in every field
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab22
      ${EDITOR:-nano} experiment-card.md
  - name: Find unanswered fields
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab22
      grep -n ':$' experiment-card.md || echo 'all fields answered'
  - name: Record the review of the experiment's own failure modes
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab22
      cat >> experiment-card.md <<'MARKDOWN'

      ## Failure review of the experiment itself
      Selector matches zero objects:
      Selector matches far more objects than expected:
      Injector dies mid-run (how is the active fault removed?):
      API unavailable during rollback (independent fallback):
      Results stop arriving (missing-results alert):
      Staged plan (no-fault control, supervised disposable run, approved pilot):
      MARKDOWN
      ${EDITOR:-nano} experiment-card.md
      grep -n ':$' experiment-card.md || echo 'card complete'
    expect: >-
      A reviewer can name the target, expected result, stop command and recovery probe without asking the author.
setup:
  - name: Create the resilience experiment card
    command: |
      mkdir -p "$HOME/labs/lab22"
      cat > "$HOME/labs/lab22/experiment-card.md" <<'MARKDOWN'
      # Chaos Lab 22 experiment card

      Service / owner / environment:
      User promise and measurement source:
      Baseline window and minimum sample count:
      Hypothesis, threshold, and observation window:
      Injection selector, maximum targets, fault, and duration:
      Preflight target count, health baseline, and capacity check:
      Abort condition and stop authority:
      Exact rollback and independent fallback:
      Recovery probe and recovery-time limit:
      Evidence, reviewer, and next review date:
      MARKDOWN
verify:
  - name: Verify experiment-card availability
    command: test -s "$HOME/labs/lab22/experiment-card.md"
reset: []
