title: "Lab 03 — Restart policies have limits"
concept: >-
  systemd can restart a crashed process, but each start is also subject to a rate limit.
  Enough starts within the configured interval exhaust the allowance and prevent further
  automatic recovery. A single crash can therefore recover while a rapid sequence leaves
  the service failed.
mechanism: >-
  NGINX can continue serving through another usable backend. This can hide one failed instance
  from clients, but it cannot create capacity when both are unavailable. Compare backend
  state with HTTP results: a successful proxy response does not prove every backend recovered.
task:
  question: >-
    Why does one crash recover while a burst of crashes can leave the same service failed?
  brief:
    theory_source: >-
      chaos-theory.md: §§2.4–2.6 and Experiment Cards 2.1–2.2.
    theory:
      - >-
        systemd can restart a crashed process, but each start is also subject to a rate
        limit. Enough starts within the configured interval exhaust the allowance and prevent
        further automatic recovery. A single crash can therefore recover while a rapid sequence
        leaves the service failed.
      - >-
        NGINX can continue serving through another usable backend. This can hide one failed
        instance from clients, but it cannot create capacity when both are unavailable.
        Compare backend state with HTTP results: a successful proxy response does not prove
        every backend recovered.
    in_this_lab:
      - >-
        A and B serve through NGINX. The core experiment targets only A: Restart=always,
        at most four starts per 20 seconds. B stays available during this comparison.
  predict: >-
    Predict A’s state after one kill and after six rapid kill attempts, with Restart=always
    unchanged.
  steps:
    - >-
      Confirm the baseline and clear A’s old start-limit counter.
    - >-
      Kill A once; check its state after the restart.
    - >-
      Attempt six rapid kills; inspect A’s state and journal, then restore both units.
  answer_with: >-
    Compare A’s state after one crash and after the burst. Quote the start-limit evidence
    and explain why Restart=always did not guarantee another start.
solution: >-
  Restart=always requests a restart, but the start-rate limit can refuse it. One crash can
  remain within the allowance; repeated starts can exhaust it and leave A failed. The journal,
  not a successful response through B, establishes what happened to A. If the limit was
  not reached, report that observation rather than claiming it was.
verify_note: >-
  Both backends are active and the proxy responds successfully.
commands:
  - name: Check baseline and clear the previous start counter
    where: VM terminal 1
    run: !unsafe |
      sudo systemctl reset-failed ce-lab03-a
      systemctl is-active ce-lab03-a ce-lab03-b
      curl -fsS --max-time 3 http://127.0.0.1:8003/
  - name: Kill A once and inspect its recovery
    where: VM terminal 1
    run: !unsafe |
      sudo systemctl kill --kill-whom=main --signal=KILL ce-lab03-a
      sleep 1
      curl -fsS --max-time 3 http://127.0.0.1:8003/
      systemctl show ce-lab03-a -p ActiveState -p NRestarts
    expect: >-
      A should return to active. A successful proxy response alone cannot prove that A restarted.
  - name: Repeat crashes rapidly and inspect the refused restart
    where: VM terminal 1
    run: !unsafe |
      for i in $(seq 1 6); do
        sudo systemctl kill --kill-whom=main --signal=KILL ce-lab03-a || true
        sleep 1
      done
      systemctl show ce-lab03-a -p ActiveState -p Result -p NRestarts
      sudo journalctl -u ce-lab03-a -n 15 --no-pager
    expect: >-
      Look for "Start request repeated too quickly" and a failed unit. Result and restart
      counts can vary with timing and systemd version; check the journal.
  - name: Recover and prove the proxy works again
    where: VM terminal 1
    run: !unsafe |
      sudo systemctl reset-failed ce-lab03-a ce-lab03-b
      sudo systemctl start ce-lab03-a ce-lab03-b
      systemctl is-active ce-lab03-a ce-lab03-b
      # The backends need a moment to bind, and NGINX retries a failed backend after fail_timeout=1s.
      for i in $(seq 1 10); do curl -fsS --max-time 3 http://127.0.0.1:8003/ && break; sleep 0.5; done
optional_explanation: >-
  Optional: disable the start limit on A and repeat. This changes recovery policy, not the
  reason for the crashes. Run the lab reset afterwards to remove the override.
optional_commands:
  - name: Optional A/B change, remove the start limit on A, then repeat the A kill loop
    where: VM terminal 1
    run: !unsafe |
      sudo mkdir -p /etc/systemd/system/ce-lab03-a.service.d
      printf '[Unit]\nStartLimitIntervalSec=0\n' | sudo tee /etc/systemd/system/ce-lab03-a.service.d/override.conf
      sudo systemctl daemon-reload
      sudo systemctl restart ce-lab03-a
      systemctl show ce-lab03-a -p StartLimitIntervalUSec -p StartLimitBurst
      for i in $(seq 1 6); do
        sudo systemctl kill --kill-whom=main --signal=KILL ce-lab03-a || true
        sleep 1
      done
      systemctl show ce-lab03-a -p ActiveState -p Result -p NRestarts
    expect: >-
      StartLimitIntervalUSec=0. This removes the give-up threshold; it does not fix the
      crash.
setup:
  - name: Create the restart-limit fixture
    command: !unsafe |
      sudo install -d -m 0755 /srv/ce-lab03
      printf 'lab03 OK\n' | sudo tee /srv/ce-lab03/index.html >/dev/null
      for pair in a:8001 b:8002; do
        name=${pair%:*}; port=${pair#*:}
        sudo tee "/etc/systemd/system/ce-lab03-$name.service" >/dev/null <<UNIT
      [Unit]
      Description=Chaos lab 03 $name
      StartLimitIntervalSec=20
      StartLimitBurst=4
      [Service]
      ExecStart=/usr/bin/python3 -m http.server $port --bind 127.0.0.1 --directory /srv/ce-lab03
      Restart=always
      RestartSec=200ms
      UNIT
      done
      sudo tee /etc/nginx/conf.d/ce-lab03.conf >/dev/null <<'NGX'
      upstream ce_lab03 { server 127.0.0.1:8001 max_fails=1 fail_timeout=1s; server 127.0.0.1:8002 max_fails=1 fail_timeout=1s; }
      server { listen 127.0.0.1:8003; location / { proxy_pass http://ce_lab03; } }
      NGX
      sudo systemctl daemon-reload
      sudo systemctl start ce-lab03-a ce-lab03-b
      sudo nginx -t
      sudo systemctl restart nginx
verify:
  - name: Verify both backends and proxy baseline
    command: !unsafe |
      systemctl is-active --quiet ce-lab03-a
      systemctl is-active --quiet ce-lab03-b
      curl -fsS --max-time 3 http://127.0.0.1:8003/ | grep -qx 'lab03 OK'
reset:
  - name: Remove only Lab 03 services and proxy configuration
    command: !unsafe |
      sudo systemctl stop ce-lab03-a ce-lab03-b 2>/dev/null || true
      sudo rm -f /etc/systemd/system/ce-lab03-a.service /etc/systemd/system/ce-lab03-b.service /etc/nginx/conf.d/ce-lab03.conf
      sudo rm -rf /etc/systemd/system/ce-lab03-a.service.d /etc/systemd/system/ce-lab03-b.service.d
      sudo systemctl daemon-reload
      sudo nginx -t && sudo systemctl stop nginx || true
