title: "Lab 09 — A syscall denial need not crash the process"
concept: >-
  A syscall requests a kernel operation. Seccomp can filter those requests for a process.
  This program first calls getpid normally, then installs a filter that returns EACCES for
  getpid while allowing other calls. Comparing the same call before and after installation
  isolates the filter’s effect.
mechanism: >-
  The denied syscall returns -1 and sets errno; that does not require the application itself
  to crash. This demonstration prints the result and exits 0 if the denial matched its expectation.
  The filter applies to the process and is inherited by descendants; it is not installed
  in the original shell or unrelated processes.
task:
  question: >-
    What changes when the same process installs a filter that denies getpid?
  brief:
    theory_source: >-
      chaos-theory.md: §6.5.2; optional capability comparison: §5.8.1.
    theory:
      - >-
        A syscall requests a kernel operation. Seccomp can filter those requests for a process.
        This program first calls getpid normally, then installs a filter that returns EACCES
        for getpid while allowing other calls. Comparing the same call before and after
        installation isolates the filter’s effect.
      - >-
        The denied syscall returns -1 and sets errno; that does not require the application
        itself to crash. This demonstration prints the result and exits 0 if the denial
        matched its expectation. The filter applies to the process and is inherited by descendants;
        it is not installed in the original shell or unrelated processes.
    in_this_lab:
      - >-
        Setup compiles filter.c. Run the binary to install the filter only in that test
        process. The capability comparison is optional.
  predict: >-
    Predict getpid’s result before and after the filter, and whether the program can still
    print the error.
  steps:
    - >-
      Run the prepared program and compare getpid before and after filter installation.
    - >-
      Record the syscall result, errno and the program’s exit status.
    - >-
      Inspect Seccomp in a fresh shell command; distinguish its state from the test process’s
      filter.
  answer_with: >-
    Explain the positive PID before filtering, the error afterward and why exit 0 means
    the demonstration detected the intended denial.
solution: >-
  Before the filter, getpid returns the process ID. Afterward, the filter makes it return
  -1 with errno 13 (EACCES). Printing still works because the filter allows other syscalls.
  The program’s exit 0 reports a successful check of the denial, not a successful getpid
  call. Exit 1–3 means filter setup failed; exit 4 means the expected denial was not observed.
verify_note: >-
  The demonstration has exited; the filter was scoped to that process. Reset removes the
  compiled fixture.
commands:
  - name: Run the prepared seccomp demonstration
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab09
      ./filter; echo "exit=$?"
    expect: >-
      Before filtering, getpid prints a positive PID. After filtering, getpid result=-1
      errno=13 and exit=0. Exit 1–3 means filter setup failed; 4 means the expected denial
      did not occur.
  - name: Check an unrelated process after the test exits
    where: VM terminal 1
    run: !unsafe |
      grep Seccomp /proc/self/status
    expect: >-
      This fresh process has its own Seccomp state. An existing inherited filter can be
      present; the test did not install a host-wide policy.
setup:
  - name: Create the Lab 09 workspace
    command: !unsafe |
      mkdir -p "$HOME/labs/lab09"
  - name: Build the seccomp demonstration
    command: !unsafe |
      mkdir -p ~/labs/lab09 && cd ~/labs/lab09
      cat > filter.c <<'C'
      #include <seccomp.h>
      #include <unistd.h>
      #include <sys/syscall.h>
      #include <errno.h>
      #include <stdio.h>
      int main(void) {
          printf("before filter: getpid=%ld\n", syscall(SYS_getpid));
          scmp_filter_ctx ctx = seccomp_init(SCMP_ACT_ALLOW);
          if (!ctx) return 1;
          if (seccomp_rule_add(ctx, SCMP_ACT_ERRNO(EACCES), SCMP_SYS(getpid), 0) < 0)
              return 2;
          if (seccomp_load(ctx) < 0) return 3;
          seccomp_release(ctx);
          errno = 0;
          long r = syscall(SYS_getpid);
          printf("getpid result=%ld errno=%d\n", r, errno);
          return (r == -1 && errno == EACCES) ? 0 : 4;
      }
      C
      cc -Wall -Wextra filter.c -lseccomp -o filter
verify:
  - name: Verify seccomp build prerequisites
    command: !unsafe |
      test -f /usr/include/seccomp.h
      docker info >/dev/null
      test -s "$HOME/labs/lab09/filter"
      test -x "$HOME/labs/lab09/filter"
reset:
  - name: Remove only the Lab 09 compiled filter
    command: !unsafe |
      rm -f "$HOME/labs/lab09/filter"
optional_commands:
  - name: Remove one capability
    where: VM terminal 1
    run: !unsafe |
      docker run --rm ubuntu:24.04 chroot / true; echo "default exit=$?"
      docker run --rm --cap-drop SYS_CHROOT ubuntu:24.04 chroot / true; echo "no SYS_CHROOT exit=$?"
      docker run --rm --cap-drop ALL ubuntu:24.04 sh -c 'grep CapEff /proc/self/status'
    expect: >-
      The first exits 0; the second prints "chroot: cannot change root directory to '/':
      Operation not permitted"; CapEff is 0000000000000000.
optional_explanation: >-
  Optional: contrast seccomp with capabilities. SYS_CHROOT authorizes a privileged operation;
  dropping it can deny chroot even as root. Seccomp instead filters syscall attempts. The
  comparisons change one control at a time, since an error message alone does not identify
  the denying layer.
