title: 'Lab 20 — Retries under a short slowdown'
concept: >-
  A user intent is one desired operation; an attempt is one execution of it. Retries can improve success during brief failures, but retries at several layers multiply demand. For example, up to two client attempts and two proxy attempts per client attempt can produce four backend attempts. Actual amplification depends on which failures trigger retries and whether earlier attempts succeed.
mechanism: >-
  When a timeout expires, the caller may retry while the previous backend request is still executing or queued. Slow work occupies limited worker slots longer, which increases waiting, triggers more timeouts and adds further attempts. This feedback can outlast the original slowdown; persistent failure under continued load is metastability. The lab compares bounded runs so amplification and recovery can be measured rather than assumed.
solution: 'Use Lab 20 to create the two upstreams and proxy, apply the same five-second delay with one then zero client retries, and calculate arrivals divided by 80 intents.'
verify_note: 'Ports 8090 and 9001–9002 are free before setup and the NGINX configuration is removed on reset.'
commands:
  - name: Save the concurrency-limited upstream and the finite client
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab20
      cat > upstream.py <<'PY'
      import sys, time, threading
      from pathlib import Path
      from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
      port=int(sys.argv[1]); shed=len(sys.argv)>2 and sys.argv[2]=='shed'
      slots=threading.BoundedSemaphore(4)
      lock=threading.Lock(); counts={'arrived':0,'done':0,'shed':0}
      class H(BaseHTTPRequestHandler):
          def do_GET(self):
              with lock: counts['arrived']+=1
              acquired=slots.acquire(timeout=0.2 if shed else 10)
              if not acquired:
                  with lock: counts['shed']+=1
                  self.send_response(503); self.end_headers(); return
              try:
                  try: delay=float(Path('delay.txt').read_text())
                  except (ValueError,FileNotFoundError): delay=0.2
                  time.sleep(min(max(delay,0),2))
                  with lock: counts['done']+=1
                  self.send_response(200); self.end_headers()
                  try: self.wfile.write(b'ok\n')
                  except (BrokenPipeError,ConnectionResetError): pass
              finally: slots.release()
          def log_message(self,*args): pass
      def report():
          while True:
              time.sleep(1)
              with lock: sample=counts.copy()
              print(time.time(),port,sample,flush=True)
      threading.Thread(target=report,daemon=True).start()
      ThreadingHTTPServer(('127.0.0.1',port),H).serve_forever()
      PY
      cat > client.py <<'PY'
      import sys,time,urllib.request,urllib.error
      from concurrent.futures import ThreadPoolExecutor
      retries=int(sys.argv[1]) if len(sys.argv)>1 else 1
      def request(i):
          begin=time.monotonic(); outcome='failed'
          for attempt in range(retries+1):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8090/',timeout=2) as r:
                      if r.status==200: outcome='200'; break
              except (urllib.error.URLError,TimeoutError,OSError): pass
              if attempt<retries: time.sleep(0.2)
          print(i,outcome,attempt+1,round(time.monotonic()-begin,3),flush=True)
      with ThreadPoolExecutor(max_workers=8) as pool:
          futures=[]
          for i in range(80):
              futures.append(pool.submit(request,i))
              time.sleep(0.25)
          for f in futures: f.result()
      PY
  - name: Start both upstreams, pass the checkpoint, record pre-test arrivals
    where: VM terminal 1, same shell
    run: !unsafe |
      cd ~/labs/lab20
      echo 0.2 > delay.txt
      python3 upstream.py 9001 > upstream1.log 2>&1 & first=$!
      python3 upstream.py 9002 > upstream2.log 2>&1 & second=$!
      sleep 1
      curl -fsS --max-time 2 http://127.0.0.1:8090/
      arrived() { tail -n1 "$1" | sed -E "s/.*'arrived': ([0-9]+).*/\1/"; }
      sleep 2
      pre=$(( $(arrived upstream1.log) + $(arrived upstream2.log) ))
      echo "pre-test arrivals=$pre"
    expect: >-
      ok from the proxy and pre-test arrivals=1 (the checkpoint curl).
  - name: Run 80 intents with one client retry
    where: VM terminal 1, same shell
    run: !unsafe |
      python3 client.py 1 | tee client-retries.log
  - name: Start right after the client, a five-second slowdown after five seconds
    where: VM terminal 2
    run: !unsafe |
      cd ~/labs/lab20
      sleep 5; echo 1 > delay.txt; sleep 5; echo 0.2 > delay.txt
  - name: Let backend work drain, then calculate amplification and outcomes
    where: VM terminal 1, same shell
    run: !unsafe |
      sleep 5
      total=$(( $(arrived upstream1.log) + $(arrived upstream2.log) - pre ))
      echo "backend arrivals=$total amplification=$(echo "scale=2; $total/80" | bc)"
      awk '{outcome[$2]++; attempts+=$3} END {for (o in outcome) print "outcome", o, outcome[o]; print "client attempts", attempts}' client-retries.log
      tail -n1 upstream1.log upstream2.log
    expect: >-
      Amplification is typically above 1.0: proxy retries (up to 2 per client attempt) plus client retries multiply backend arrivals during the slowdown.
  - name: Reset counters by restarting the exact upstream PIDs, then repeat with zero client retries
    where: VM terminal 1, same shell
    run: !unsafe |
      kill "$first" "$second"; wait "$first" "$second" 2>/dev/null
      echo 0.2 > delay.txt
      python3 upstream.py 9001 > upstream1.log 2>&1 & first=$!
      python3 upstream.py 9002 > upstream2.log 2>&1 & second=$!
      sleep 1
      curl -fsS --max-time 2 http://127.0.0.1:8090/
      sleep 2
      pre=$(( $(arrived upstream1.log) + $(arrived upstream2.log) ))
      python3 client.py 0 | tee client-no-retries.log
  - name: Same slowdown for the zero-retry run (start right after that client)
    where: VM terminal 2
    run: !unsafe |
      cd ~/labs/lab20
      sleep 5; echo 1 > delay.txt; sleep 5; echo 0.2 > delay.txt
  - name: Compare the zero-retry run
    where: VM terminal 1, same shell
    run: !unsafe |
      sleep 5
      total=$(( $(arrived upstream1.log) + $(arrived upstream2.log) - pre ))
      echo "backend arrivals=$total amplification=$(echo "scale=2; $total/80" | bc)"
      awk '{outcome[$2]++; attempts+=$3} END {for (o in outcome) print "outcome", o, outcome[o]; print "client attempts", attempts}' client-no-retries.log
  - name: Clean up
    where: VM terminal 1, same shell
    run: !unsafe |
      echo 0.2 > delay.txt
      kill "$first" "$second"; wait "$first" "$second" 2>/dev/null || true
      sudo rm -f /etc/nginx/conf.d/ce-lab20.conf
      sudo nginx -t && sudo systemctl reload nginx
setup:
  - name: Prepare the retry-lab directory and baseline delay file
    command: |
      mkdir -p "$HOME/labs/lab20"
      printf '0.2\n' > "$HOME/labs/lab20/delay.txt"
  - name: Install the exact Lab 20 NGINX proxy configuration
    command: |
      sudo tee /etc/nginx/conf.d/ce-lab20.conf >/dev/null <<'NGX'
      upstream ce_lab20 { server 127.0.0.1:9001 max_fails=0; server 127.0.0.1:9002 max_fails=0; }
      server {
        listen 127.0.0.1:8090;
        location / {
          proxy_pass http://ce_lab20;
          proxy_connect_timeout 1s;
          proxy_read_timeout 500ms;
          proxy_next_upstream error timeout;
          proxy_next_upstream_tries 2;
        }
      }
      NGX
      sudo nginx -t
      sudo systemctl restart nginx
verify:
  - name: Verify retry-lab static prerequisites
    command: |
      test -f "$HOME/labs/lab20/delay.txt"
      sudo nginx -t
reset:
  - name: Restore delay and remove only the Lab 20 proxy configuration
    command: |
      printf '0.2\n' > "$HOME/labs/lab20/delay.txt"
      sudo rm -f /etc/nginx/conf.d/ce-lab20.conf
      sudo nginx -t && sudo systemctl stop nginx || true
