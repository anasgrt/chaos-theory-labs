title: 'Lab 14 — Browser delay, failure, and stale data'
concept: >-
  Browser resilience covers waiting, errors and the truthfulness of displayed data. A request can fail at transport level, return an HTTP error, or succeed with content the application cannot use. These require deliberate UI handling. Leaving the previous result visible without marking it as stale can make a failed refresh look successful, even though nothing current was retrieved.
mechanism: >-
  The temporary fetch wrapper either waits before calling the original function or rejects the promise without sending a request. This separates application waiting from network timing. A real HTTP 404 or 500 normally resolves fetch, so response.ok must be checked; transport failure can reject it. Measure click-to-result time, then compare synthetic failure with browser request blocking to understand what each injection actually models.
solution: 'Serve the prepared fixture, establish the documented SSH tunnel, then use Lab 14 to compare baseline, alternate synthetic delay/failure, DevTools blocking, and recovery.'
verify_note: 'The browser fixture exists; the browser-side injection is removed by refresh and any server PID is exact-scoped.'
commands:
  - name: Serve the fixture in the foreground
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab14
      python3 -m http.server 8081 --bind 127.0.0.1
  - name: Open the tunnel (leave it running)
    where: Mac host, project folder
    run: !unsafe |
      vagrant ssh -- -N -L 8081:127.0.0.1:8081
  - name: Baseline, open DevTools Network and click Load data three times
    where: Browser on the Mac
    run: !unsafe |
      http://localhost:8081
    expect: >-
      One data.json request per click, HTTP 200, "fresh data" shown. Record the durations.
  - name: Inject 1 s delay and alternate failures (paste once into this page's console)
    where: Browser DevTools console
    run: !unsafe |
      window.ceOriginalFetch = window.fetch;
      window.ceCount = 0;
      window.fetch = async function (...args) {
        window.ceCount++;
        if (window.ceCount % 2 === 0) throw new TypeError('Injected network failure');
        await new Promise(resolve => setTimeout(resolve, 1000));
        return window.ceOriginalFetch.apply(this, args);
      };
    expect: >-
      Odd clicks show fresh data after about 1 s, while the network row stays short. Even clicks show "Unavailable: Injected network failure" and create no network request.
  - name: Zero-code failure, refresh, block data.json (DevTools request blocking or Offline), click, then unblock and reload
    where: Browser DevTools
    run: !unsafe |
      Network panel > right-click data.json > Block request URL   (or throttling: Offline)
    expect: >-
      "Unavailable: Failed to fetch" (wording varies by browser) with a blocked or failed request row. After unblocking and reloading, a click shows fresh data.
  - name: Stop the server after the recovery click succeeds (Ctrl-C), then stop the tunnel
    where: VM terminal 1 and Mac host
    run: !unsafe |
      Ctrl-C
setup:
  - name: Create the local browser fixture
    command: |
      mkdir -p "$HOME/labs/lab14"
      printf '{"value":"fresh data"}\n' > "$HOME/labs/lab14/data.json"
      cat > "$HOME/labs/lab14/index.html" <<'HTML'
      <!doctype html><meta charset="utf-8"><title>Browser chaos lab</title>
      <button id="load">Load data</button><pre id="result">No data yet</pre>
      <script>
      document.querySelector('#load').onclick = async () => {
        const box = document.querySelector('#result');
        try { const r = await fetch('/data.json?t='+Date.now()); if (!r.ok) throw new Error('HTTP '+r.status); box.textContent = (await r.json()).value; }
        catch (e) { box.textContent = 'Unavailable: '+e.message; }
      };
      </script>
      HTML
verify:
  - name: Verify the fixture files
    command: |
      test -s "$HOME/labs/lab14/index.html"
      test -s "$HOME/labs/lab14/data.json"
reset:
  - name: Stop only the Lab 14 HTTP server
    command: |
      pid_file="$HOME/labs/lab14/server.pid"
      if [[ -f "$pid_file" ]] && [[ "$(cat "$pid_file")" =~ ^[0-9]+$ ]]; then kill "$(cat "$pid_file")" 2>/dev/null || true; fi
      rm -f "$pid_file"
