title: "Lab 01 — A timeout makes a silent failure manageable"
concept: >-
  An exception handler runs only after an operation raises an error. A refused TCP connection
  produces an error promptly. Silently discarded packets provide no reply, so the connection
  attempt can keep waiting before the handler is reached.
mechanism: >-
  An application timeout limits that wait and lets the operation raise an error the handler
  can catch. A connect timeout bounds connection establishment; a read timeout bounds waiting
  after connection. The external watchdog instead terminates the test process. It keeps
  the experiment short but does not make the application handle the dependency failure.
task:
  question: >-
    Why does the exception handler run after refusal but not while packets are silently
    dropped?
  brief:
    theory_source: >-
      chaos-theory.md: §1.5 and Experiment Card 1.1.
    theory:
      - >-
        An exception handler runs only after an operation raises an error. A refused TCP
        connection produces an error promptly. Silently discarded packets provide no reply,
        so the connection attempt can keep waiting before the handler is reached.
      - >-
        An application timeout limits that wait and lets the operation raise an error the
        handler can catch. A connect timeout bounds connection establishment; a read timeout
        bounds waiting after connection. The external watchdog instead terminates the test
        process. It keeps the experiment short but does not make the application handle
        the dependency failure.
    in_this_lab:
      - >-
        One ce-lab01 firewall rule targets TCP 127.0.0.1:6379. All fault runs use a five-second
        watchdog; TIMEOUT=0.5 sets the client timeouts.
  predict: >-
    Predict which of the three attempts reaches the handler: REJECT, DROP, and DROP with
    a 0.5-second timeout.
  steps:
    - >-
      Confirm the prepared client succeeds without a fault.
    - >-
      Run the prepared comparison and record each result and wait time.
    - >-
      Confirm the client succeeds after cleanup. Explain which limit belongs to the application
      and which belongs to the test.
  answer_with: >-
    For each attempt, state whether the handler ran and what ended the wait. Use those observations
    to explain why catching errors alone does not bound waiting.
solution: >-
  REJECT should reach the handler quickly. DROP without an application timeout should reach
  the five-second watchdog instead. With TIMEOUT=0.5, the client should handle the timeout
  near half a second. The handler needs an error; it does not create a time limit.
verify_note: >-
  The client succeeds again and no ce-lab01 rule remains.
commands:
  - name: Check the Redis baseline
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab01
      redis-cli ping
      python3 client.py
    expect: >-
      PONG, then OK True.
  - name: Predict, run, then prove recovery
    where: VM terminal 1
    run: !unsafe |
      cd ~/labs/lab01
      bash run.sh
      python3 client.py
      sudo iptables -S OUTPUT | grep ce-lab01; echo "grep exit=$? (1 means no lab rule remains)"
    expect: >-
      REJECT prints DEGRADED ConnectionError within milliseconds. DROP without a timeout
      prints nothing and is stopped by the external watchdog (exit=124). DROP with TIMEOUT=0.5
      prints DEGRADED TimeoutError near 0.5 s. The ce-lab01 rule shows pkts above 0. The
      final client prints OK True.
  - name: Manual rule removal, only if run.sh was killed
    where: VM terminal 2
    run: !unsafe |
      sudo iptables -D OUTPUT -p tcp -d 127.0.0.1 --dport 6379 -m comment --comment ce-lab01 -j DROP
      sudo iptables -D OUTPUT -p tcp -d 127.0.0.1 --dport 6379 -m comment --comment ce-lab01 -j REJECT --reject-with tcp-reset
      python3 ~/labs/lab01/client.py
setup:
  - name: Start the dedicated Redis dependency
    command: !unsafe |
      sudo systemctl start redis-server
  - name: Prepare the Redis client
    command: !unsafe |
      mkdir -p "$HOME/labs/lab01"
      cd "$HOME/labs/lab01"
      cat > client.py <<'PY'
      import os, time, redis
      from redis.retry import Retry
      from redis.backoff import NoBackoff
      t = float(os.environ['TIMEOUT']) if 'TIMEOUT' in os.environ else None
      c = redis.Redis(host='127.0.0.1', port=6379,
          socket_connect_timeout=t, socket_timeout=t,
          retry=Retry(NoBackoff(), 0))
      start = time.monotonic()
      try:
          print('OK', c.ping())
      except redis.exceptions.RedisError as exc:
          print('DEGRADED', type(exc).__name__)
      print(f'elapsed={time.monotonic()-start:.3f}s')
      PY
  - name: Prepare the bounded comparison script
    command: !unsafe |
      cd ~/labs/lab01
      cat > run.sh <<'SH'
      #!/usr/bin/env bash
      set -u
      rule=(-p tcp -d 127.0.0.1 --dport 6379 -m comment --comment ce-lab01)
      cleanup() {
        sudo iptables -D OUTPUT "${rule[@]}" -j DROP 2>/dev/null || true
        sudo iptables -D OUTPUT "${rule[@]}" -j REJECT --reject-with tcp-reset 2>/dev/null || true
      }
      trap cleanup EXIT
      trap 'exit 130' INT TERM
      sudo -v || exit 1
      cleanup
      echo 'REJECT'
      sudo iptables -I OUTPUT 1 "${rule[@]}" -j REJECT --reject-with tcp-reset || exit 1
      timeout 5s python3 client.py; echo "exit=$?"
      cleanup
      echo 'DROP, no application timeout'
      sudo iptables -I OUTPUT 1 "${rule[@]}" -j DROP || exit 1
      timeout 5s python3 client.py; echo "exit=$?"
      echo 'DROP, 0.5-second application timeout'
      TIMEOUT=0.5 timeout 5s python3 client.py; echo "exit=$?"
      echo 'Rule counters after the DROP runs (pkts must be above 0)'
      sudo iptables -nvL OUTPUT --line-numbers | grep -E 'num|ce-lab01'
      SH
verify:
  - name: Verify Redis and firewall recovery
    command: !unsafe |
      redis-cli ping | grep -qx PONG
      ! sudo iptables -S OUTPUT | grep -q -- '--comment ce-lab01'
      test -s "$HOME/labs/lab01/client.py"
      test -s "$HOME/labs/lab01/run.sh"
reset:
  - name: Remove only Lab 01 firewall rules
    command: !unsafe |
      rule=(-p tcp -d 127.0.0.1 --dport 6379 -m comment --comment ce-lab01)
      sudo iptables -D OUTPUT "${rule[@]}" -j DROP 2>/dev/null || true
      sudo iptables -D OUTPUT "${rule[@]}" -j REJECT --reject-with tcp-reset 2>/dev/null || true
  - name: Return Redis to its shared baseline state
    command: !unsafe |
      sudo systemctl stop redis-server
