title: "Lab 13 — Losing supervision does not stop the process"
concept: >-
  Kubelet supervises assigned containers and reports node status. The container runtime
  is separate, so stopping kubelet does not inherently stop existing application processes.
  It does stop the normal reporting and reconciliation path.
mechanism: >-
  The control plane first detects missing reports, then waits through applicable eviction
  tolerations before replacing the workload. Scheduling and startup take more time. Meanwhile,
  an API object being deleted does not prove its process stopped on the disconnected node.
  Inspect the runtime as well as the Pod list.
task:
  question: >-
    Why can Kubernetes replace a Pod while its original container is still running?
  brief:
    theory_source: >-
      chaos-theory.md: §§12.1.1–12.1.3 (kubelet experiment ideas).
    theory:
      - >-
        Kubelet supervises assigned containers and reports node status. The container runtime
        is separate, so stopping kubelet does not inherently stop existing application processes.
        It does stop the normal reporting and reconciliation path.
      - >-
        The control plane first detects missing reports, then waits through applicable eviction
        tolerations before replacing the workload. Scheduling and startup take more time.
        Meanwhile, an API object being deleted does not prove its process stopped on the
        disconnected node. Inspect the runtime as well as the Pod list.
    in_this_lab:
      - >-
        Stop only kubelet in the node actually hosting node-web. Read the Pod's tolerations;
        observe for at most eight minutes, then restore kubelet.
  predict: >-
    Predict whether stopping kubelet immediately stops the container, and whether detection
    and replacement occur together.
  steps:
    - >-
      Record the actual node, Pod identity and tolerations; start timestamped node and Pod
      watches.
    - >-
      Stop kubelet on that node and check the original container with crictl.
    - >-
      Observe detection and replacement, checking runtime state too; stop waiting after
      eight minutes.
    - >-
      Restart kubelet and confirm four Ready nodes and one Ready node-web Pod.
  answer_with: >-
    Compare the node/Pod timeline with crictl on the original node. Explain why control-plane
    replacement does not establish that the old process stopped.
solution: >-
  Missing kubelet reports trigger detection and eviction, not an immediate process kill.
  Replacement includes several waits, while the old runtime may keep serving its container.
  Restoring kubelet allows that node to reconcile and clean up.
verify_note: >-
  Kubelet is running, four nodes are Ready and one node-web Pod is Ready.
commands:
  - name: Find the worker running node-web and inspect its tolerations
    where: VM terminal 1
    run: !unsafe |
      source ~/labs/common.sh
      k rollout status deployment/node-web --request-timeout=0 --timeout=180s
      k get pods -l app=node-web -o wide
      NODE=$(k get pods -l app=node-web -o jsonpath='{.items[0].spec.nodeName}')
      echo "NODE=$NODE"
      k get pods -l app=node-web -o jsonpath='{.items[0].spec.tolerations}'; echo
    expect: >-
      The pod is Ready on chaos-worker (the affinity is only preferred, so it can land on
      another worker; every later command uses $NODE). The not-ready and unreachable NoExecute
      tolerations have tolerationSeconds 300.
  - name: Timestamped node watch
    where: VM terminal 2
    run: !unsafe |
      source ~/labs/common.sh
      k get nodes --request-timeout=0 -w | while IFS= read -r line; do printf '%s %s\n' "$(date +%T)" "$line"; done
  - name: Timestamped pod watch
    where: VM terminal 3
    run: !unsafe |
      source ~/labs/common.sh
      k get pods -l app=node-web -o wide --request-timeout=0 -w | while IFS= read -r line; do printf '%s %s\n' "$(date +%T)" "$line"; done
  - name: Stop only kubelet on that worker
    where: VM terminal 1, same shell
    run: !unsafe |
      date --iso-8601=seconds
      docker exec "$NODE" systemctl stop kubelet
      docker exec "$NODE" crictl ps --name web
    expect: >-
      The web container is still Running although kubelet stopped.
  - name: Sample detection, taints and eviction (repeat every minute; stop after eight minutes
      without a replacement)
    where: VM terminal 1, same shell
    run: !unsafe |
      date --iso-8601=seconds
      k get node "$NODE"
      k get node "$NODE" -o jsonpath='{.spec.taints}'; echo
      k get pods -l app=node-web -o wide
      docker exec "$NODE" crictl ps --name web
    expect: >-
      After the node-monitor grace period (50 s on Kubernetes v1.37) the node turns NotReady
      with node.kubernetes.io/unreachable taints. About 300 s after that the old pod goes
      Terminating and a replacement starts on another worker, while crictl still shows the
      old container running.
  - name: Restore kubelet before any other fault
    where: VM terminal 1, same shell
    run: !unsafe |
      docker exec "$NODE" systemctl start kubelet
      k wait --for=condition=Ready "node/$NODE" --request-timeout=0 --timeout=180s
      k rollout status deployment/node-web --request-timeout=0 --timeout=180s
      k get nodes
      k get pods -l app=node-web -o wide
    expect: >-
      All four nodes Ready and one Ready node-web pod on another worker. The old pod can
      still show Terminating for up to a minute while the restored kubelet stops its container.
      Stop the watches with Ctrl-C.
setup:
  - name: Create the guide's node-web workload preferring chaos-worker
    command: !unsafe |
      mkdir -p "$HOME/labs/lab10"
      cat > "$HOME/labs/lab10/node-web.yaml" <<'YAML'
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: node-web}
      spec:
        replicas: 1
        selector: {matchLabels: {app: node-web}}
        template:
          metadata: {labels: {app: node-web}}
          spec:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                    - {key: kubernetes.io/hostname, operator: In, values: [chaos-worker]}
            containers:
            - name: web
              image: nginx:1.27
              readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 2}
      YAML
      k() { kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs "$@"; }
      k apply -f "$HOME/labs/lab10/node-web.yaml"
      k rollout status deployment/node-web --timeout=180s
verify:
  - name: Verify a ready node-web baseline
    command: !unsafe |
      k() { kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs "$@"; }
      test "$(k get pods -l app=node-web --no-headers | awk '$2 == "1/1" && $3 == "Running" {count++} END {print count+0}')" = 1
      node=$(k get pods -l app=node-web -o jsonpath='{.items[0].spec.nodeName}')
      docker exec "$node" systemctl is-active --quiet kubelet
reset:
  - name: Restore kubelet on dedicated chaos workers and remove node-web
    command: !unsafe |
      for worker in chaos-worker chaos-worker2 chaos-worker3; do
        docker inspect "$worker" >/dev/null 2>&1 && docker exec "$worker" systemctl start kubelet || true
      done
      kubectl --kubeconfig="$HOME/labs/chaos.kubeconfig" --context=kind-chaos --namespace=chaos-labs delete deployment node-web --ignore-not-found || true
