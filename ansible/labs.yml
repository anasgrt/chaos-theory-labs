---
- name: Run one Chaos Lab lifecycle action
  hosts: chaos_labs
  gather_facts: false
  vars_files:
    - ../config/platform.yml
  vars:
    lab_action: setup
    lab_definition: ''
    lab_id: "{{ lab_definition | dirname | basename | regex_replace('-.*$', '') }}"
    lab_home: /home/vagrant
    lab_root: "{{ lab_home }}/labs"
    lab_workspace: "{{ lab_root }}/lab{{ lab_id }}"
    lab_cluster: "lab{{ lab_id }}"
    # Public CA only; the lab user reads this copy, never the platform private key.
    lab_rancher_ca: "{{ lab_home }}/rancher/ca.crt"
    # Local file for plain-text output; set by lab.sh.
    lab_text_output: ''

  pre_tasks:
    - name: Validate the lifecycle action
      ansible.builtin.assert:
        that: lab_action in ['setup', 'verify', 'reset']
        fail_msg: Use lab.sh NN setup, verify or reset. Cards use the local reader.

    - name: Validate the selected lab definition
      ansible.builtin.assert:
        that:
          - lab_definition | length > 0
          - lab_id is match('^[0-9]{2}$')
          - lab_definition | basename == 'lab.yml'
          - (lab_definition | dirname | basename).startswith(lab_id + '-')
        fail_msg: Select a lab through lab.sh.

    - name: Load the selected lab definition
      ansible.builtin.include_vars:
        file: "{{ lab_definition }}"
        name: selected_lab

    - name: Validate the lab task
      ansible.builtin.assert:
        that:
          - selected_lab.task is mapping
          - selected_lab.task.question | default('') | length > 0
          - selected_lab.task.brief.theory | default([]) | length > 0
          - selected_lab.task.brief.in_this_lab | default([]) | length > 0
          - selected_lab.task.predict | default('') | length > 0
          - selected_lab.task.brief.readings | default([]) | length > 0
          - selected_lab.task.evidence.columns | default([]) | length > 0
          - selected_lab.task.evidence.rows | default([]) | length > 0
          - selected_lab.task.transfer | default('') | length > 0
          - selected_lab.transfer_solution | default('') | length > 0
          - selected_lab.prerequisites | default('') | length > 0
          - selected_lab.task.answer_with | default('') | length > 0
          - selected_lab.commands | default([]) | length > 0
        fail_msg: "{{ lab_definition }} is incomplete; run scripts/check-labs.py for the content contract."

    - name: Enforce the shared VM boundary
      ansible.builtin.include_tasks: tasks/identity.yml

    - name: Check shared provisioning is complete
      ansible.builtin.stat:
        path: "{{ lab_root }}/.provisioned"
      register: shared_provisioning

    - name: Require the shared prerequisites
      ansible.builtin.assert:
        that: shared_provisioning.stat.exists
        fail_msg: Run ./lab.sh provision once before setting up labs.

    - name: Read the shared provisioning generation
      ansible.builtin.slurp:
        src: "{{ lab_root }}/.provisioned"
      register: provisioning_generation
      when: lab_action != 'reset'

    - name: Require the Rancher and RKE2 environment before starting labs
      ansible.builtin.assert:
        that: (provisioning_generation.content | b64decode | trim) == 'shared-rke2-rancher-v2'
        fail_msg: Run ./lab.sh provision to install and verify Rancher and RKE2 first.
      when: lab_action != 'reset'

  tasks:
    - name: Clean only the selected lab before setup or reset
      ansible.builtin.include_tasks: tasks/reset.yml
      when: lab_action in ['setup', 'reset']

    - name: Create the selected lab workspace
      ansible.builtin.file:
        path: "{{ lab_workspace }}"
        state: directory
        mode: '0755'
      when: lab_action == 'setup'

    - name: Show the lab model before setup
      ansible.builtin.debug:
        msg:
          - "{{ selected_lab.title }}"
          - "Question: {{ selected_lab.task.question }}"
      when: lab_action == 'setup'

    - name: Install this lab's Kubernetes command helper
      ansible.builtin.template:
        src: lab-env.sh.j2
        dest: "{{ lab_workspace }}/env.sh"
        mode: '0644'
      when: lab_action == 'setup' and selected_lab.kubernetes | default(false)

    - name: Prepare an independent Kubernetes cluster when required
      ansible.builtin.include_tasks: tasks/kubernetes.yml
      when: lab_action == 'setup' and selected_lab.kubernetes | default(false)

    - name: Show this lab's cluster in Rancher
      ansible.builtin.include_tasks: tasks/rancher-import.yml
      when:
        - lab_action == 'setup'
        - selected_lab.kubernetes | default(false)
        - rancher_import_labs | default(true)

    - name: Install files owned by the selected lab
      ansible.builtin.include_tasks: tasks/fixtures.yml
      when: lab_action == 'setup'

    - name: Set up the selected lab
      ansible.builtin.shell: |
        set -euo pipefail
        {{ item.command }}
      args:
        executable: /bin/bash
      loop: "{{ selected_lab.setup | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: lab_action == 'setup'

    - name: Verify the selected lab
      ansible.builtin.shell: |
        set -euo pipefail
        {{ item.command }}
      args:
        executable: /bin/bash
      loop: "{{ selected_lab.verify | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: lab_action in ['setup', 'verify']
      changed_when: false

    # Rendered as plain text on the controller: debug output would JSON-escape
    # the quotes and newlines that heredocs and scripts need to stay pasteable.
    - name: Render the lab task
      ansible.builtin.template:
        src: task.txt.j2
        dest: "{{ lab_text_output }}"
        mode: '0600'
      delegate_to: localhost
      check_mode: false
      when: lab_action == 'setup' and lab_text_output | length > 0

    - name: Show the lab task
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.template', 'task.txt.j2') }}"
      when: lab_action == 'setup' and lab_text_output | length == 0
